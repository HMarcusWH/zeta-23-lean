name: PR300 guarded one-shot post299 RHKG refresh

# Independently rebuild and double-check deterministic derived state for the
# exact reviewed parity successor. The accepted PR299 source stays immutable.
# No conjecture or source inequality is promoted by this workflow.

on:
  push:
    branches: [research/step4-parity-moment-shift-20261113]
    paths:
      - .github/workflows/rhrc_post299_rhkg_refresh.yml
      - research/RHRC/integration/opica_composition/post299/descendant.py
  workflow_dispatch:
    inputs:
      refresh_generated_state:
        description: "Explicit one-shot exact-source post299 RHKG refresh"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pr300-one-shot-derived-state-refresh
  cancel-in-progress: false

jobs:
  materialize-and-commit:
    if: >-
      github.ref == 'refs/heads/research/step4-parity-moment-shift-20261113' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(PR300): one-shot RHKG refresh')) ||
       (github.event_name == 'workflow_dispatch' && inputs.refresh_generated_state == true))
    runs-on: ubuntu-latest
    # Full 2,766-root regeneration + independent post-commit recheck exceeded
    # the former 90-minute limit on run 38815669679; retain all proof gates.
    # The initial no-write freshness observation may itself walk every root.
    # Preserve the write and two independent full checks even on late drift.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Pin exact source head and validate proof registry before regeneration
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/research/step4-parity-moment-shift-20261113) ;;
            *) echo 'Ref outside the sole authorized PR300 source branch'; exit 1 ;;
          esac
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all -- '*.lean' lean-toolchain lake-manifest.json lakefile.lean lakefile.toml)"
          # Post299 has an independent closed-source contract; legacy Round4
          # provenance is preserved and replayed from the exact PR299 merge tree.
          python -B -m research.RHRC.integration.opica_composition.post299.descendant --selftest
          python -B -m research.RHRC.integration.opica_composition.cli inspect \
            --repo . --output /tmp/post299-scope-prerefresh.json
          git worktree add --detach /tmp/post299-accepted-parent df914f38f26bdc4109aeaa13f48b3896c3bc61b1
          test "$(git -C /tmp/post299-accepted-parent rev-parse HEAD^{tree})" = "5fc2aa4793b658c58dd89c1d36b0ceee756d400d"
          (cd /tmp/post299-accepted-parent &&
           python3 -B -m research.RHRC.integration.opica_composition.cli inspect \
             --repo . --output /tmp/post299-legacy-v1-replay.json)
          git worktree remove --force /tmp/post299-accepted-parent
          # Classify every tracked file before the expensive 2,766-root Lean walk.
          # Historic .lean snippets remain audit-only fixtures, never theorem roots.
          python research/RHRC/graph/tests/test_post292_review_file_classes.py
          python -O research/RHRC/graph/tests/test_post292_review_file_classes.py
          python research/RHRC/integration/test_source_only_dependency_extract.py
          python -O research/RHRC/integration/test_source_only_dependency_extract.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_formal_receipt.py
          python -O research/RHRC/routes/R003_ccm_bridge/post290/test_formal_receipt.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_d2_source_equivalence.py
          python -O research/RHRC/routes/R003_ccm_bridge/post290/test_d2_source_equivalence.py
          export POST290_CHECKED_HEAD="$(git rev-parse HEAD)"
          export POST290_CHECKED_TREE="$(git rev-parse HEAD^{tree})"
          lake build \
            Zeta23.RHRC.RegisteredClaimBindings \
            Zeta23.RHRC.DeclarationDependencyExport \
            Zeta23.RHRC.SourceCandidateResolution \
            Zeta23.RHRC.Step123OutputBindings
          python research/RHRC/tools/registered_theorem_binding_lint.py
          python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope promoted
          mkdir -p /tmp/pr300-rhkg
          lake env lean Zeta23/RHRC/Step123OutputBindings.lean > /tmp/pr300-rhkg/pre-bindings.log
          python research/RHRC/routes/R003_ccm_bridge/post290/build_formal_receipt.py \
            --log /tmp/pr300-rhkg/pre-bindings.log \
            --out /tmp/pr300-rhkg/pre-compiler-receipt.json
      - name: Record no-write freshness before intentional regeneration
        shell: bash
        run: |
          set -euo pipefail
          if python research/RHRC/tools/materialize_derived_state.py --check \
              > /tmp/pr300-rhkg/derived-check-before-write.log 2>&1; then
            echo 'FRESH_BEFORE_WRITE' > /tmp/pr300-rhkg/pre-write-disposition.txt
          else
            code=$?
            echo "PRE_WRITE_CHECK_FAILED:$code; strict transactional write and checks still required" \
              > /tmp/pr300-rhkg/pre-write-disposition.txt
            tail -30 /tmp/pr300-rhkg/derived-check-before-write.log
          fi
      - name: Transactionally regenerate and independently check every declared derived-state output
        shell: bash
        run: |
          set -euo pipefail
          python research/RHRC/tools/materialize_derived_state.py --write \
            > /tmp/pr300-rhkg/derived-write.log 2>&1 || { tail -100 /tmp/pr300-rhkg/derived-write.log; exit 1; }
          python research/RHRC/tools/materialize_derived_state.py --check \
            > /tmp/pr300-rhkg/derived-check-before-commit.log 2>&1 || { tail -100 /tmp/pr300-rhkg/derived-check-before-commit.log; exit 1; }
          git diff --check
          python - <<'PY'
          import subprocess
          prefixes=(
              'research/RHRC/graph/compiler/',
              'research/RHRC/graph/generated/',
              'research/RHRC/integration/generated/',
              'research/RHRC/ffbbp/generated/',
              'research/RHRC/ool/generated/',
          )
          lines=subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          for line in lines:
              path=line[3:].strip()
              if not path.startswith(prefixes):
                  raise SystemExit('Derived-state generator modified non-generated source: '+path)
          if not lines:
              print('Derived state already fresh: no changes to commit')
          else:
              print('Derived-state candidate paths:',len(lines))
          PY
      - name: Commit only the five governed derived-state roots; never alter theorem or D2 sources
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            research/RHRC/graph/compiler \
            research/RHRC/graph/generated \
            research/RHRC/integration/generated \
            research/RHRC/ffbbp/generated \
            research/RHRC/ool/generated
          git diff --cached --check
          git diff --cached --stat > /tmp/pr300-rhkg/GENERATED_DIFF_STAT.txt
          if git diff --cached --quiet; then
            echo 'No generated changes required' > /tmp/pr300-rhkg/commit-disposition.txt
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(PR300): materialize and freeze exact-head RHKG derived state"
            echo 'GENERATED_STATE_COMMITTED' > /tmp/pr300-rhkg/commit-disposition.txt
          fi
          git rev-parse HEAD > /tmp/pr300-rhkg/HEAD.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr300-rhkg/TREE.txt
          export POST290_CHECKED_HEAD="$(git rev-parse HEAD)"
          export POST290_CHECKED_TREE="$(git rev-parse HEAD^{tree})"
          lake env lean Zeta23/RHRC/Step123OutputBindings.lean > /tmp/pr300-rhkg/final-bindings.log
          python research/RHRC/routes/R003_ccm_bridge/post290/build_formal_receipt.py \
            --log /tmp/pr300-rhkg/final-bindings.log \
            --out /tmp/pr300-rhkg/final-compiler-receipt.json
          # The second full check runs below in a new clean checkout of this
          # candidate commit, before any generator write in that checkout.
          git diff --exit-code HEAD -- '*.lean' lean-toolchain lake-manifest.json lakefile.lean lakefile.toml
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Check the candidate in a new clean checkout before any generator write there
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/pr300-clean-checkout HEAD
          ln -s "$GITHUB_WORKSPACE/.lake" /tmp/pr300-clean-checkout/.lake
          cd /tmp/pr300-clean-checkout
          # A directory-only /.lake/ ignore rule does not match this symlink.
          # Verify the exact cache path is ignored, then retain the full clean gate.
          git check-ignore -v .lake > /tmp/pr300-rhkg/CLEAN_CHECKOUT_CACHE_IGNORE.txt
          git status --porcelain --untracked-files=all \
            > /tmp/pr300-rhkg/CLEAN_CHECKOUT_STATUS_BEFORE.txt
          cat /tmp/pr300-rhkg/CLEAN_CHECKOUT_STATUS_BEFORE.txt
          test ! -s /tmp/pr300-rhkg/CLEAN_CHECKOUT_STATUS_BEFORE.txt
          git rev-parse HEAD > /tmp/pr300-rhkg/CLEAN_CHECKOUT_HEAD.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr300-rhkg/CLEAN_CHECKOUT_TREE.txt
          python research/RHRC/tools/materialize_derived_state.py --check \
            > /tmp/pr300-rhkg/derived-check-after-commit.log 2>&1 || \
            { tail -100 /tmp/pr300-rhkg/derived-check-after-commit.log; exit 1; }
          cp /tmp/pr300-rhkg/derived-check-after-commit.log \
            /tmp/pr300-rhkg/derived-check-clean-checkout.log
          python -B -m research.RHRC.integration.opica_composition.cli inspect \
            --repo . --output /tmp/pr300-rhkg/POST299_SUCCESSOR_SOURCE_SCOPE_AFTER_COMMIT.json
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Publish only a fast-forward verified generated-state commit
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/HMarcusWH/zeta-23-lean.git "$GITHUB_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          # Make the credential available to this one push process only.
          # It is never stored in git config, a URL, a file, or command output.
          python - <<'PY'
          import base64, os, subprocess
          ref = os.environ['GITHUB_REF']
          if ref != 'refs/heads/research/step4-parity-moment-shift-20261113':
              raise SystemExit('Ref outside the sole authorized PR300 branch')
          token = os.environ.get('GH_PUSH_TOKEN')
          if not token:
              raise SystemExit('Missing final-push credential')
          env = os.environ.copy()
          env.pop('GH_PUSH_TOKEN', None)
          for key in tuple(env):
              if key.startswith('GIT_TRACE') or key == 'GIT_CURL_VERBOSE':
                  env.pop(key)
          env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1',
                     GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(
                         ('x-access-token:' + token).encode()).decode())
          subprocess.run(['git', 'push', 'https://github.com/HMarcusWH/zeta-23-lean.git',
                          'HEAD:' + ref], check=True, env=env)
          PY
          echo "Exact generated HEAD: $(git rev-parse HEAD)"
      - name: Preserve compiler/graph receipts, including negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr300-rhkg-refresh-receipts-${{ github.run_id }}
          path: /tmp/pr300-rhkg/
          retention-days: 20
          if-no-files-found: ignore
