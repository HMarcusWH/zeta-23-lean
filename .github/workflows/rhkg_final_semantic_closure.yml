name: RHKG final semantic closure materializer

on:
  push:
    branches:
      - rhkg/final-semantic-closure

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rhkg/final-semantic-closure
          fetch-depth: 0

      - name: Run semantic-closure unit tests
        run: python -m unittest discover -s research/RHRC/graph/tests -p 'test_*.py' -v

      - name: Remove one-shot materializer before final graph generation
        run: git rm .github/workflows/rhkg_final_semantic_closure.yml

      - name: Materialize deterministic final-closure products
        run: python research/RHRC/graph/build.py --write

      - name: Validate final-closure graph
        run: python research/RHRC/graph/validate.py

      - name: Commit materialized steady state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "RHKG final closure: materialize semantic graph steady state"
          git push origin HEAD:rhkg/final-semantic-closure
