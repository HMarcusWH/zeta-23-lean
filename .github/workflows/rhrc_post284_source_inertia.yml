name: RHRC post-284 source inertia campaign

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhrc-post284-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-source-inertia:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build post-284 source targets with complete receipt
        run: |
          set +e
          : > /tmp/post284-targets.txt
          rc=0
          for target in \
            Zeta23.CCM.SourceLatticeCoordinates \
            Zeta23.CCM.SourceSignCountermodels \
            Zeta23.CCM.SourceParityPolynomialCoordinates \
            Zeta23.CCM.SourceParityExactInertia \
            Zeta23.CCM.SourceMomentVandermondeFiltration \
            Zeta23.CCM.SourceFourierConvolution \
            Zeta23.CCM.StrictEvenPrimeSeamDichotomy \
            Zeta23.CCM.ContactNinthJumpGapBound \
            Zeta23.CCM.CanonicalRegularizedEnergyIdentity \
            Zeta23.CCM.SourceMomentFilteredInertia \
            Zeta23.CCM.CanonicalSourceWeightedIntegral \
            Zeta23.CCM.SecularDeterminantKernel \
            Zeta23.CCM.CanonicalCenteredIndexCoercivity \
            Zeta23.CCM.CanonicalK2SourceSignInterval \
            Zeta23.CCM.CanonicalPrimeFreeSecondTest \
            Zeta23.CCM.CanonicalSecularResolvent \
            Zeta23.CCM.CanonicalSourceExcursion \
            Zeta23.CCM.CanonicalCenteredIndexPoincare \
            Zeta23.CCM.CanonicalSourcePrimeSampling \
            Zeta23.CCM.CanonicalSourceSpectralFlow
          do
            if lake build "$target"; then
              echo "$target PASS" | tee -a /tmp/post284-targets.txt
            else
              echo "$target FAIL" | tee -a /tmp/post284-targets.txt
              rc=1
            fi
          done
          exit $rc
      - name: Audit post-284 theorem axioms
        run: |
          python research/RHRC/tools/axiom_audit.py \
            Zeta23/CCM/SourceLatticeCoordinates.lean \
            Zeta23/CCM/SourceSignCountermodels.lean \
            Zeta23/CCM/SourceParityPolynomialCoordinates.lean \
            Zeta23/CCM/SourceParityExactInertia.lean \
            Zeta23/CCM/SourceMomentVandermondeFiltration.lean \
            Zeta23/CCM/SourceFourierConvolution.lean \
            Zeta23/CCM/StrictEvenPrimeSeamDichotomy.lean \
            Zeta23/CCM/ContactNinthJumpGapBound.lean \
            Zeta23/CCM/CanonicalRegularizedEnergyIdentity.lean \
            Zeta23/CCM/SourceMomentFilteredInertia.lean \
            Zeta23/CCM/CanonicalSourceWeightedIntegral.lean \
            Zeta23/CCM/SecularDeterminantKernel.lean \
            Zeta23/CCM/CanonicalCenteredIndexCoercivity.lean \
            Zeta23/CCM/CanonicalK2SourceSignInterval.lean \
            Zeta23/CCM/CanonicalPrimeFreeSecondTest.lean \
            Zeta23/CCM/CanonicalSecularResolvent.lean \
            Zeta23/CCM/CanonicalSourceExcursion.lean \
            Zeta23/CCM/CanonicalCenteredIndexPoincare.lean \
            Zeta23/CCM/CanonicalSourcePrimeSampling.lean \
            Zeta23/CCM/CanonicalSourceSpectralFlow.lean
      - name: Reject proof escapes on the promoted surface
        run: python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope promoted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post284-source-inertia-lean
          path: /tmp/post284-targets.txt

  source-falsifier-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install research requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Attached exact SymPy source-inertia falsifier (regression receipt)
        run: python research/RHRC/routes/R003_ccm_bridge/post284/POST284_SOURCE_INERTIA_EXACT_FALSIFIER_2026-10-10.py
      - name: Independent post-284 falsifier suite
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post284/post284_source_falsifier_suite.py \
            --kmax 9 --output /tmp/POST284_SOURCE_FALSIFIER_SUITE.json
      - name: Check disposition firewall
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post284/check_post284_dispositions.py \
            --suite /tmp/POST284_SOURCE_FALSIFIER_SUITE.json
      - name: Attached log3 K=2 interval certificate (falsifier receipt; research evidence only)
        # Explicit bash runs with -o pipefail, so a failing certificate fails
        # the step instead of being masked by tee's exit status.
        shell: bash
        run: python research/RHRC/routes/R003_ccm_bridge/post284/birdfishie_log3_K2_certificate.py | tee /tmp/POST284_LOG3_K2_CERTIFICATE.txt
      - name: Follow-up regressions (M24/M30 exact, M41/M43 interval signs, M42 sanity, M47 formula)
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post284/post284_followup_regressions.py \
            --n 6000 --output /tmp/POST284_FOLLOWUP_REGRESSIONS.json > /dev/null
          python - <<'EOF'
          import json
          d = json.load(open('/tmp/POST284_FOLLOWUP_REGRESSIONS.json'))
          assert d['terminal_claim'] == 'RH_OPEN'
          want = {'M30': 'EXACT_REGRESSION_PASS', 'M24': 'EXACT_REGRESSION_PASS',
                  'M47': 'EXACT_REGRESSION_PASS',
                  'M41': 'INTERVAL_EVIDENCE_SIGN_CHANGE_BEFORE_LOG2',
                  'M43': 'INTERVAL_EVIDENCE_PRIME_FREE_INDEFINITE',
                  'M42': 'NUMERIC_SANITY_PASS'}
          got = {r['package']: r['disposition'] for r in d['results']}
          for k, v in want.items():
              print(k, got.get(k))
              assert got.get(k) == v, (k, got.get(k))
          EOF
      - name: Post-285 M74 secular-resolvent regression and negative controls
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post285/post285_m74_secular_falsifier.py \
            --output /tmp/POST285_M74_SECULAR_FALSIFIER.json > /dev/null
      - name: Post-285 ledger firewall (Steps 18-120 matrix, M70-M77 obligations, proof roots)
        run: python research/RHRC/integration/post285/check_post285_ledgers.py
      - name: Post-285 Gate A/D regressions (M70 excursion, M73 Poincaré, M75 negative window)
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post285/post285_gate_a_d_falsifier.py \
            --output /tmp/POST285_GATE_A_D_FALSIFIER.json > /dev/null
      - name: Post-285 M76 actual-canonical secular margin probe (experimental signal)
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post285/post285_m76_secular_margin.py \
            --kmax 5 --lmax 6 --dl 0.25 --output /tmp/POST285_M76_SECULAR_MARGIN.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post284-source-falsifier-suite
          path: |
            /tmp/POST284_SOURCE_FALSIFIER_SUITE.json
            /tmp/POST284_LOG3_K2_CERTIFICATE.txt
            /tmp/POST284_FOLLOWUP_REGRESSIONS.json
            /tmp/POST285_M74_SECULAR_FALSIFIER.json
            /tmp/POST285_GATE_A_D_FALSIFIER.json
            /tmp/POST285_M76_SECULAR_MARGIN.json
