name: RHKG Phase 2B bootstrap receipt commit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 258
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build registered authority and dependency exporter
        run: |
          lake build Zeta23.RHRC.RegisteredClaimBindings
          python3 research/RHRC/tools/registered_theorem_binding_lint.py
          lake build Zeta23.RHRC.DeclarationDependencyExport
      - name: Materialize exact compiler receipt
        run: python3 research/RHRC/tools/lean_dependency_extract.py --write
      - name: Validate receipt shape before committing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/RHRC/graph/compiler/REGISTERED_DECLARATION_DEPENDENCIES.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == 7564, len(rows)
          assert all(row["schema_version"] == "RHKG-phase2b-compiler-dependencies-0.4" for row in rows)
          roots = [row for row in rows if row["graph_role"] == "REGISTERED_CLAIM_ROOT"]
          assert len(roots) == 75, len(roots)
          assert len({row["registered_claim_id"] for row in roots}) == 75
          assert sum(len(row["dependencies"]) for row in rows) == 270951
          print("RHKG bootstrap receipt shape: PASS")
          PY
      - name: Commit exact receipt to PR branch
        run: |
          if git diff --quiet -- research/RHRC/graph/compiler/REGISTERED_DECLARATION_DEPENDENCIES.jsonl; then
            echo "Compiler receipt already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/RHRC/graph/compiler/REGISTERED_DECLARATION_DEPENDENCIES.jsonl
          git commit -m "RHKG: materialize exact compiler dependency receipt"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
