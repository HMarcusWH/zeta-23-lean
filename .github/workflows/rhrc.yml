name: RHRC research and Lean checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  python-rhrc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: RHRC claim and regression suite
        run: python research/RHRC/tools/run_suite.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build exceptional-zero foundation
        run: lake build Zeta23.ExceptionalZero
      - name: Reject sorry/project axioms in promoted subtree
        run: |
          if grep -R -n -E '\bsorry\b|^[[:space:]]*axiom[[:space:]]' Zeta23/ExceptionalZero Zeta23/ExceptionalZero.lean; then
            echo 'Forbidden sorry/axiom detected'
            exit 1
          fi
