name: RHRC research and Lean checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rhrc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-rhrc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: RHRC claim and regression suite
        run: python research/RHRC/tools/run_suite.py
      - name: Control v2 real-history smoke run
        run: |
          python research/RHRC/control_v2/run_control.py \
            --output /tmp/RHRC_CONTROL_V2.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/RHRC_CONTROL_V2.json'))
          assert p['terminal_claim'] == 'RH_OPEN'
          assert p['theorem_anchor']['pr'] == 163
          assert p['theorem_anchor']['merge_commit'] == 'bd3fa1aafa7df2aa35873df532bdb6f17ddd2bbd'
          assert p['theorem_anchor']['tree'] == 'c397b3a015ea54e38ecfe626d6e29556fe963839'
          assert p['control_anchor']['pr'] == 117
          assert p['theorem_anchor']['merge_commit'] != p['control_anchor']['merge_commit']
          assert p['route_certificate']['frontier_id'] == 'FIRST_BAD_RIGIDITY_E4_A4R_REGULAR_SCHUR_ENERGY_SIGN'
          assert p['route_certificate']['selected_action'] == 'E4_A4_REGULAR_SCHUR_ENERGY_SIGN'
          assert p['selected_first_break']['break_id'] == 'E4A4-SCHUR-FB-05'
          assert p['route_certificate']['theorem_authority'] is False
          assert p['route_certificate']['terminal_claim_change'] is False
          assert all(r['search_paths'] for r in p['retro_receipts'])
          print('Control v2 smoke: PASS')
          PY

  r003-normalization-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install R003 numerical audit requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Re-run cutoff-free CCM normalization lock
        run: |
          python research/RHRC/routes/R003_ccm_bridge/compare_ccm_normalizations.py \
            --output /tmp/CCM_NORMALIZATION_AUDIT.json
      - name: Check finite dictionary external oracle guards
        run: python research/RHRC/routes/R003_ccm_bridge/check_finite_dictionary_reference.py
      - name: Check source normalization semantic firewall
        run: python research/RHRC/routes/R003_ccm_bridge/check_source_normalization_firewall.py
      - name: Check post-150 selected-residual certification plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post150_selected_residual_scope.py
      - name: Scout post-150 selected-residual scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post150_selected_residual_scope.py \
            --q-min 2 --q-max 4 --n-min 1 --n-max 5 --samples 2 --top 12 \
            --output /tmp/POST150_SELECTED_RESIDUAL_DISCOVERY.json
      - name: Replay checked-in post-150 interval certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post150_selected_residual_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post150_selected_residual_v1.json \
            --output /tmp/POST150_SELECTED_RESIDUAL_CERTIFICATE.json
      - name: Check post-#163 endpoint-scalar audit plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post163_endpoint_scalar_scope.py
      - name: Scout post-#163 endpoint-scalar scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post163_endpoint_scalar_scope.py \
            --q-min 1 --q-max 8 --samples 3 --top 12 \
            --output /tmp/POST163_ENDPOINT_SCALAR_DISCOVERY.json
      - name: Replay checked-in post-#163 endpoint-scalar certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post163_endpoint_scalar_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post163_endpoint_scalar_v1.json \
            --output /tmp/POST163_ENDPOINT_SCALAR_CERTIFICATE.json
      - name: Check post-#165 FB-05 shifted-state plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post165_fb05_shifted_state_scope.py
      - name: Check post-#165 FB-05 shifted-state Arb plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post165_fb05_shifted_state_arb_scope.py
      - name: Scout post-#165 FB-05 same-state scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post165_fb05_same_state_scope.py \
            --q-min 1 --q-max 16 --n-min 2 --n-max 8 --samples 3 --top 12 \
            --output /tmp/POST165_FB05_SAME_STATE_DISCOVERY.json
      - name: Replay checked-in post-#165 FB-05 same-state certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post165_fb05_same_state_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post165_fb05_same_state_v1.json \
            --output /tmp/POST165_FB05_SAME_STATE_CERTIFICATE.json
      - name: Check post-#166 Q16 cell-barrier plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post166_fb05_cell_barrier_scope.py
      - name: Scout post-#166 Q16 full-cell determinant barrier
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post166_fb05_cell_barrier_scope.py \
            --q 16 --n 3 --parity odd --grid 65 --top 12 --local-seeds 6 \
            --output /tmp/POST166_FB05_CELL_BARRIER_DISCOVERY.json
      - name: Replay post-#166 Q16 adaptive Arb cell audit
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post166_fb05_cell_barrier_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post166_fb05_cell_barrier_v1.json \
            --max-depth 8 \
            --output /tmp/POST166_FB05_CELL_BARRIER_CERTIFICATE.json
      - name: Check post-#167 cutoff-entry moment-jet algebra
        run: python research/RHRC/routes/R003_ccm_bridge/check_post167_fb05_threshold_jet_scope.py
      - name: Scout post-#167 Q17 threshold crossing
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post167_fb05_q17_threshold_scope.py \
            --q 17 --n 3 --parity odd --grid 65 --local-seeds 6 \
            --output /tmp/POST167_FB05_Q17_THRESHOLD_DISCOVERY.json
      - name: Replay post-#167 Q17 threshold candidates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post167_fb05_q17_threshold_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post167_fb05_q17_threshold_v1.json \
            --discovery /tmp/POST167_FB05_Q17_THRESHOLD_DISCOVERY.json \
            --output /tmp/POST167_FB05_Q17_THRESHOLD_CERTIFICATE.json
      - name: Audit R004 scalar-shift invariants
        run: python research/RHRC/routes/R004_prolate_v2/check_normalization_shift_invariants.py
      - name: Reject external reference code as a Lean dependency
        run: |
          if grep -R -n -E 'external[/\\.]connes_cvs|connes_cvs' Zeta23 --include='*.lean'; then
            echo 'External connes-cvs reference code must not enter the Lean theorem dependency graph'
            exit 1
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build CCM formalization
        run: lake build Zeta23.CCM
      - name: Build exceptional-zero foundation
        run: lake build Zeta23.ExceptionalZero
      - name: Reject forbidden placeholders in promoted subtrees
        run: |
          if grep -R -n -E '\bsorry\b|^[[:space:]]*axiom[[:space:]]' \
              Zeta23/ExceptionalZero Zeta23/ExceptionalZero.lean Zeta23/CCM Zeta23/CCM.lean; then
            echo 'Forbidden placeholder detected'
            exit 1
          fi
