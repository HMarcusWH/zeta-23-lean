name: RHRC research and Lean checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rhrc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-rhrc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: RHKG deterministic regeneration gate
        env:
          RHKG_BOOTSTRAP_LOG: "1"
        run: |
          if grep -q '"schema_version":"RHKG-phase2b-bootstrap-pending"' research/RHRC/graph/compiler/REGISTERED_DECLARATION_DEPENDENCIES.jsonl; then
            echo "RHKG compiler receipt bootstrap is pending; graph regeneration is deferred to the compiler-receipt gate."
          else
            python research/RHRC/graph/build.py --write
            python research/RHRC/graph/validate.py
            if [ -n "$(git status --porcelain -- research/RHRC/graph/generated)" ]; then
              echo "RHKG generated products are stale or missing; bootstrap payload emitted above."
              git status --short -- research/RHRC/graph/generated
              exit 1
            fi
          fi
      - name: Upload RHKG generated bootstrap products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhkg-generated-products
          path: research/RHRC/graph/generated
          if-no-files-found: error
      - name: RHRC claim and regression suite
        run: python research/RHRC/tools/run_suite.py
      - name: Control v2 real-history smoke run
        run: |
          python research/RHRC/control_v2/run_control.py \
            --output /tmp/RHRC_CONTROL_V2.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/RHRC_CONTROL_V2.json'))
          state = json.load(open('research/RHRC/control_v2/CONTROL_STATE.json'))
          theorem = state['merged_theorem_anchor']
          assert p['terminal_claim'] == 'RH_OPEN'
          assert p['theorem_anchor']['pr'] == theorem['pr']
          assert p['theorem_anchor']['merge_commit'] == theorem['merge_commit']
          assert p['theorem_anchor']['tree'] == theorem['tree']
          assert p['theorem_anchor']['pr'] == 247
          assert p['control_anchor']['pr'] == 117
          assert p['theorem_anchor']['merge_commit'] != p['control_anchor']['merge_commit']
          assert p['route_certificate']['frontier_id'] == 'FIRST_BAD_RIGIDITY_E4_A4R_REGULAR_SCHUR_ENERGY_SIGN'
          assert p['route_certificate']['selected_action'] == 'E4_A4_REGULAR_SCHUR_ENERGY_SIGN'
          assert p['selected_first_break']['break_id'] == 'E4A4-SCHUR-FB-05'
          assert p['route_certificate']['theorem_authority'] is False
          assert p['route_certificate']['terminal_claim_change'] is False
          assert all(r['search_paths'] for r in p['retro_receipts'])
          print('Control v2 smoke: PASS')
          PY


  rhkg-compiler-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build complete registered theorem authority surface
        run: lake build Zeta23.RHRC.RegisteredClaimBindings
      - name: Validate complete registered theorem bindings
        run: python3 research/RHRC/tools/registered_theorem_binding_lint.py
      - name: Build RHKG compiler dependency exporter
        run: lake build Zeta23.RHRC.DeclarationDependencyExport
      - name: Materialize RHKG compiler dependency receipt
        env:
          RHKG_DEP_BOOTSTRAP_LOG: "1"
        run: |
          python3 research/RHRC/tools/lean_dependency_extract.py --write
          if [ -n "$(git status --porcelain -- research/RHRC/graph/compiler/REGISTERED_DECLARATION_DEPENDENCIES.jsonl)" ]; then
            echo "RHKG compiler dependency receipt is stale or bootstrap-pending; exact artifact uploaded below."
            git status --short -- research/RHRC/graph/compiler/REGISTERED_DECLARATION_DEPENDENCIES.jsonl
            exit 1
          fi
      - name: Upload RHKG compiler dependency receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhkg-compiler-receipt
          path: research/RHRC/graph/compiler/REGISTERED_DECLARATION_DEPENDENCIES.jsonl
          if-no-files-found: error

  r003-normalization-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install R003 numerical audit requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Re-run cutoff-free CCM normalization lock
        run: |
          python research/RHRC/routes/R003_ccm_bridge/compare_ccm_normalizations.py \
            --output /tmp/CCM_NORMALIZATION_AUDIT.json
      - name: Check finite dictionary external oracle guards
        run: python research/RHRC/routes/R003_ccm_bridge/check_finite_dictionary_reference.py
      - name: Check source normalization semantic firewall
        run: python research/RHRC/routes/R003_ccm_bridge/check_source_normalization_firewall.py
      - name: Check post-150 selected-residual certification plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post150_selected_residual_scope.py
      - name: Scout post-150 selected-residual scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post150_selected_residual_scope.py \
            --q-min 2 --q-max 4 --n-min 1 --n-max 5 --samples 2 --top 12 \
            --output /tmp/POST150_SELECTED_RESIDUAL_DISCOVERY.json
      - name: Replay checked-in post-150 interval certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post150_selected_residual_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post150_selected_residual_v1.json \
            --output /tmp/POST150_SELECTED_RESIDUAL_CERTIFICATE.json
      - name: Check post-#163 endpoint-scalar audit plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post163_endpoint_scalar_scope.py
      - name: Scout post-#163 endpoint-scalar scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post163_endpoint_scalar_scope.py \
            --q-min 1 --q-max 8 --samples 3 --top 12 \
            --output /tmp/POST163_ENDPOINT_SCALAR_DISCOVERY.json
      - name: Replay checked-in post-#163 endpoint-scalar certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post163_endpoint_scalar_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post163_endpoint_scalar_v1.json \
