name: RHRC research and Lean checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rhrc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-rhrc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: RHRC claim and regression suite
        run: python research/RHRC/tools/run_suite.py
      - name: Control v2 real-history smoke run
        run: |
          python research/RHRC/control_v2/run_control.py \
            --output /tmp/RHRC_CONTROL_V2.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/RHRC_CONTROL_V2.json'))
          assert p['terminal_claim'] == 'RH_OPEN'
          assert p['theorem_anchor']['pr'] == 221
          assert p['theorem_anchor']['merge_commit'] == 'ab5f29ba01899362ab03fdb509a04c4d5afc2744'
          assert p['theorem_anchor']['tree'] == '4fda17717de7b7644c267e98b5c61b7dc3e36547'
          assert p['control_anchor']['pr'] == 117
          assert p['theorem_anchor']['merge_commit'] != p['control_anchor']['merge_commit']
          assert p['route_certificate']['frontier_id'] == 'FIRST_BAD_RIGIDITY_E4_A4R_REGULAR_SCHUR_ENERGY_SIGN'
          assert p['route_certificate']['selected_action'] == 'E4_A4_REGULAR_SCHUR_ENERGY_SIGN'
          assert p['selected_first_break']['break_id'] == 'E4A4-SCHUR-FB-05'
          assert p['route_certificate']['theorem_authority'] is False
          assert p['route_certificate']['terminal_claim_change'] is False
          assert all(r['search_paths'] for r in p['retro_receipts'])
          print('Control v2 smoke: PASS')
          PY

  r003-normalization-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install R003 numerical audit requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Re-run cutoff-free CCM normalization lock
        run: |
          python research/RHRC/routes/R003_ccm_bridge/compare_ccm_normalizations.py \
            --output /tmp/CCM_NORMALIZATION_AUDIT.json
      - name: Check finite dictionary external oracle guards
        run: python research/RHRC/routes/R003_ccm_bridge/check_finite_dictionary_reference.py
      - name: Check source normalization semantic firewall
        run: python research/RHRC/routes/R003_ccm_bridge/check_source_normalization_firewall.py
      - name: Check post-150 selected-residual certification plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post150_selected_residual_scope.py
      - name: Scout post-150 selected-residual scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post150_selected_residual_scope.py \
            --q-min 2 --q-max 4 --n-min 1 --n-max 5 --samples 2 --top 12 \
            --output /tmp/POST150_SELECTED_RESIDUAL_DISCOVERY.json
      - name: Replay checked-in post-150 interval certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post150_selected_residual_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post150_selected_residual_v1.json \
            --output /tmp/POST150_SELECTED_RESIDUAL_CERTIFICATE.json
      - name: Check post-#163 endpoint-scalar audit plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post163_endpoint_scalar_scope.py
      - name: Scout post-#163 endpoint-scalar scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post163_endpoint_scalar_scope.py \
            --q-min 1 --q-max 8 --samples 3 --top 12 \
            --output /tmp/POST163_ENDPOINT_SCALAR_DISCOVERY.json
      - name: Replay checked-in post-#163 endpoint-scalar certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post163_endpoint_scalar_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post163_endpoint_scalar_v1.json \
            --output /tmp/POST163_ENDPOINT_SCALAR_CERTIFICATE.json
      - name: Check post-#165 FB-05 shifted-state plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post165_fb05_shifted_state_scope.py
      - name: Check post-#165 FB-05 shifted-state Arb plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post165_fb05_shifted_state_arb_scope.py
      - name: Scout post-#165 FB-05 same-state scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post165_fb05_same_state_scope.py \
            --q-min 1 --q-max 16 --n-min 2 --n-max 8 --samples 3 --top 12 \
            --output /tmp/POST165_FB05_SAME_STATE_DISCOVERY.json
      - name: Replay checked-in post-#165 FB-05 same-state certificates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post165_fb05_same_state_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post165_fb05_same_state_v1.json \
            --output /tmp/POST165_FB05_SAME_STATE_CERTIFICATE.json
      - name: Check post-#166 Q16 cell-barrier plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post166_fb05_cell_barrier_scope.py
      - name: Scout post-#166 Q16 full-cell determinant barrier
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post166_fb05_cell_barrier_scope.py \
            --q 16 --n 3 --parity odd --grid 65 --top 12 --local-seeds 6 \
            --output /tmp/POST166_FB05_CELL_BARRIER_DISCOVERY.json
      - name: Replay post-#166 Q16 adaptive Arb cell audit
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post166_fb05_cell_barrier_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post166_fb05_cell_barrier_v1.json \
            --max-depth 8 \
            --output /tmp/POST166_FB05_CELL_BARRIER_CERTIFICATE.json
      - name: Check post-#167 cutoff-entry moment-jet algebra
        run: python research/RHRC/routes/R003_ccm_bridge/check_post167_fb05_threshold_jet_scope.py
      - name: Scout post-#167 Q17 threshold crossing
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post167_fb05_q17_threshold_scope.py \
            --q 17 --n 3 --parity odd --grid 65 --local-seeds 6 \
            --output /tmp/POST167_FB05_Q17_THRESHOLD_DISCOVERY.json
      - name: Replay post-#167 Q17 threshold candidates
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post167_fb05_q17_threshold_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post167_fb05_q17_threshold_v1.json \
            --discovery /tmp/POST167_FB05_Q17_THRESHOLD_DISCOVERY.json \
            --output /tmp/POST167_FB05_Q17_THRESHOLD_CERTIFICATE.json
      - name: Check post-#169 theorem-aligned Schur visibility algebra
        run: python research/RHRC/routes/R003_ccm_bridge/check_post169_fb05_schur_visibility_scope.py
      - name: Scout post-#169 threshold Schur visibility and background drift
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post169_fb05_threshold_pivot_scope.py \
            --q 17 --n 3 --parity odd --grid 97 \
            --output /tmp/POST169_FB05_SCHUR_VISIBILITY_DISCOVERY.json
      - name: Replay post-#169 threshold Schur visibility with Arb
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post169_fb05_threshold_pivot_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post169_fb05_threshold_pivot_v1.json \
            --output /tmp/POST169_FB05_SCHUR_VISIBILITY_CERTIFICATE.json
      - name: Check post-#171 threshold-barrier accounting
        run: python research/RHRC/routes/R003_ccm_bridge/check_post171_fb05_schur_barrier_scope.py
      - name: Scout post-#171 threshold-to-threshold Schur barriers
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post171_fb05_threshold_barrier_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post171_fb05_threshold_barrier_v1.json \
            --grid 97 --local-seeds 6 --integration-nodes 8 \
            --output /tmp/POST171_FB05_THRESHOLD_BARRIER_DISCOVERY.json
      - name: Replay post-#171 dangerous barrier points with Arb
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post171_fb05_threshold_barrier_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post171_fb05_threshold_barrier_v1.json \
            --discovery /tmp/POST171_FB05_THRESHOLD_BARRIER_DISCOVERY.json \
            --output /tmp/POST171_FB05_THRESHOLD_BARRIER_CERTIFICATE.json
      - name: Check post-#173 q13 scalar-barrier plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post173_fb05_q13_scalar_barrier_scope.py
      - name: Scout post-#173 q13 2x2 scalar barrier
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post173_fb05_q13_scalar_barrier_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post173_fb05_q13_scalar_barrier_v1.json \
            --output /tmp/POST173_Q13_SCALAR_DISCOVERY.json
      - name: Certify post-#173 q13 scalar interval barrier
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post173_fb05_q13_scalar_barrier_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post173_fb05_q13_scalar_barrier_v1.json \
            --discovery /tmp/POST173_Q13_SCALAR_DISCOVERY.json \
            --output /tmp/POST173_Q13_SCALAR_CERTIFICATE.json
      - name: Check post-#175 fixed-unit q13 enclosure plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post175_fb05_q13_fixed_unit_enclosure_scope.py
      - name: Benchmark post-#175 fixed-unit q13 enclosure
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post175_fb05_q13_fixed_unit_enclosure_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post175_fb05_q13_fixed_unit_enclosure_v1.json \
            --output /tmp/POST175_Q13_FIXED_UNIT_BENCHMARK.json
      - name: Certify post-#175 fixed-unit agreement and interval-width gain
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post175_fb05_q13_fixed_unit_enclosure_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post175_fb05_q13_fixed_unit_enclosure_v1.json \
            --benchmark /tmp/POST175_Q13_FIXED_UNIT_BENCHMARK.json \
            --output /tmp/POST175_Q13_FIXED_UNIT_CERTIFICATE.json
      - name: Check post-#177 fixed-unit derivative plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post177_fb05_q13_fixed_unit_derivative_scope.py
      - name: Probe post-#177 Q14 determinant derivative scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post177_fb05_q13_fixed_unit_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post177_fb05_q13_fixed_unit_derivative_v1.json \
            --output /tmp/POST177_Q14_DERIVATIVE_SCHEDULE.json
      - name: Certify post-#177 fixed-unit derivative discrimination
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post177_fb05_q13_fixed_unit_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post177_fb05_q13_fixed_unit_derivative_v1.json \
            --schedule /tmp/POST177_Q14_DERIVATIVE_SCHEDULE.json \
            --output /tmp/POST177_Q14_DERIVATIVE_CERTIFICATE.json
      - name: Check post-#179 Schur/correlation-preserving derivative plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post179_fb05_q13_correlation_preserving_derivative_scope.py
      - name: Probe post-#179 exact-center and Schur derivative scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post179_fb05_q13_correlation_preserving_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post179_fb05_q13_correlation_preserving_derivative_v1.json \
            --output /tmp/POST179_Q14_CORRELATION_SCHEDULE.json
      - name: Certify post-#179 correlation-preserving derivative discrimination
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post179_fb05_q13_correlation_preserving_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post179_fb05_q13_correlation_preserving_derivative_v1.json \
            --schedule /tmp/POST179_Q14_CORRELATION_SCHEDULE.json \
            --output /tmp/POST179_Q14_CORRELATION_CERTIFICATE.json
      - name: Check post-#185 remainder-drift decomposition plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post185_fb05_q13_remainder_drift_scope.py
      - name: Probe post-#185 frozen remainder-drift scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post185_fb05_q13_remainder_drift_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post185_fb05_q13_remainder_drift_v1.json \
            --output /tmp/POST185_Q14_REMAINDER_DRIFT_SCHEDULE.json
      - name: Certify post-#185 remainder-drift falsification
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post185_fb05_q13_remainder_drift_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post185_fb05_q13_remainder_drift_v1.json \
            --schedule /tmp/POST185_Q14_REMAINDER_DRIFT_SCHEDULE.json \
            --output /tmp/POST185_Q14_REMAINDER_DRIFT_CERTIFICATE.json
      - name: Check post-#187 mixed-drift selector plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post187_fb05_q14_mixed_drift_selector_scope.py
      - name: Probe post-#187 frozen selector scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post187_fb05_q14_mixed_drift_selector_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post187_fb05_q14_mixed_drift_selector_v1.json \
            --output /tmp/POST187_Q14_SELECTOR_SCHEDULE.json
      - name: Certify post-#187 mixed-drift selector audit
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post187_fb05_q14_mixed_drift_selector_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post187_fb05_q14_mixed_drift_selector_v1.json \
            --schedule /tmp/POST187_Q14_SELECTOR_SCHEDULE.json \
            --output /tmp/POST187_Q14_SELECTOR_CERTIFICATE.json
      - name: Check post-#188 selector semantic-independence plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post188_fb05_q14_mixed_drift_selector_independence_scope.py
      - name: Probe post-#188 frozen semantic-independence scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post188_fb05_q14_mixed_drift_selector_independence_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post188_fb05_q14_mixed_drift_selector_independence_v1.json \
            --output /tmp/POST188_Q14_SELECTOR_INDEPENDENCE_SCHEDULE.json
      - name: Certify post-#188 selector semantic-independence audit
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post188_fb05_q14_mixed_drift_selector_independence_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post188_fb05_q14_mixed_drift_selector_independence_v1.json \
            --schedule /tmp/POST188_Q14_SELECTOR_INDEPENDENCE_SCHEDULE.json \
            --output /tmp/POST188_Q14_SELECTOR_INDEPENDENCE_CERTIFICATE.json
      - name: Check post-#189 joint-selector separability plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post189_fb05_joint_selector_separability_scope.py
      - name: Probe post-#189 frozen joint-selector scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post189_fb05_joint_selector_separability_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post189_fb05_joint_selector_separability_v1.json \
            --output /tmp/POST189_FB05_JOINT_SELECTOR_SCHEDULE.json
      - name: Certify post-#189 joint-selector separability
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post189_fb05_joint_selector_separability_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post189_fb05_joint_selector_separability_v1.json \
            --schedule /tmp/POST189_FB05_JOINT_SELECTOR_SCHEDULE.json \
            --output /tmp/POST189_FB05_JOINT_SELECTOR_CERTIFICATE.json
      - name: Audit R004 scalar-shift invariants
        run: python research/RHRC/routes/R004_prolate_v2/check_normalization_shift_invariants.py
      - name: Reject external reference code as a Lean dependency
        run: |
          if grep -R -n -E 'external[/\\.]connes_cvs|connes_cvs' Zeta23 --include='*.lean'; then
            echo 'External connes-cvs reference code must not enter the Lean theorem dependency graph'
            exit 1
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build CCM formalization
        run: lake build Zeta23.CCM
      - name: Build exceptional-zero foundation
        run: lake build Zeta23.ExceptionalZero
      - name: Reject forbidden placeholders in promoted subtrees
        run: |
          if grep -R -n -E '\bsorry\b|^[[:space:]]*axiom[[:space:]]' \
              Zeta23/ExceptionalZero Zeta23/ExceptionalZero.lean Zeta23/CCM Zeta23/CCM.lean; then
            echo 'Forbidden placeholder detected'
            exit 1
          fi