          python research/RHRC/routes/R003_ccm_bridge/probe_post175_fb05_q13_fixed_unit_enclosure_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post175_fb05_q13_fixed_unit_enclosure_v1.json \
            --output /tmp/POST175_Q13_FIXED_UNIT_BENCHMARK.json
      - name: Certify post-#175 fixed-unit agreement and interval-width gain
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post175_fb05_q13_fixed_unit_enclosure_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post175_fb05_q13_fixed_unit_enclosure_v1.json \
            --benchmark /tmp/POST175_Q13_FIXED_UNIT_BENCHMARK.json \
            --output /tmp/POST175_Q13_FIXED_UNIT_CERTIFICATE.json
      - name: Check post-#177 fixed-unit derivative plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post177_fb05_q13_fixed_unit_derivative_scope.py
      - name: Probe post-#177 Q14 determinant derivative scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post177_fb05_q13_fixed_unit_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post177_fb05_q13_fixed_unit_derivative_v1.json \
            --output /tmp/POST177_Q14_DERIVATIVE_SCHEDULE.json
      - name: Certify post-#177 fixed-unit derivative discrimination
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post177_fb05_q13_fixed_unit_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post177_fb05_q13_fixed_unit_derivative_v1.json \
            --schedule /tmp/POST177_Q14_DERIVATIVE_SCHEDULE.json \
            --output /tmp/POST177_Q14_DERIVATIVE_CERTIFICATE.json
      - name: Check post-#179 Schur/correlation-preserving derivative plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post179_fb05_q13_correlation_preserving_derivative_scope.py
      - name: Probe post-#179 exact-center and Schur derivative scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post179_fb05_q13_correlation_preserving_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post179_fb05_q13_correlation_preserving_derivative_v1.json \
            --output /tmp/POST179_Q14_CORRELATION_SCHEDULE.json
      - name: Certify post-#179 correlation-preserving derivative discrimination
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post179_fb05_q13_correlation_preserving_derivative_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post179_fb05_q13_correlation_preserving_derivative_v1.json \
            --schedule /tmp/POST179_Q14_CORRELATION_SCHEDULE.json \
            --output /tmp/POST179_Q14_CORRELATION_CERTIFICATE.json
      - name: Check post-#185 remainder-drift decomposition plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post185_fb05_q13_remainder_drift_scope.py
      - name: Probe post-#185 frozen remainder-drift scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post185_fb05_q13_remainder_drift_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post185_fb05_q13_remainder_drift_v1.json \
            --output /tmp/POST185_Q14_REMAINDER_DRIFT_SCHEDULE.json
      - name: Certify post-#185 remainder-drift falsification
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post185_fb05_q13_remainder_drift_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post185_fb05_q13_remainder_drift_v1.json \
            --schedule /tmp/POST185_Q14_REMAINDER_DRIFT_SCHEDULE.json \
            --output /tmp/POST185_Q14_REMAINDER_DRIFT_CERTIFICATE.json
      - name: Check post-#187 mixed-drift selector plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post187_fb05_q14_mixed_drift_selector_scope.py
      - name: Probe post-#187 frozen selector scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post187_fb05_q14_mixed_drift_selector_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post187_fb05_q14_mixed_drift_selector_v1.json \
            --output /tmp/POST187_Q14_SELECTOR_SCHEDULE.json
      - name: Certify post-#187 mixed-drift selector audit
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post187_fb05_q14_mixed_drift_selector_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post187_fb05_q14_mixed_drift_selector_v1.json \
            --schedule /tmp/POST187_Q14_SELECTOR_SCHEDULE.json \
            --output /tmp/POST187_Q14_SELECTOR_CERTIFICATE.json
      - name: Check post-#188 selector semantic-independence plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post188_fb05_q14_mixed_drift_selector_independence_scope.py
      - name: Probe post-#188 frozen semantic-independence scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post188_fb05_q14_mixed_drift_selector_independence_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post188_fb05_q14_mixed_drift_selector_independence_v1.json \
            --output /tmp/POST188_Q14_SELECTOR_INDEPENDENCE_SCHEDULE.json
      - name: Certify post-#188 selector semantic-independence audit
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post188_fb05_q14_mixed_drift_selector_independence_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post188_fb05_q14_mixed_drift_selector_independence_v1.json \
            --schedule /tmp/POST188_Q14_SELECTOR_INDEPENDENCE_SCHEDULE.json \
            --output /tmp/POST188_Q14_SELECTOR_INDEPENDENCE_CERTIFICATE.json
      - name: Check post-#189 joint-selector separability plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post189_fb05_joint_selector_separability_scope.py
      - name: Probe post-#189 frozen joint-selector scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post189_fb05_joint_selector_separability_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post189_fb05_joint_selector_separability_v1.json \
            --output /tmp/POST189_FB05_JOINT_SELECTOR_SCHEDULE.json
      - name: Certify post-#189 joint-selector separability
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post189_fb05_joint_selector_separability_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post189_fb05_joint_selector_separability_v1.json \
            --schedule /tmp/POST189_FB05_JOINT_SELECTOR_SCHEDULE.json \
            --output /tmp/POST189_FB05_JOINT_SELECTOR_CERTIFICATE.json
      - name: "Check PR #247 frozen global-bottom scout scope"
        run: python research/RHRC/routes/R003_ccm_bridge/check_post247_global_bottom_scout_scope.py
      - name: "Run PR #247 frozen global-bottom canonical scout"
        run: python research/RHRC/routes/R003_ccm_bridge/post247_global_bottom_scout.py > /tmp/POST247_GLOBAL_BOTTOM_SCOUT.json
      - name: "Run PR #247 frozen global-bottom arithmetic scout"
        run: python research/RHRC/routes/R003_ccm_bridge/post247_global_bottom_arithmetic_scout.py > /tmp/POST247_GLOBAL_BOTTOM_ARITHMETIC_SCOUT.json
      - name: "Assert PR #247 global-bottom scout controls and semantics"
        run: python research/RHRC/routes/R003_ccm_bridge/check_post247_global_bottom_scout_results.py
      - name: "Check post-#247 remainder/budget ratio scout scope and fixture"
        run: python research/RHRC/routes/R003_ccm_bridge/check_post247_remainder_budget_ratio_scope.py
      - name: "Replay post-#247 remainder/budget ratio scout controls (Arb)"
        run: python research/RHRC/routes/R003_ccm_bridge/check_post247_remainder_budget_ratio_results.py
      - name: "Run post-#247 remainder/budget ratio scout quick grid"
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post247_remainder_budget_ratio_scout.py \
            --quick --out /tmp/POST247_REMAINDER_BUDGET_RATIO_QUICK.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/POST247_REMAINDER_BUDGET_RATIO_QUICK.json'))
          s = d['summary']
          assert d['claim_cap'] == 'EXPERIMENTAL_SIGNAL_ONLY'
          assert s['real_points'] == s['real_energy_certified_positive'] > 0
          assert s['A_positive_definite_everywhere'] and s['B_positive_definite_everywhere']
          assert s['planted_on_line_certified_bad'] == 0
          assert s['planted_on_line_increment_rank_one_psd_per_parity']
          assert s['planted_off_line_increment_signature_1_1_per_parity']
          assert s['planted_off_line_certified_bad'] > 0
          print('Post-#247 ratio scout quick grid: PASS')
          PY
      - name: Audit R004 scalar-shift invariants
        run: python research/RHRC/routes/R004_prolate_v2/check_normalization_shift_invariants.py
      - name: Reject external reference code as a Lean dependency
        run: |
          if grep -R -n -E 'external[/\\.]connes_cvs|connes_cvs' Zeta23 --include='*.lean'; then
            echo 'External connes-cvs reference code must not enter the Lean theorem dependency graph'
            exit 1
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build CCM formalization
        run: lake build Zeta23.CCM
      - name: Build promoted ClaimBindings authority surface
        run: lake build Zeta23.CCM.ClaimBindings
      - name: Validate promoted R003 theorem bindings
        run: python3 research/RHRC/tools/promoted_binding_lint.py
      - name: Build complete registered theorem authority surface
        run: lake build Zeta23.RHRC.RegisteredClaimBindings
      - name: Validate complete registered theorem bindings
        run: python3 research/RHRC/tools/registered_theorem_binding_lint.py
      - name: Build exceptional-zero foundation
        run: lake build Zeta23.ExceptionalZero
      - name: "Build PR #247 explicit terminal target"
        run: lake build Zeta23.ExceptionalZero.GlobalParityBottomTerminalTarget
      - name: "Build PR #247 arithmetic-equivalence audit"
        run: lake build Zeta23.ExceptionalZero.GlobalParityBottomArithmeticEquivalenceAudit
      - name: "Build PR #247 audit-only conditional RH seam"
        run: lake build Zeta23.ExceptionalZero.GlobalParityBottomConditionalRH
      - name: Validate future premise-free RH closure exact type
        run: |
          if [ -f Zeta23/ExceptionalZero/GlobalParityBottomRHClosure.lean ]; then
            test -f Zeta23/ExceptionalZero/GlobalParityBottomExactTypeAudit.lean
