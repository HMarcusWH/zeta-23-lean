name: PR292 guarded one-shot RHKG generated-state refresh

# Explicit source-only file input repair: no oversized Lean name array literals.
# Explicit retry after compiler-reserved-name repair (commit 4142b3f9).
# Follow-up approved narrow classifier repair + fail-closed census regression.
# CI timeout repair: preserve double check before fast-forward publishing.
# Only this workflow file's explicit opt-in push creates an automatic run.
# This rebuilds deterministic graph products; it performs NO D2 searches,
# checker continuations, workflow reruns, independent reviews, or RH claims.
on:
  push:
    branches: [research/post290-step123-output]
    paths: [.github/workflows/rhrc_post292_one_shot_rhkg_refresh.yml]
  workflow_dispatch:
    inputs:
      refresh_generated_state:
        description: "Explicitly regenerate deterministic RHKG only; no D2 work"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pr292-one-shot-derived-state-refresh
  cancel-in-progress: false

jobs:
  materialize-and-commit:
    if: >-
      (github.ref == 'refs/heads/research/post290-step123-output' ||
       github.ref == 'refs/heads/codex/pr292-completion-20261017') &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(PR292): one-shot RHKG refresh')) ||
       (github.event_name == 'workflow_dispatch' && inputs.refresh_generated_state == true))
    runs-on: ubuntu-latest
    # Full 2,766-root regeneration + independent post-commit recheck exceeded
    # the former 90-minute limit on run 38815669679; retain all proof gates.
    # The initial no-write freshness observation may itself walk every root.
    # Preserve the write and two independent full checks even on late drift.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install existing RHRC generator dependencies
        run: python -m pip install -r research/RHRC/requirements.txt
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Pin exact source head and validate proof registry before regeneration
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/research/post290-step123-output|refs/heads/codex/pr292-completion-20261017) ;;
            *) echo 'Ref outside the two authorized PR292 source branches'; exit 1 ;;
          esac
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all -- '*.lean' lean-toolchain lake-manifest.json lakefile.lean lakefile.toml)"
          # Classify every tracked file before the expensive 2,766-root Lean walk.
          # Historic .lean snippets remain audit-only fixtures, never theorem roots.
          python research/RHRC/graph/tests/test_post292_review_file_classes.py
          python -O research/RHRC/graph/tests/test_post292_review_file_classes.py
          python research/RHRC/integration/test_source_only_dependency_extract.py
          python -O research/RHRC/integration/test_source_only_dependency_extract.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_formal_receipt.py
          python -O research/RHRC/routes/R003_ccm_bridge/post290/test_formal_receipt.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_d2_source_equivalence.py
          python -O research/RHRC/routes/R003_ccm_bridge/post290/test_d2_source_equivalence.py
          export POST290_CHECKED_HEAD="$(git rev-parse HEAD)"
          export POST290_CHECKED_TREE="$(git rev-parse HEAD^{tree})"
          lake build \
            Zeta23.RHRC.RegisteredClaimBindings \
            Zeta23.RHRC.DeclarationDependencyExport \
            Zeta23.RHRC.SourceCandidateResolution \
            Zeta23.RHRC.Step123OutputBindings
          python research/RHRC/tools/registered_theorem_binding_lint.py
          python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope promoted
          mkdir -p /tmp/pr292-rhkg
          lake env lean Zeta23/RHRC/Step123OutputBindings.lean > /tmp/pr292-rhkg/pre-bindings.log
          python research/RHRC/routes/R003_ccm_bridge/post290/build_formal_receipt.py \
            --log /tmp/pr292-rhkg/pre-bindings.log \
            --out /tmp/pr292-rhkg/pre-compiler-receipt.json
      - name: Record no-write freshness before intentional regeneration
        shell: bash
        run: |
          set -euo pipefail
          if python research/RHRC/tools/materialize_derived_state.py --check \
              > /tmp/pr292-rhkg/derived-check-before-write.log 2>&1; then
            echo 'FRESH_BEFORE_WRITE' > /tmp/pr292-rhkg/pre-write-disposition.txt
          else
            code=$?
            echo "PRE_WRITE_CHECK_FAILED:$code; strict transactional write and checks still required" \
              > /tmp/pr292-rhkg/pre-write-disposition.txt
            tail -30 /tmp/pr292-rhkg/derived-check-before-write.log
          fi
      - name: Transactionally regenerate and independently check every declared derived-state output
        shell: bash
        run: |
          set -euo pipefail
          python research/RHRC/tools/materialize_derived_state.py --write \
            > /tmp/pr292-rhkg/derived-write.log 2>&1 || { tail -100 /tmp/pr292-rhkg/derived-write.log; exit 1; }
          python research/RHRC/tools/materialize_derived_state.py --check \
            > /tmp/pr292-rhkg/derived-check-before-commit.log 2>&1 || { tail -100 /tmp/pr292-rhkg/derived-check-before-commit.log; exit 1; }
          git diff --check
          python - <<'PY'
          import subprocess
          prefixes=(
              'research/RHRC/graph/compiler/',
              'research/RHRC/graph/generated/',
              'research/RHRC/integration/generated/',
              'research/RHRC/ffbbp/generated/',
              'research/RHRC/ool/generated/',
          )
          lines=subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          for line in lines:
              path=line[3:].strip()
              if not path.startswith(prefixes):
                  raise SystemExit('Derived-state generator modified non-generated source: '+path)
          if not lines:
              print('Derived state already fresh: no changes to commit')
          else:
              print('Derived-state candidate paths:',len(lines))
          PY
      - name: Commit only the five governed derived-state roots; never alter theorem or D2 sources
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            research/RHRC/graph/compiler \
            research/RHRC/graph/generated \
            research/RHRC/integration/generated \
            research/RHRC/ffbbp/generated \
            research/RHRC/ool/generated
          git diff --cached --check
          git diff --cached --stat > /tmp/pr292-rhkg/GENERATED_DIFF_STAT.txt
          if git diff --cached --quiet; then
            echo 'No generated changes required' > /tmp/pr292-rhkg/commit-disposition.txt
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(PR292): materialize and freeze exact-head RHKG derived state"
            echo 'GENERATED_STATE_COMMITTED' > /tmp/pr292-rhkg/commit-disposition.txt
          fi
          git rev-parse HEAD > /tmp/pr292-rhkg/HEAD.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr292-rhkg/TREE.txt
          export POST290_CHECKED_HEAD="$(git rev-parse HEAD)"
          export POST290_CHECKED_TREE="$(git rev-parse HEAD^{tree})"
          lake env lean Zeta23/RHRC/Step123OutputBindings.lean > /tmp/pr292-rhkg/final-bindings.log
          python research/RHRC/routes/R003_ccm_bridge/post290/build_formal_receipt.py \
            --log /tmp/pr292-rhkg/final-bindings.log \
            --out /tmp/pr292-rhkg/final-compiler-receipt.json
          # The second full check runs below in a new clean checkout of this
          # candidate commit, before any generator write in that checkout.
          git diff --exit-code HEAD -- '*.lean' lean-toolchain lake-manifest.json lakefile.lean lakefile.toml
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Check the candidate in a new clean checkout before any generator write there
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/pr292-clean-checkout HEAD
          ln -s "$GITHUB_WORKSPACE/.lake" /tmp/pr292-clean-checkout/.lake
          cd /tmp/pr292-clean-checkout
          # A directory-only /.lake/ ignore rule does not match this symlink.
          # Verify the exact cache path is ignored, then retain the full clean gate.
          git check-ignore -v .lake > /tmp/pr292-rhkg/CLEAN_CHECKOUT_CACHE_IGNORE.txt
          git status --porcelain --untracked-files=all \
            > /tmp/pr292-rhkg/CLEAN_CHECKOUT_STATUS_BEFORE.txt
          cat /tmp/pr292-rhkg/CLEAN_CHECKOUT_STATUS_BEFORE.txt
          test ! -s /tmp/pr292-rhkg/CLEAN_CHECKOUT_STATUS_BEFORE.txt
          git rev-parse HEAD > /tmp/pr292-rhkg/CLEAN_CHECKOUT_HEAD.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr292-rhkg/CLEAN_CHECKOUT_TREE.txt
          python research/RHRC/tools/materialize_derived_state.py --check \
            > /tmp/pr292-rhkg/derived-check-after-commit.log 2>&1 || \
            { tail -100 /tmp/pr292-rhkg/derived-check-after-commit.log; exit 1; }
          cp /tmp/pr292-rhkg/derived-check-after-commit.log \
            /tmp/pr292-rhkg/derived-check-clean-checkout.log
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Publish only a fast-forward verified generated-state commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF"
          echo "Exact generated HEAD: $(git rev-parse HEAD)"
      - name: Preserve compiler/graph receipts, including negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr292-rhkg-refresh-receipts-${{ github.run_id }}
          path: /tmp/pr292-rhkg/
          retention-days: 20
          if-no-files-found: ignore
