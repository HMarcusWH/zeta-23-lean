name: Post268 recovery snapshot
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'research/post268-audit-proof-and-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive exact committed source for repair review
        env:
          OUTPUT: ${{ runner.temp }}/post268-recovery
        run: |
          mkdir -p "$OUTPUT"
          git archive --format=zip -o "$OUTPUT/head.zip" HEAD
          git rev-parse HEAD HEAD^{tree} > "$OUTPUT/source.txt"
          printf '%s\n' 'Prior uncommitted core transport: CORRUPT, never executed or deployed.' 'Recovered concatenation SHA256: 547bdf3e52c6972adac9325ef68e227bfafe47d78d45041326df0e581578ad0e' > "$OUTPUT/pending-transport-status.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: post268-recovery-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/post268-recovery
          if-no-files-found: error
          retention-days: 7
