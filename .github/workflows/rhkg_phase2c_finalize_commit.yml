name: RHKG Phase 2C finalize generated atlas

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize-generated-products:
    if: github.event.pull_request.number == 259
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove one-shot finalizer from final graph subject
        run: git rm .github/workflows/rhkg_phase2c_finalize_commit.yml
      - name: Run Phase 2C graph unit tests
        run: python -m unittest discover -s research/RHRC/graph/tests -p 'test_*.py' -v
      - name: Regenerate Phase 2C deterministic products
        run: |
          python research/RHRC/graph/build.py --write
          python research/RHRC/graph/validate.py
      - name: Assert Phase 2C research state and claim firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          g = Path("research/RHRC/graph/generated")
          atlas = json.loads((g / "DEPENDENCY_KERNEL_ATLAS.json").read_text())
          overlap = json.loads((g / "DEPENDENCY_COHORT_OVERLAP.json").read_text())
          sig = json.loads((g / "DEPENDENCY_SIGNATURE_CLASSES.json").read_text())
          coverage = json.loads((g / "REPOSITORY_COVERAGE.json").read_text())
          unresolved = json.loads((g / "UNRESOLVED_GRAPH_ITEMS.json").read_text())

          assert atlas["schema_version"] == "RHKG-phase2c-dependency-kernel-atlas-0.5"
          assert atlas["local_declaration_count"] == 3139
          assert atlas["registered_root_count"] == 75
          assert atlas["terminal_claim"] == "RH_OPEN"
          assert atlas["graph_theorem_promotion"] is False

          by = {row["cohort_id"]: row for row in overlap["cohorts"]}
          assert set(by) == {
              "ROUTE_R001", "ROUTE_R002", "ROUTE_R003", "ROUTE_R004",
              "RH_EQUIVALENCE_SURFACE", "GLOBAL_BOTTOM_CHAIN",
              "CANONICAL_ARITHMETIC_SURFACE",
          }
          assert by["ROUTE_R001"]["root_count"] == 4
          assert by["ROUTE_R002"]["root_count"] == 2
          assert by["ROUTE_R003"]["root_count"] == 59
          assert by["ROUTE_R004"]["root_count"] == 1

          rh = by["RH_EQUIVALENCE_SURFACE"]
          assert rh["local_dependency_intersection_count"] == 599
          assert rh["local_dependency_union_count"] == 2224
          shells = {row["claim_id"]: row for row in rh["member_shells"]}
          assert shells["R001_PRIME_UPPER_EQUIV_RH"]["shell_against_cohort_intersection_count"] == 12
          assert shells["AUDIT_CANONICAL_ARITHMETIC_CRITERIA_RH_EQUIVALENCE"]["shell_against_cohort_intersection_count"] == 1541
          assert shells["AUDIT_GLOBAL_BOTTOM_RESIDUAL_EXCLUSION_RH_EQUIVALENCE"]["shell_against_cohort_intersection_count"] == 1535

          gb = by["GLOBAL_BOTTOM_CHAIN"]
          assert gb["local_dependency_intersection_count"] == 242
          assert gb["local_dependency_union_count"] == 2682

          containments = {
              (row["subset_claim_id"], row["superset_claim_id"])
              for row in sig["strict_local_closure_containments"]
          }
          assert (
              "R003_CANONICAL_PRIME_REMAINDER_NORMAL_FORM",
              "EZ_GLOBAL_BOTTOM_ARITHMETIC_RESIDUAL",
          ) in containments

          for product in (overlap, sig):
              assert product["terminal_claim"] == "RH_OPEN"
              assert product["graph_theorem_promotion"] is False

          assert coverage["schema_version"] == "RHKG-phase2c-coverage-0.5"
          assert coverage["registered_proved_lean_declaration_count"] == 75
          assert coverage["terminal_claim"] == "RH_OPEN"
          assert coverage["graph_theorem_promotion"] is False
          assert unresolved["schema_version"] == "RHKG-phase2c-unresolved-0.5"
          assert unresolved["claim_firewall"] == "RH_OPEN"
          print("RHKG Phase 2C research-state assertions: PASS")
          PY
      - name: Commit generated atlas and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/RHRC/graph/generated
          if git diff --cached --quiet; then
            echo "No Phase 2C finalization changes to commit."
            exit 0
          fi
          git commit -m "RHKG Phase 2C: materialize dependency kernel atlas"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
