name: RHRC post290 source and output proof components

on:
  push:
    branches: [research/post290-step123-output]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhrc-post290-output-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  lean-components:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        id: project-cache
        with:
          path: .lake/build
          key: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Compile each implemented component; full producer remains a separate gate
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            Zeta23.CCM.UniversalSincDetector
            Zeta23.CCM.UniversalSincDetectorBounds
            Zeta23.CCM.UniversalSincDetectorInverse
            Zeta23.CCM.UniversalSincProductMoments
            Zeta23.CCM.UniversalSincInverseGevreyBounds
            Zeta23.CCM.UniversalSincSourceLaw
            Zeta23.CCM.UniversalSincSourceCharacteristic
            Zeta23.CCM.UniversalSincSourceTail
            Zeta23.CCM.UniversalSincBoxDensity
            Zeta23.CCM.UniversalSincSourceDensity
            Zeta23.CCM.UniversalSincSourceDensityTransform
            Zeta23.CCM.UniversalSincSourceDensityIdentification
            Zeta23.CCM.UniversalSincSourceComplexTransform
            Zeta23.CCM.UniversalSincSourceSymmetry
            Zeta23.CCM.UniversalSincSourceFacade
            Zeta23.CCM.OriginalSincNativeSource
            Zeta23.CCM.OriginalSincNativeMass
            Zeta23.ExceptionalZero.UniversalSincNativeSourceIdentification
            Zeta23.ExceptionalZero.UniversalSincPhysicalDetector
            Zeta23.ExceptionalZero.UniversalSincDetectorVisibility
            Zeta23.ExceptionalZero.ZetaRealStripNonvanishing
            Zeta23.ExceptionalZero.UniversalSincCorrelationReal
            Zeta23.ExceptionalZero.PositiveMomentSeries
            Zeta23.ExceptionalZero.PositiveMGFContinuation
            Zeta23.ExceptionalZero.PositiveLaplaceTilt
            Zeta23.CCM.CanonicalPoleNeutralGeometry
            Zeta23.CCM.CanonicalPoleNeutralCarrier
            Zeta23.CCM.CanonicalPoleNeutralNesting
            Zeta23.CCM.CanonicalPoleExponentialMoments
            Zeta23.CCM.CanonicalPoleNeutralIntertwining
            Zeta23.CCM.CanonicalPoleNeutralNormals
            Zeta23.CCM.CanonicalPoleNeutralCubicWitness
            Zeta23.CCM.CanonicalPoleNeutralSourceMoment
            Zeta23.CCM.CanonicalPoleNeutralIndexRigidity
            Zeta23.CCM.CanonicalPoleNeutralSimpleEvenTie
            Zeta23.CCM.CanonicalPoleNeutralShiftedSecular
            Zeta23.CCM.CanonicalPoleNeutralTiePackage
            Zeta23.CCM.CanonicalPoleNeutralBottomNFlow
            Zeta23.CCM.FiniteBottomGapSelector
            Zeta23.CCM.CanonicalDeepThresholdSelection
            Zeta23.CCM.NativePoleNeutralTrialDepth
            Zeta23.CCM.NativeDeepThresholdGround
            Zeta23.CCM.NativeDeepThresholdInverseBudgets
            Zeta23.CCM.NativeDeepThresholdSimplicity
            Zeta23.CCM.NativeDeepThresholdEvenMoment
            Zeta23.CCM.PoleNeutralCompactInverse
            Zeta23.CCM.OriginalSincCompactPotential
            Zeta23.CCM.PoleNeutralUniqueness
            Zeta23.CCM.CanonicalTrialResidualChannels
            Zeta23.CCM.NativeIntegerPrimeSource
            Zeta23.CCM.NativeIntegerPrimeField
            Zeta23.CCM.NativeIntegerPrimeConvolution
            Zeta23.CCM.NativePositiveCompletion
            Zeta23.CCM.NativePositiveCompletionCells
            Zeta23.CCM.NativePositiveCompletionMass
            Zeta23.CCM.NativePositiveCompletionHead
            Zeta23.CCM.NativePositiveCompletionTail
            Zeta23.CCM.NativePositiveCompletionCertificate
            Zeta23.CCM.NativeFloorCompletionSource
            Zeta23.CCM.NativeRationalCompletionLaplace
            Zeta23.CCM.Step123PrimeSeam
          )
          lake build "${targets[@]}" 2>&1 | tee -a /tmp/post290-compiler.txt
      - name: Reject proof escapes
        run: python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope promoted
      - name: Exact component types and admitted axioms through existing compiler resolver
        shell: bash
        run: |
          set -euo pipefail
          export POST290_CHECKED_HEAD="$(git rev-parse HEAD)"
          export POST290_CHECKED_TREE="$(git rev-parse HEAD^{tree})"
          lake build Zeta23.RHRC.Step123OutputBindings
          lake env lean Zeta23/RHRC/Step123OutputBindings.lean | tee /tmp/post290-bindings.txt
          python research/RHRC/routes/R003_ccm_bridge/post290/build_formal_receipt.py --log /tmp/post290-bindings.txt --out /tmp/STEP123_FORMAL_OUTPUT.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post290-compiler-${{ github.sha }}
          path: |
            /tmp/post290-compiler.txt
            /tmp/post290-bindings.txt
            /tmp/STEP123_FORMAL_OUTPUT.json

  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Replay exact geometry, adjoint signs, ties and retained Schur controls
        run: |
          python research/RHRC/integration/post290/spec/validate_spec.py
          python research/RHRC/routes/R003_ccm_bridge/post290/source_lineage_check.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_pole_neutral_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_strict_odd_and_tie_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_detector_schur_provenance.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_deep_threshold_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_inverse_budgets_and_gap_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_argon_continuum_and_roots_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_k3_resume.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_k3_replay_shards.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_k3_seams.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_native_divisor_controls.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_native_mass_candidate.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_output_mutations.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_formal_receipt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post290-exact-controls-${{ github.sha }}
          path: research/RHRC/routes/R003_ccm_bridge/post290/evidence/

  native-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Evaluate all frozen native probe rows with explicit seam cancellation
        run: python research/RHRC/routes/R003_ccm_bridge/post290/evaluate_native_output.py --bits 384 --out /tmp/post290-native/native_panel.json
      - name: Independently reconstruct every scalar residual and Gram entry at 1024 bits
        run: python research/RHRC/routes/R003_ccm_bridge/post290/verify_native_output.py /tmp/post290-native/native_panel.json --out /tmp/post290-native/native_panel_check.json
      - name: Require the full observation panel; keep universal and generated-detector scope open
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          d=json.loads(Path('/tmp/post290-native/native_panel.json').read_text())
          c=json.loads(Path('/tmp/post290-native/native_panel_check.json').read_text())
          assert d['source_identity']['commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert d['source_identity']['tree']==subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert d['source_identity']['working_tree_dirty'] is False
          assert d['frozen_panel_complete'] is True and d['pair_count']==44 and d['row_count']==176
          assert d['evaluated_rows']==176 and d['unresolved_rows']==0
          assert c['verified_pairs']==44 and c['unresolved_pairs']==0
          assert c['universal_theorem_authority'] is False and c['terminal_claim']=='RH_OPEN'
          print('176 native probe rows freshly checked; universal detector and ground claims OPEN.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post290-native-observations-${{ github.sha }}
          path: /tmp/post290-native/
