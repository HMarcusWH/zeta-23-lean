name: RHRC post290 source and output proof components

on:
  push:
    branches: [research/post290-step123-output]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhrc-post290-output-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  lean-components:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        id: project-cache
        with:
          path: .lake/build
          key: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Compile each implemented component; full producer remains a separate gate
        shell: bash
        run: |
          set +e
          failed=0
          for target in \
            Zeta23.CCM.UniversalSincDetector \
            Zeta23.ExceptionalZero.UniversalSincDetectorVisibility \
            Zeta23.CCM.CanonicalPoleNeutralGeometry \
            Zeta23.CCM.NativeIntegerPrimeSource \
            Zeta23.CCM.NativePositiveCompletion \
            Zeta23.CCM.Step123PrimeSeam
          do
            lake build "$target" 2>&1 | tee -a /tmp/post290-compiler.txt
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Reject proof escapes
        run: python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope promoted
      - name: Exact component types and admitted axioms through existing compiler resolver
        run: |
          lake build Zeta23.RHRC.Step123OutputBindings
          lake env lean Zeta23/RHRC/Step123OutputBindings.lean | tee /tmp/post290-bindings.txt
          python research/RHRC/routes/R003_ccm_bridge/post290/build_formal_receipt.py --log /tmp/post290-bindings.txt --out /tmp/STEP123_FORMAL_OUTPUT.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post290-compiler-${{ github.sha }}
          path: |
            /tmp/post290-compiler.txt
            /tmp/post290-bindings.txt
            /tmp/STEP123_FORMAL_OUTPUT.json

  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Replay exact geometry, adjoint signs, ties and retained Schur controls
        run: |
          python research/RHRC/integration/post290/spec/validate_spec.py
          python research/RHRC/routes/R003_ccm_bridge/post290/source_lineage_check.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_pole_neutral_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_strict_odd_and_tie_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_detector_schur_provenance.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_deep_threshold_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_inverse_budgets_and_gap_exact.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_k3_resume.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_k3_replay_shards.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_k3_seams.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_native_divisor_controls.py
          python research/RHRC/routes/R003_ccm_bridge/post290/test_output_mutations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post290-exact-controls-${{ github.sha }}
          path: research/RHRC/routes/R003_ccm_bridge/post290/evidence/
