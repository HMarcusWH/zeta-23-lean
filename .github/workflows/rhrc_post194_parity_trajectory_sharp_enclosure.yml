name: RHRC post-194 parity trajectory sharp enclosure

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rhrc-post194-parity-trajectory-sharp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  post194-parity-trajectory-sharp-enclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install R003 numerical audit requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Check canonical second-aperture derivative implementation
        run: python research/RHRC/routes/R003_ccm_bridge/check_post194_fb05_q14_fixed_unit_second_derivative_scope.py
      - name: Check post-#194 sharp trajectory plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post194_fb05_q14_parity_trajectory_sharp_enclosure_scope.py
      - name: Probe post-#194 frozen sharp trajectory scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post194_fb05_q14_parity_trajectory_sharp_enclosure_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post194_fb05_q14_parity_trajectory_sharp_enclosure_v1.json \
            --output /tmp/POST194_FB05_Q14_PARITY_TRAJECTORY_SHARP_SCHEDULE.json
      - name: Certify post-#194 sharp parity trajectory enclosure
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post194_fb05_q14_parity_trajectory_sharp_enclosure_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post194_fb05_q14_parity_trajectory_sharp_enclosure_v1.json \
            --schedule /tmp/POST194_FB05_Q14_PARITY_TRAJECTORY_SHARP_SCHEDULE.json \
            --output /tmp/POST194_FB05_Q14_PARITY_TRAJECTORY_SHARP_CERTIFICATE.json
