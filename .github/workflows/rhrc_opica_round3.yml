name: OPICA Round3 scoped current-source proof and falsification gates
'on':
  pull_request:
    branches: [main]
  push:
    branches: [research/opica-round3]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: opica-round3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  OPICA2: research/RHRC/integration/opica_round2
  OPICA3: research/RHRC/integration/opica_round3
  OPICA3_OUTPUT: /tmp/opica3-evidence
  REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  LEAN_NUM_THREADS: '2'
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - name: Freeze the exact current source before checks
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OPICA3_OUTPUT/source"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA3_OUTPUT/source/before.json"
    - name: Check closed source extension and premise firewall in both modes
      shell: bash
      run: |
        set -euo pipefail
        python -B "$OPICA3/validate_contract.py" --output "$OPICA3_OUTPUT/preflight.json"
        python -O -B "$OPICA3/validate_contract.py" --output "$OPICA3_OUTPUT/preflight-optimized.json"
        python -B -m unittest discover -s "$OPICA3/tests" -p test_contract.py -v > "$OPICA3_OUTPUT/falsifiers-normal.log" 2>&1
        python -O -B -m unittest discover -s "$OPICA3/tests" -p test_contract.py -v > "$OPICA3_OUTPUT/falsifiers-optimized.log" 2>&1
    - name: Verify source remained unchanged
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA3_OUTPUT/source/before.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica3-current-contract-and-falsifiers
        path: ${{ env.OPICA3_OUTPUT }}
        if-no-files-found: error
  runtime-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: contract
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - name: Freeze the current runtime source
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OPICA3_OUTPUT/source" "$RUNNER_TEMP/opica3-runtime-temp"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA3_OUTPUT/source/before.json"
        printf '%s\n' "TEMP=$RUNNER_TEMP/opica3-runtime-temp" "TMP=$RUNNER_TEMP/opica3-runtime-temp" "TMPDIR=$RUNNER_TEMP/opica3-runtime-temp" >> "$GITHUB_ENV"
    - name: Install the existing pinned interval backend
      shell: bash
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r "$OPICA2/python-checks.lock"
    - name: Run all current non-Lean Round2 tests in both modes without skips
      shell: bash
      run: |
        set -euo pipefail
        for mode in normal optimized; do
          flags=()
          if [ "$mode" = optimized ]; then flags=(-O); fi
          OPICA3_TEST_MODE="$mode" python "${flags[@]}" -B - <<'PY' > "$OPICA3_OUTPUT/runtime-$mode.log" 2>&1
        import json,os,subprocess,unittest
        from pathlib import Path
        root=Path(os.environ['OPICA2'],'tests')
        loader=unittest.TestLoader()
        def flatten(suite):
            for item in suite:
                if isinstance(item,unittest.TestSuite): yield from flatten(item)
                else: yield item
        cases=list(flatten(loader.discover(str(root),pattern='test_*.py')))
        ids=[case.id() for case in cases]
        native='test_claim_firewall.NativeTypedSemanticControls.test_seven_positive_and_wrong_type_native_fixtures'
        if len(ids)!=212 or len(set(ids))!=212 or ids.count(native)!=1:
            raise SystemExit('Exact current212-test inventory with one named native case required')
        ordinary=[case for case in cases if case.id()!=native]
        if len(ordinary)!=211: raise SystemExit('All211 current non-Lean cases required')
        suite=unittest.TestSuite(ordinary)
        result=unittest.TextTestRunner(verbosity=2).run(suite)
        report={'schema':'OPICA3_CURRENT_ROUND2_RUNTIME_REGRESSION_V1','mode':os.environ['OPICA3_TEST_MODE'],
          'checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
          'checked_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
          'discovered':len(cases),'selected':len(ordinary),'selected_test_ids':[case.id() for case in ordinary],
          'held_native_case':{'id':native,'execution':'NOT_EXECUTED_HERE_REQUIRED_SEPARATE_CURRENT_NATIVE_GATE'},
          'run':result.testsRun,'errors':len(result.errors),
          'failures':len(result.failures),'skipped':len(result.skipped),'successful':result.wasSuccessful(),
          'scope':'ALL_CURRENT211_NON_LEAN_TESTS_INCLUDING_ACTUAL_ARB_256_512_PRODUCER_GRAM_SCHEMA_AND_ADVERSARIES',
          'full_core_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA3_OUTPUT'],'runtime-'+os.environ['OPICA3_TEST_MODE']+'.json').write_text(json.dumps(report,indent=2)+'\n')
        if not result.wasSuccessful() or result.testsRun!=211 or result.skipped:
            raise SystemExit(1)
        PY
        done
    - name: Verify exact runtime source remained unchanged
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA3_OUTPUT/source/before.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica3-current-runtime-regressions
        path: ${{ env.OPICA3_OUTPUT }}
        if-no-files-found: error
  current-formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: contract
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - name: Freeze the exact current compiler source
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OPICA3_OUTPUT/source"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA3_OUTPUT/source/before.json"
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
      with:
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false
        use-mathlib-cache: true
    - name: Compile current original forty and new four with typed consumers and axiom audits
      shell: bash
      run: |
        set -euo pipefail
        python -B "$OPICA3/validate_contract.py" --formal-output "$OPICA3_OUTPUT/formal" --timeout 20000
    - name: Install existing canonical checker dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --require-hashes --only-binary=:all: -r "$OPICA2/python-checks.lock"
        python -m pip install --require-hashes --only-binary=:all: -r research/RHRC/integration/opica_followup/python-checks.lock
        python -m pip install -r research/RHRC/requirements.txt
    - name: Execute and independently reparse the separately held current native unit in both modes
      shell: bash
      run: |
        set -euo pipefail
        for mode in normal optimized; do
          flags=()
          if [ "$mode" = optimized ]; then flags=(-O); fi
          OPICA3_TEST_MODE="$mode" OPICA2_TYPED_CONTROL_OUTPUT="$OPICA3_OUTPUT/current-native-$mode" python "${flags[@]}" -B - <<'PY' > "$OPICA3_OUTPUT/current-native-$mode.log" 2>&1
        import json,os,subprocess,unittest
        from pathlib import Path
        root=Path(os.environ['OPICA2'],'tests')
        loader=unittest.TestLoader()
        def flatten(suite):
            for item in suite:
                if isinstance(item,unittest.TestSuite): yield from flatten(item)
                else: yield item
        cases=list(flatten(loader.discover(str(root),pattern='test_claim_firewall.py')))
        native='test_claim_firewall.NativeTypedSemanticControls.test_seven_positive_and_wrong_type_native_fixtures'
        selected=[case for case in cases if case.id()==native]
        if len(selected)!=1: raise SystemExit('Exactly the held current native unit required')
        result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
        if not result.wasSuccessful() or result.testsRun!=1 or result.skipped:
            raise SystemExit('Current native unit did not complete without skips/errors/failures')
        import controls
        from certificate_io import load_strict_json
        parent=Path(os.environ['OPICA2_TYPED_CONTROL_OUTPUT'])
        children=list(parent.iterdir())
        if len(children)!=1 or not children[0].is_dir():
            raise SystemExit('One fresh native seven-pair artifact set required')
        parsed=controls.verify_typed_control_artifacts(Path.cwd(),children[0],
            load_strict_json(Path(os.environ['OPICA2'],'CONTROL_REGISTRY.json')),optimized=(os.environ['OPICA3_TEST_MODE']=='optimized'))
        report={'schema':'OPICA3_CURRENT_NATIVE_ROUND2_UNIT_V1','mode':os.environ['OPICA3_TEST_MODE'],
          'test_id':native,'run':result.testsRun,'skipped':len(result.skipped),
          'checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
          'checked_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
          'raw_artifacts':str(children[0]),'independent_protected_reparse':parsed,
          'scope':'CURRENT_SINGLE_NATIVE_UNIT_ACTUAL_SEVEN_POSITIVE_AND_SEVEN_TYPE_REJECTION_COMMANDS',
          'full_core_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA3_OUTPUT'],'current-native-'+os.environ['OPICA3_TEST_MODE']+'.json').write_text(json.dumps(report,indent=2)+'\n')
        PY
        done
    - name: Check every current committed canonical product before any regeneration
      shell: bash
      run: |
        set -euo pipefail
        lake build Zeta23.RHRC.RegisteredClaimBindings Zeta23.RHRC.DeclarationDependencyExport Zeta23.RHRC.SourceCandidateResolution
        python -B "$OPICA2/run_checks.py" generated --evidence-dir "$OPICA3_OUTPUT/current-canonical" --timeout 20000
    - name: Verify current compiler source remained unchanged
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA3_OUTPUT/source/before.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica3-current-formal
        path: ${{ env.OPICA3_OUTPUT }}
        if-no-files-found: error
