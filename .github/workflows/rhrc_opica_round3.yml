        mkdir -p "$OPICA3_OUTPUT"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        test -z "$(git status --porcelain --untracked-files=all)"
        if [ -f research/RHRC/integration/opica_round4/BUILD_MANIFEST.json ]; then
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$OPICA3_OUTPUT/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND3_BASELINE_REPLAY=true' >> "$GITHUB_ENV"
        else
          printf '%s\n' 'ROUND3_BASELINE_REPLAY=false' >> "$GITHUB_ENV"
        fi
    - name: Freeze the current finite source evaluator
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OPICA3_OUTPUT/source"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA3_OUTPUT/source/before.json"
    - name: Install the existing pinned interval and symbolic dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --require-hashes --only-binary=:all: -r "$OPICA2/python-checks.lock"
        python -m pip install --require-hashes --only-binary=:all: -r research/RHRC/integration/opica_followup/python-checks.lock
    - name: Run every targeted source control and actual finite case in both modes
      shell: bash
      run: |
        set -euo pipefail
        for mode in normal optimized; do
          flags=()
          if [ "$mode" = optimized ]; then flags=(-O); fi
          OPICA3_TEST_MODE="$mode" python "${flags[@]}" -B - <<'PY' > "$OPICA3_OUTPUT/evaluator-tests-$mode.log" 2>&1
        import os
        from pathlib import Path
        from research.RHRC.integration.opica_round3.validate_contract import run_unit_lane
        mode=os.environ['OPICA3_TEST_MODE']
        raise SystemExit(run_unit_lane(Path.cwd(),'evaluator',mode,
            Path(os.environ['OPICA3_OUTPUT'],'evaluator-tests-'+mode+'.json')))
        PY
          python "${flags[@]}" -B "$OPICA3/source_evaluator.py" \
            --cases "$OPICA3/fixtures/source_evaluator_cases.json" \
            --output-dir "$OPICA3_OUTPUT/source-evaluator/$mode" \
            --precision-bits 128 --seconds-per-case 30
        done
    - name: Independently recompute the actual source and check every finite enclosure
      shell: bash
      run: |
        set -euo pipefail
        python -B - <<'PY'
        import json,os,subprocess,shutil
        from pathlib import Path
        from research.RHRC.integration.opica_round3.source_checker import verify_evaluator_evidence
        result=verify_evaluator_evidence(Path.cwd(),Path(os.environ['OPICA3_OUTPUT']),
            expected_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            expected_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),recompute=True)
        shutil.copytree(result['recompute_directory'],Path(os.environ['OPICA3_OUTPUT'],'direct-checks'))
        result['uploaded_recomputation_copy']='direct-checks'
        Path(os.environ['OPICA3_OUTPUT'],'source-check.json').write_text(json.dumps(result,indent=2)+'\n')
        PY
    - name: Verify finite source inputs remained unchanged
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA3_OUTPUT/source/before.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica3-current-source-evaluator
        path: ${{ env.OPICA3_OUTPUT }}
        if-no-files-found: error
  current-acceptance:
