name: CCM prime-weight endpoint jets finalizer

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize-prime-weight-jets:
    if: github.head_ref == 'ccm/prime-weight-endpoint-jets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove one-shot finalizer from final subject tree
        run: git rm .github/workflows/ccm_prime_weight_endpoint_jets_finalize.yml
      - name: Build new theorem module
        run: lake build Zeta23.CCM.GlobalParityBottomPrimeWeightJets
      - name: Build complete registered theorem authority surface
        run: lake build Zeta23.RHRC.RegisteredClaimBindings
      - name: Validate complete registered theorem bindings
        run: python3 research/RHRC/tools/registered_theorem_binding_lint.py
      - name: Materialize compiler dependency receipt
        run: python3 research/RHRC/tools/lean_dependency_extract.py --write
      - name: Regenerate deterministic RHKG products
        run: |
          python research/RHRC/graph/build.py --write
          python research/RHRC/graph/validate.py
      - name: Assert claim firewall and Phase-2E regression lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/RHRC')
          manifest = json.loads((root / 'REGISTERED_THEOREM_BINDINGS.json').read_text())
          assert manifest['terminal_claim'] == 'RH_OPEN'
          assert len(manifest['bindings']) == 76
          expected = {
              'id': 'R003_GLOBAL_BOTTOM_PRIME_WEIGHT_ENDPOINT_JETS',
              'theorem': 'Zeta23.CCM.GlobalBottomResidualState.primeTestWeight_endpoint_order_eight_of_evenStrict',
              'source': 'Zeta23/CCM/GlobalParityBottomPrimeWeightJets.lean',
          }
          assert expected in manifest['bindings']

          g = root / 'graph' / 'generated'
          q = json.loads((g / 'DEPENDENCY_PROJECTION_QUOTIENTS.json').read_text())
          f = json.loads((g / 'DEPENDENCY_PROJECTION_FRONTIERS.json').read_text())
          coverage = json.loads((g / 'REPOSITORY_COVERAGE.json').read_text())

          any_q = next(x for x in q['projections'] if x['projection'] == 'ANY')
          erased_q = next(x for x in q['projections'] if x['projection'] == 'THEOREM_VALUE_ERASED_SUPPORT')
          assert {x['signature']: x['count'] for x in any_q['atoms']} == {
              'A': 12, 'B': 78, 'C': 72, 'AB': 0, 'AC': 0, 'BC': 1463, 'ABC': 599,
          }
          assert {x['signature']: x['count'] for x in erased_q['atoms']} == {
              'A': 26, 'B': 11, 'C': 154, 'AB': 0, 'AC': 0, 'BC': 28, 'ABC': 0,
          }

          any_f = next(x for x in f['projections'] if x['projection'] == 'ANY')
          erased_f = next(x for x in f['projections'] if x['projection'] == 'THEOREM_VALUE_ERASED_SUPPORT')
          assert any_f['cross_atom_edge_count'] == 1026
          assert erased_f['cross_atom_edge_count'] == 30
          assert any_f['pair_probe']['cross_region_edge_count'] == 972
          assert erased_f['pair_probe']['cross_region_edge_count'] == 21

          for product in (q, f, coverage):
              assert product['terminal_claim'] == 'RH_OPEN'
              assert product.get('graph_theorem_promotion', False) is False

          print('Prime-weight endpoint jets finalizer assertions: PASS')
          PY
      - name: Commit generated authority state and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/RHRC/graph/compiler research/RHRC/graph/generated .github/workflows/ccm_prime_weight_endpoint_jets_finalize.yml
          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
            exit 0
          fi
          git commit -m "RHKG: materialize prime-weight endpoint jet authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
