name: RHRC OPICA full paper components

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/opica-obstruction-preservation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhrc-opica-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPICA: research/RHRC/integration/opica
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  opica-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate current Round4 child before historical parent replay
        id: round4-parent-scope
        if: ${{ hashFiles('research/RHRC/integration/opica_round4/BUILD_MANIFEST.json') != '' }}
        shell: bash
        env:
          ROUND4_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # R4_PARENT_SCOPE_V1: inspect the actual child before unchanged historical guards.
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$ROUND4_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$evidence/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{commit}' || git fetch --no-tags origin fe16565b2a31fb8b68bef916ae8f04d535880e7a
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND4_PARENT_SCOPE_REPLAY=true' >> "$GITHUB_ENV"
      - name: Authenticate explicit Round2 ancestor projection (baseline scope only)
        id: round2-ancestor
        if: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          projection="$GITHUB_WORKSPACE/../opica2-frozen-$GITHUB_JOB"
          mkdir -p "$evidence"
          python -B research/RHRC/tools/run_suite.py --freeze-source "$evidence/descendant-source-before.json"
          git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$evidence/projection.json"
          python -B research/RHRC/integration/opica/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$evidence/dispatch.json"
          printf '%s\n' "OPICA_ANCESTOR_PROJECTION=$projection" "OPICA_CURRENT_SOURCE_ROOT=$GITHUB_WORKSPACE" "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          report={'schema':'OPICA2_BASELINE_WORKFLOW_SCOPE_V1','workflow_checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseline_commit':'416aec21d4d6634675639b5397cc300d1f826e34','baseline_tree':'0506bca8ffe613e9cd9ab844650a1141d4494f66',
              'scope':'FROZEN_ANCESTOR_BASELINE_ONLY','current_tree_compatibility_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
          Path(os.environ['RUNNER_TEMP'],'opica2-baseline-scope','scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Check full source contract and protected baseline
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python "$OPICA/validate_contract.py" --output-dir /tmp/opica-contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-contract
          path: /tmp/opica-contract
          if-no-files-found: error

      - name: Verify unchanged descendant source and exact baseline projection
        if: ${{ always() && steps.round2-ancestor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPICA_CURRENT_SOURCE_ROOT"
          python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$RUNNER_TEMP/opica2-baseline-scope/descendant-source-before.json"
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py verify --repo "$GITHUB_WORKSPACE" --destination "$OPICA_ANCESTOR_PROJECTION" > "$RUNNER_TEMP/opica2-baseline-scope/projection-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        with:
          name: opica-baseline-source-scope-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/opica2-baseline-scope
          if-no-files-found: error

  opica-formal:
    needs: opica-contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate current Round4 child before historical parent replay
        id: round4-parent-scope
        if: ${{ hashFiles('research/RHRC/integration/opica_round4/BUILD_MANIFEST.json') != '' }}
        shell: bash
        env:
          ROUND4_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # R4_PARENT_SCOPE_V1: inspect the actual child before unchanged historical guards.
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$ROUND4_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$evidence/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{commit}' || git fetch --no-tags origin fe16565b2a31fb8b68bef916ae8f04d535880e7a
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND4_PARENT_SCOPE_REPLAY=true' >> "$GITHUB_ENV"
      - name: Authenticate explicit Round2 ancestor projection (baseline scope only)
        id: round2-ancestor
        if: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          projection="$GITHUB_WORKSPACE/../opica2-frozen-$GITHUB_JOB"
          mkdir -p "$evidence"
          python -B research/RHRC/tools/run_suite.py --freeze-source "$evidence/descendant-source-before.json"
          git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$evidence/projection.json"
          python -B research/RHRC/integration/opica/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$evidence/dispatch.json"
          printf '%s\n' "OPICA_ANCESTOR_PROJECTION=$projection" "OPICA_CURRENT_SOURCE_ROOT=$GITHUB_WORKSPACE" "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          report={'schema':'OPICA2_BASELINE_WORKFLOW_SCOPE_V1','workflow_checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseline_commit':'416aec21d4d6634675639b5397cc300d1f826e34','baseline_tree':'0506bca8ffe613e9cd9ab844650a1141d4494f66',
              'scope':'FROZEN_ANCESTOR_BASELINE_ONLY','current_tree_compatibility_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
          Path(os.environ['RUNNER_TEMP'],'opica2-baseline-scope','scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') == '' }}
          use-mathlib-cache: true
      - name: Build every required target and export complete compiler evidence
        env:
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python "$OPICA/build_receipt.py" --requested-head "$REQUESTED_HEAD" --requested-base 97926d6a949fed7af0429a373b47abc772012834 --output-dir /tmp/opica-formal
      - name: Verify release contract against the complete compiler receipt
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python "$OPICA/validate_contract.py" --phase release --formal-receipt /tmp/opica-formal/compiler-receipt.json --output /tmp/opica-formal/release-contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-formal
          path: /tmp/opica-formal
          if-no-files-found: error
      - name: Materialize canonical derived state for review on pushes
        id: materialize-derived
        if: github.event_name == 'push'
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python - <<'PY'
          import datetime, hashlib, importlib.util, json, os, shutil, subprocess, sys, tempfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd().resolve()
          output = Path('/tmp/opica-materialized-state')
          # Remove only this fixed external destination before any producer runs.
          if output.is_symlink() or output.is_file():
              output.unlink()
          elif output.exists():
              shutil.rmtree(output)

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(*args):
              return subprocess.check_output(['git', *args], cwd=repo)

          def paths(raw):
              return sorted(p.decode('utf-8') for p in raw.split(b'\0') if p)

          def source_path(relative):
              require(isinstance(relative, str), 'Non-string manifest path')
              pure = PurePosixPath(relative)
              require(not pure.is_absolute() and pure.as_posix() == relative
                  and '..' not in pure.parts and '\\' not in relative,
                  'Invalid manifest path: ' + relative)
              path = repo.joinpath(*pure.parts)
              require(path.resolve().is_relative_to(repo) and path.is_file()
                  and not any(parent.is_symlink() for parent in [path, *path.parents] if parent != repo),
                  'Missing, symlinked or escaping manifest file: ' + relative)
              return path

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def effective_generated_paths(original):
              # The frozen62 descriptor remains unchanged. Only an actual
              # authenticated storage context can add the exact16 shard paths.
              parent_path = source_path('research/RHRC/integration/opica/validate_contract.py')
              spec = importlib.util.spec_from_file_location('_actual_opica_materialization_parent', parent_path)
              require(spec is not None and spec.loader is not None, 'Actual parent reader unavailable')
              parent = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = parent
              spec.loader.exec_module(parent)
              context = parent._exact_source_extension_context(repo)
              extra = [] if context is None else list(getattr(context, 'generated_paths', ()))
              expected = ['research/RHRC/graph/compiler/registered_dependencies/'
                  + 'REGISTERED_DECLARATION_DEPENDENCIES-' + key + '.jsonl'
                  for key in '0123456789abcdef']
              require(not extra or (len(extra) == 16 and set(extra) == set(expected)),
                  'Authenticated generated storage paths differ from exact16')
              implementation = [] if context is None else list(getattr(context, 'implementation_paths', ()))
              require(len(implementation) == len(set(implementation))
                  and not set(implementation) & (set(original) | set(extra)),
                  'Implementation sources must remain outside generated writes')
              return list(original) + sorted(extra), context, sorted(implementation)

          manifest = json.loads((repo / 'research/RHRC/integration/opica/BUILD_MANIFEST.json').read_bytes())
          require(manifest.get('schema') == 'OPICA_REPO_BUILD_SPEC_V1', 'Unexpected manifest schema')
          original_generated = manifest['regenerate']['paths']
          generated, storage_context, implementation_paths = effective_generated_paths(original_generated)
          sources = [item['path'] for item in manifest['create'] + manifest['modify']]
          require(len(original_generated) == 62 and len(set(original_generated)) == 62
              and len(generated) in (62, 78) and len(set(generated)) == len(generated)
              and len(sources) == 59 and len(set(sources)) == 59
              and not set(generated) & set(sources), 'Wrong source/generated inventories')
          require(manifest['regenerate']['producer'] == 'research/RHRC/tools/materialize_derived_state.py --write',
              'Canonical producer identity changed')
          require(set(paths(git('ls-files', '-z', '--', *generated))) == set(generated),
              'Every generated target must already be tracked')
          for relative in generated + sources:
              source_path(relative)
          receipt_bytes = Path('/tmp/opica-formal/compiler-receipt.json').read_bytes()
          receipt = json.loads(receipt_bytes)
          release = json.loads(Path('/tmp/opica-formal/release-contract.json').read_bytes())
          head = git('rev-parse', 'HEAD').decode().strip()
          tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
          require(receipt.get('schema') == 'OPICA_COMPILER_RECEIPT_V1'
              and receipt.get('status') == 'COMPILER_VERIFIED'
              and receipt.get('checked_commit') == head and receipt.get('checked_tree') == tree
              and receipt.get('requested_head') == head and receipt.get('checkout_kind') == 'PR_HEAD',
              'Materialization requires the completed current-push compiler receipt')
          require(release.get('phase') == 'release' and release.get('status') == 'PASS'
              and release.get('errors') == [] and release.get('checked_commit') == head
              and release.get('checked_tree') == tree and release.get('tracked_source_dirty') is False
              and release.get('source_sha256') == receipt['sources'], 'Current release validation is required')
          require(os.environ.get('GITHUB_EVENT_NAME') == 'push' and os.environ.get('GITHUB_SHA') == head,
              'Materialization transport is limited to the actual push head')
          require(not git('status', '--porcelain', '-z'), 'Initial materialization checkout must be clean')
          fixed_paths = sorted(set(paths(git('ls-files', '-z'))) - set(generated))
          fixed_source_sha256 = {relative: sha(source_path(relative).read_bytes()) for relative in fixed_paths}

          def unchanged_source():
              require(git('rev-parse', 'HEAD').decode().strip() == head
                  and git('rev-parse', 'HEAD^{tree}').decode().strip() == tree, 'Git identity changed')
              actual = {relative: sha(source_path(relative).read_bytes()) for relative in sources}
              require(actual == receipt['sources'], 'The exact 59 compiler-bound source hashes changed')
              require({relative: sha(source_path(relative).read_bytes()) for relative in fixed_paths}
                  == fixed_source_sha256, 'A non-generated source changed during canonical production')
              require(subprocess.run(['git', 'diff', '--cached', '--quiet', 'HEAD', '--'], cwd=repo).returncode == 0,
                  'The canonical producer must not stage changes')
              return actual

          def generated_delta():
              tracked = paths(git('diff', '--no-renames', '--name-only', '-z', 'HEAD', '--'))
              untracked = paths(git('ls-files', '--others', '--exclude-standard', '-z'))
              require((set(tracked) | set(untracked)) <= set(generated),
                  'Producer changed a path outside the authenticated exact generated targets')
              return tracked, untracked

          unchanged_source()
          producer = [sys.executable, 'research/RHRC/tools/materialize_derived_state.py', '--write']
          subprocess.run(producer, cwd=repo, check=True)
          # No dedicated artifact directory exists until the complete unchanged
          # pipeline exits zero and every source/delta/copy guard succeeds.
          source_sha256 = unchanged_source()
          tracked, untracked = generated_delta()
          staging = Path(tempfile.mkdtemp(prefix='opica-materialized-state-', dir='/tmp'))
          try:
              inventory = []
              for relative in generated:
                  data = source_path(relative).read_bytes()
                  target = staging / 'files' / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  require(target.read_bytes() == data, 'Generated byte copy mismatch')
                  inventory.append({'path': relative, 'bytes': len(data), 'sha256': sha(data)})
              for record in inventory:
                  current = source_path(record['path']).read_bytes()
                  require(len(current) == record['bytes'] and sha(current) == record['sha256'],
                      'Generated file changed during artifact capture')
              require(unchanged_source() == source_sha256 and generated_delta() == (tracked, untracked),
                  'Checkout changed during artifact capture')
              generation = {
                  'schema': 'OPICA_DERIVED_STATE_MATERIALIZATION_V1', 'status': 'MATERIALIZED',
                  'generated_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'checked_commit': head, 'checked_tree': tree, 'event': 'push',
                  'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                  'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'producer_argv': producer, 'producer_exit_code': 0,
                  'compiler_receipt_sha256': sha(receipt_bytes), 'source_sha256': source_sha256,
                  'fixed_source_sha256': fixed_source_sha256,
                  'original_generated_paths': original_generated,
                  'additional_generated_storage_paths': sorted(set(generated) - set(original_generated)),
                  'storage_policy_sha256': None if storage_context is None else storage_context.policy_sha256,
                  'fixed_implementation_paths': implementation_paths,
                  'generated_files': inventory, 'modified_tracked_paths': tracked, 'untracked_paths': untracked,
                  'independent_review_approved': False, 'independent_human_review_approved': False,
                  'workflow_green_inferred': False, 'RH': 'OPEN', 'Step4': 'OPEN',
                  'authority': 'Exact canonical-producer bytes for review and a later commit; freshness is still gated.'}
              (staging / 'generation.json').write_bytes((json.dumps(generation, indent=2) + '\n').encode('utf-8'))
              require({p.relative_to(staging).as_posix() for p in staging.rglob('*') if p.is_file()}
                  == {'generation.json'} | {'files/' + relative for relative in generated},
                  'Dedicated artifact inventory differs from the authenticated generated files')
              os.replace(staging, output)
          finally:
              if staging.exists():
                  shutil.rmtree(staging)
          print('Captured all ' + str(len(generated)) + ' authenticated canonical generated files; ' + str(len(tracked))
              + ' tracked changes and ' + str(len(untracked)) + ' untracked changes. Freshness remains required.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && !cancelled() && steps.materialize-derived.outcome == 'success'
        with:
          name: opica-materialized-state
          path: /tmp/opica-materialized-state
          if-no-files-found: error
      - name: Require canonical generated files to be committed
        if: github.event_name == 'push' && !cancelled() && steps.materialize-derived.outcome == 'success'
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python - <<'PY'
          import importlib.util, json, subprocess, sys
          from pathlib import Path
          repo = Path.cwd().resolve()
          manifest = json.loads(Path('research/RHRC/integration/opica/BUILD_MANIFEST.json').read_bytes())
          original = manifest['regenerate']['paths']
          if len(original) != 62 or len(set(original)) != 62:
              raise SystemExit('Wrong original generated freshness allowlist')
          spec = importlib.util.spec_from_file_location('_actual_opica_freshness_parent',
              repo / 'research/RHRC/integration/opica/validate_contract.py')
          if spec is None or spec.loader is None:
              raise SystemExit('Actual parent reader unavailable')
          parent = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = parent
          spec.loader.exec_module(parent)
          context = parent._exact_source_extension_context(repo)
          extra = [] if context is None else list(getattr(context, 'generated_paths', ()))
          expected = ['research/RHRC/graph/compiler/registered_dependencies/'
              + 'REGISTERED_DECLARATION_DEPENDENCIES-' + key + '.jsonl'
              for key in '0123456789abcdef']
          if extra and (len(extra) != 16 or set(extra) != set(expected)):
              raise SystemExit('Authenticated generated freshness paths differ from exact16')
          allowed = list(original) + sorted(extra)
          if len(allowed) not in (62, 78) or len(set(allowed)) != len(allowed):
              raise SystemExit('Wrong authenticated generated freshness allowlist')
          result = subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--', *allowed])
          if result.returncode not in (0, 1):
              raise SystemExit('Generated freshness diff command failed')
          changed = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', 'HEAD', '--', *allowed])
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z', '--', *allowed])
          tracked_paths = sorted(p.decode('utf-8') for p in changed.split(b'\0') if p)
          untracked_paths = sorted(p.decode('utf-8') for p in untracked.split(b'\0') if p)
          print(json.dumps({'modified_generated_paths': tracked_paths, 'untracked_generated_paths': untracked_paths}))
          if result.returncode or untracked_paths:
              raise SystemExit('Canonical generated files differ from HEAD; review the captured artifact and commit the exact bytes.')
          print('All ' + str(len(allowed)) + ' authenticated canonical generated files match HEAD.')
          PY

      - name: Verify unchanged descendant source and exact baseline projection
        if: ${{ always() && steps.round2-ancestor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPICA_CURRENT_SOURCE_ROOT"
          python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$RUNNER_TEMP/opica2-baseline-scope/descendant-source-before.json"
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py verify --repo "$GITHUB_WORKSPACE" --destination "$OPICA_ANCESTOR_PROJECTION" > "$RUNNER_TEMP/opica2-baseline-scope/projection-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        with:
          name: opica-baseline-source-scope-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/opica2-baseline-scope
          if-no-files-found: error

  opica-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate current Round4 child before historical parent replay
        id: round4-parent-scope
        if: ${{ hashFiles('research/RHRC/integration/opica_round4/BUILD_MANIFEST.json') != '' }}
        shell: bash
        env:
          ROUND4_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # R4_PARENT_SCOPE_V1: inspect the actual child before unchanged historical guards.
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$ROUND4_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$evidence/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{commit}' || git fetch --no-tags origin fe16565b2a31fb8b68bef916ae8f04d535880e7a
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND4_PARENT_SCOPE_REPLAY=true' >> "$GITHUB_ENV"
      - name: Authenticate explicit Round2 ancestor projection (baseline scope only)
