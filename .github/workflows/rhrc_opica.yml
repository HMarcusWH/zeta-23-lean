          python -B research/RHRC/tools/run_suite.py --freeze-source "$evidence/descendant-source-before.json"
          git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$evidence/projection.json"
          python -B research/RHRC/integration/opica/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$evidence/dispatch.json"
          printf '%s\n' "OPICA_ANCESTOR_PROJECTION=$projection" "OPICA_CURRENT_SOURCE_ROOT=$GITHUB_WORKSPACE" "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          report={'schema':'OPICA2_BASELINE_WORKFLOW_SCOPE_V1','workflow_checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseline_commit':'416aec21d4d6634675639b5397cc300d1f826e34','baseline_tree':'0506bca8ffe613e9cd9ab844650a1141d4494f66',
              'scope':'FROZEN_ANCESTOR_BASELINE_ONLY','current_tree_compatibility_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
          Path(os.environ['RUNNER_TEMP'],'opica2-baseline-scope','scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Reproduce all 5112 exact finite controls in both Python modes
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python "$OPICA/check_exact.py" --output /tmp/opica-regression/exact.json
          python -O "$OPICA/check_exact.py" --output /tmp/opica-regression/exact-optimized.json
      - name: Exercise fail-closed evidence and authority mutations in both modes
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
