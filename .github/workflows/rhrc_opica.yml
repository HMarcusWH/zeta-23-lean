          python -m unittest discover -s "$OPICA/tests" -p 'test_*.py' -v
          python -O -m unittest discover -s "$OPICA/tests" -p 'test_*.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-regression
          path: /tmp/opica-regression
          if-no-files-found: error

      - name: Verify unchanged descendant source and exact baseline projection
        if: ${{ always() && steps.round2-ancestor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPICA_CURRENT_SOURCE_ROOT"
          python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$RUNNER_TEMP/opica2-baseline-scope/descendant-source-before.json"
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py verify --repo "$GITHUB_WORKSPACE" --destination "$OPICA_ANCESTOR_PROJECTION" > "$RUNNER_TEMP/opica2-baseline-scope/projection-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        with:
          name: opica-baseline-source-scope-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/opica2-baseline-scope
          if-no-files-found: error

