name: RHRC post269 theorem/control steady-state materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: post271-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'repair/post269-theorem-control-cofinal-arithmetic' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RHRC framework requirements
        run: python -m pip install -r research/RHRC/requirements.txt

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Compile post269/post271 theorem surfaces
        run: |
          lake build             Zeta23.CCM.CanonicalArithmeticLowerBound             Zeta23.CCM.CanonicalArithmeticCofinal             Zeta23.CCM.GlobalParityBottomGroundSpace             Zeta23.CCM.SourceWeightCounterexample             Zeta23.ExceptionalZero.CofinalLowerBoundConditionalRH             Zeta23.ExceptionalZero.CofinalArithmeticConditionalRH             Zeta23.RHRC.RegisteredClaimBindings             Zeta23.CCM

      - name: Validate registries and rendered living state
        run: |
          python research/RHRC/tools/claim_lint.py
          python research/RHRC/tools/registry_lint.py
          python research/RHRC/tools/registered_theorem_binding_lint.py
          python research/RHRC/control_v2/render_current_state.py --check
          python -m unittest research.RHRC.control_v2.tests.test_current_state_surfaces -v
          python -m unittest research.RHRC.integration.tests.test_integration_foundation -v

      - name: Remove one-shot materializer and stage exact final surface
        run: |
          rm -f .github/workflows/rhrc_post271_materializer.yml
          git add -A

      - name: Regenerate compiler, RHKG, FFBBP, and OoL products
        run: |
          python research/RHRC/tools/lean_dependency_extract.py --write
          python research/RHRC/graph/build.py --write
          python research/RHRC/integration/candidate_exactify.py --write
          python research/RHRC/ffbbp/rhkg_assurance.py --write
          python research/RHRC/integration/source_only_dependency_extract.py --write
          python research/RHRC/ool/rhkg_phase_atlas.py --write

      - name: Strict final-state validation
        run: |
          python research/RHRC/graph/build.py --check
          python research/RHRC/graph/validate.py
          python research/RHRC/control_v2/render_current_state.py --check
          python research/RHRC/tools/run_suite.py
          python research/RHRC/audits/post268/verify_frozen.py

      - name: Commit validated final state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: repair/post269-theorem-control-cofinal-arithmetic
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rhrc: regenerate post269 theorem/control cofinal arithmetic state'
          git push origin HEAD:refs/heads/$TARGET_BRANCH
