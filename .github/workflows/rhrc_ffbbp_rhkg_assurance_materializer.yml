name: RHRC FFBBP RHKG assurance materializer

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: rhrc-ffbbp-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'rhrc/ffbbp-rhkg-assurance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rhrc/ffbbp-rhkg-assurance
          fetch-depth: 0

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Run FFBBP and integration tests
        run: |
          python3 -m unittest discover -s research/RHRC/ffbbp/tests -p 'test_*.py' -v
          python3 -m unittest discover -s research/RHRC/integration/tests -p 'test_*.py' -v

      - name: Build RH formal-core source surface and candidate resolver
        run: lake build Zeta23.CCM Zeta23.ExceptionalZero Zeta23.RHRC.SourceCandidateResolution

      - name: Remove one-shot materializer before final graph generation
        run: git rm .github/workflows/rhrc_ffbbp_rhkg_assurance_materializer.yml

      - name: Materialize deterministic RHKG steady state
        run: python3 research/RHRC/graph/build.py --write

      - name: Rebind Lean-exact candidate receipts to current RHKG state
        run: python3 research/RHRC/integration/candidate_exactify.py --write

      - name: Check Lean-exact candidate receipts
        run: python3 research/RHRC/integration/candidate_exactify.py --check

      - name: Materialize FFBBP v1.6 RHKG assurance
        run: python3 research/RHRC/ffbbp/rhkg_assurance.py --write

      - name: Check FFBBP v1.6 RHKG assurance
        run: python3 research/RHRC/ffbbp/rhkg_assurance.py --check

      - name: Validate integration and graph firewalls
        run: |
          python3 research/RHRC/integration/integration_lint.py
          python3 research/RHRC/graph/build.py --check
          python3 research/RHRC/graph/validate.py

      - name: Commit materialized steady state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "RHRC FFBBP: materialize RHKG assurance steady state"
          git push origin HEAD:rhrc/ffbbp-rhkg-assurance
