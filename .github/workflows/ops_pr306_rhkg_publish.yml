name: PR306 guarded RHKG derived-state publisher

# One-shot deployment of the artifact from the already-running documentation
# canonical producer. Lives on an isolated operations branch so it never
# changes the source tree used to compute PR306's deterministic RHKG artifacts.
# Refuses to push if that producer fails or the target branch has advanced.
on:
  push:
    branches: [ops/docs306-rhkg-deploy-20261121]
    paths: [.github/workflows/ops_pr306_rhkg_publish.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: pr306-guarded-rhkg-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'HMarcusWH/zeta-23-lean' &&
      github.ref == 'refs/heads/ops/docs306-rhkg-deploy-20261121' &&
      startsWith(github.event.head_commit.message, 'ci(PR306): stage guarded RHKG deployment')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET_BRANCH: docs/repository-guide-and-reuse-2026-11-21
      SOURCE_SHA: 96602220053de3e7bff14baee0ffe2f7cf4653de
      SOURCE_TREE: 5fb4f705c884346515e72fe856ad26336e285341
      PRODUCER_RUN: '44906301872'
      PRODUCER_ARTIFACT: documentation-canonical-44906301872-1
    steps:
      - name: Checkout exact original PR306 source, not operations-branch additions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm immutable input and source-policy contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          python3 -B -m research.RHRC.integration.documentation_2026_11_21.source_scope --check > "$RUNNER_TEMP/pre-source-scope.json"
      - name: Accept only successful exact-head canonical producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No alternate producer or guessed artifacts. The original PR-head
          # canonical build is already running and uses --write then --check.
          for attempt in $(seq 1 300); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN" --jq '.status + ":" + (.conclusion // "pending")')"
            echo "Canonical producer status: $state (check $attempt/300)"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "Canonical producer did not pass; refusing deployment" >&2; exit 1 ;;
            esac
            sleep 60
          done
          echo "Canonical producer has not passed within the bounded poll window" >&2
          exit 1
      - name: Download and authenticate the exact canonical patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rhrc-candidate"
          gh run download "$PRODUCER_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$PRODUCER_ARTIFACT" --dir "$RUNNER_TEMP/rhrc-candidate"
          cd "$RUNNER_TEMP/rhrc-candidate"
          test -s generated-state.patch
          test -s generated-state.patch.sha256
          sha256sum -c generated-state.patch.sha256
          test "$(sed -n '1p' input-head-tree.txt)" = "$SOURCE_SHA"
          test "$(sed -n '2p' input-head-tree.txt)" = "$SOURCE_TREE"
          test -s canonical-check.log
          grep -q 'RHRC DERIVED STATE: PASS' canonical-check.log
      - name: Apply only governed generated artifacts to the original PR-head checkout
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/rhrc-candidate/generated-state.patch"
          git apply --check --index "$patch"
          git apply --index "$patch"
          python3 -B - <<'PY'
          import json, subprocess
          from pathlib import Path
          scope = json.loads(Path('research/RHRC/integration/documentation_2026_11_21/SOURCE_SCOPE.json').read_text())
          allowed = set(scope['generated'])
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not paths or not paths <= allowed:
              raise SystemExit('Invalid generated patch file set: ' + repr(sorted(paths - allowed)))
          if subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']).strip():
              raise SystemExit('Unexpected untracked product')
          print('Exactly governed generated files in patch:', len(paths))
          for path in sorted(paths):
              print(path)
          PY
          git diff --cached --check
          python3 -B -m research.RHRC.integration.documentation_2026_11_21.source_scope --check > "$RUNNER_TEMP/post-source-scope.json"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ env.SOURCE_SHA }}
          restore-keys: post290-components-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Independently validate applied generated state without writing
        shell: bash
        run: |
          set -euo pipefail
          lake build Zeta23.RHRC.DeclarationDependencyExport Zeta23.RHRC.SourceCandidateResolution
          python3 -B research/RHRC/tools/materialize_derived_state.py --check > "$RUNNER_TEMP/publisher-check.log" 2>&1 || { tail -100 "$RUNNER_TEMP/publisher-check.log"; exit 1; }
          grep -q 'RHRC DERIVED STATE: PASS' "$RUNNER_TEMP/publisher-check.log"
          git diff --cached --check
          test -z "$(git diff --name-only)"
      - name: Commit only verified generated products and fast-forward target branch
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(PR306): materialize exact-head RHKG graph outputs"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import base64, os, subprocess
          target=os.environ['TARGET_BRANCH']
          token=os.environ.get('GH_PUSH_TOKEN')
          if not token or target != 'docs/repository-guide-and-reuse-2026-11-21':
              raise SystemExit('Push credential or target mismatch')
          env=os.environ.copy()
          env.pop('GH_PUSH_TOKEN', None)
          env.update(
              GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1',
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
          subprocess.run(['git', 'push', 'https://github.com/HMarcusWH/zeta-23-lean.git',
                          'HEAD:refs/heads/'+target], check=True, env=env)
          PY
          echo "DEPLOYED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/deployed-sha.txt"
      - name: Dispatch fresh documentation and RHRC validation against deployed branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run documentation.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          gh workflow run rhrc.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          echo "Fresh validation dispatched at $DEPLOYED_SHA"
      - name: Save reproducibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr306-guarded-deploy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pre-source-scope.json
            ${{ runner.temp }}/post-source-scope.json
            ${{ runner.temp }}/publisher-check.log
            ${{ runner.temp }}/deployed-sha.txt
          if-no-files-found: ignore
