name: RHRC closure offline workspace chunks
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/rhrc_closure_workspace_split.yml']
permissions:
  contents: read
  actions: read
jobs:
  chunks:
    if: github.head_ref == 'research/rh-closure-parallel-campaign'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36280961006
          pattern: closure-pinned-*
          merge-multiple: true
          path: portable
      - name: Verify and split exact archives
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('portable')
          m=json.loads((root/'MANIFEST.json').read_text())
          for name, spec in m['files'].items():
              p=root/name
              assert p.stat().st_size==spec['size']
              h=hashlib.sha256()
              with p.open('rb') as f:
                  while b:=f.read(8*1024*1024): h.update(b)
              assert h.hexdigest()==spec['sha256']
          PY
          split -b 400M -d portable/toolchain.tar.gz portable/toolchain.part
          split -b 400M -d portable/proofbase.tar.gz portable/proofbase.part
          sha256sum portable/*.part* > portable/CHUNKS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-00
          path: portable/toolchain.part00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-01
          path: portable/toolchain.part01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: proofbase-00
          path: portable/proofbase.part00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: proofbase-01
          path: portable/proofbase.part01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: proofbase-02
          path: portable/proofbase.part02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: proofbase-03
          path: portable/proofbase.part03
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: proofbase-04
          path: portable/proofbase.part04
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-manifest
          path: |
            portable/CHUNKS.sha256
            portable/MANIFEST.json
          retention-days: 3
