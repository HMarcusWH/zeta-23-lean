    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-r2-historical-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-r2-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native
      - name: Compare exact public declaration type expressions
        shell: bash
        run: |
          set -euo pipefail
          python verification/opica-native-terminal/compare_type_surfaces.py "$RUNNER_TEMP/historical/public-types.json" "$RUNNER_TEMP/native/public-types.json" "$RUNNER_TEMP/result/type-comparison.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
