          for rev in b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736 c109fb02385bd4f7a00890594478e3bf664cbd14 2fe4a756e8576203cfb009314861616accdb6dde; do
            git cat-file -e "$rev^{commit}" || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git "$rev"
          done
          python verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/native_epoch" --receipt "$RUNNER_TEMP/result/source.json" --head "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-r2-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-lock
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: native_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compile and qualify native
        shell: bash
        run: |
          export OPICA_R2_LOCKED_SOURCE_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
          bash verification/opica-native-terminal/run.sh "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result" "native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-r2-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
  arithmetic-frontier:
    needs: [source-lock, audit-smoke]
    runs-on: ubuntu-24.04
