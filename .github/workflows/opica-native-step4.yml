name: Native Step 4 repair qualification (committed source only; NO automatic promotion)
on:
  push:
    branches: [opica/native-step4-compact-source-20261125]
    paths:
      - 'Zeta23/**'
      - 'Zeta23Arithmetic/**'
      - 'verification/opica-native-terminal/**'
      - '.github/workflows/opica-native-step4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opica-native-repair-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Reconstruct committed repair epoch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          git cat-file -e b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736^{commit} || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736
          git cat-file -e 2fe4a756e8576203cfb009314861616accdb6dde^{commit} || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git 2fe4a756e8576203cfb009314861616accdb6dde
          python verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/native_epoch" --receipt "$RUNNER_TEMP/result/source.json" --head "$GITHUB_SHA"
      - name: Verify source lock and negative controls in normal and optimized modes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile verification/opica-native-terminal/epoch.py verification/opica-native-terminal/port.py verification/opica-native-terminal/compare.py
          python verification/opica-native-terminal/extract_all.py --test
          python verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --head "$GITHUB_SHA" --self-test
          python -O verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --head "$GITHUB_SHA" --self-test
          python -O verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/optimized-epoch" --receipt "$RUNNER_TEMP/optimized-source.json" --head "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/result/source.json" "$RUNNER_TEMP/optimized-source.json"
          printf 'NATIVE_REPAIR_SOURCE_LOCK_PASS\n' | tee "$RUNNER_TEMP/result/source-lock-pass.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-repair-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
  audit-smoke:
    needs: source-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Reconstruct committed repair epoch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          git cat-file -e b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736^{commit} || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736
          git cat-file -e 2fe4a756e8576203cfb009314861616accdb6dde^{commit} || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git 2fe4a756e8576203cfb009314861616accdb6dde
          python verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/native_epoch" --receipt "$RUNNER_TEMP/result/source.json" --head "$GITHUB_SHA"
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: native_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: audit-smoke exact source compilation and audit
        run: bash verification/opica-native-terminal/run.sh "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result" smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-repair-audit-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
