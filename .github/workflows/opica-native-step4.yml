          bash verification/opica-native-terminal/run.sh "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result" "independent"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
