          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Install real bubblewrap sandbox
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/bin/bwrap; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          /usr/bin/bwrap --version
      - name: Compile and qualify comparator
        shell: bash
        run: |
          export OPICA_R2_LOCKED_SOURCE_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
