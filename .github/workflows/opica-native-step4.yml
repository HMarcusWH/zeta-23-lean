name: Native Step 4 R2 qualification (separate compiler epochs; RH_OPEN)
on:
  push:
    branches: [opica/native-step4-compact-source-20261125]
    paths:
      - 'Zeta23/**'
      - 'Zeta23Arithmetic/**'
      - 'verification/opica-native-terminal/**'
      - '.github/workflows/opica-native-step4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opica-native-r2-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Reconstruct exact committed R2 epoch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          for rev in b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736 c109fb02385bd4f7a00890594478e3bf664cbd14 2fe4a756e8576203cfb009314861616accdb6dde; do
            git cat-file -e "$rev^{commit}" || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git "$rev"
          done
          python verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/native_epoch" --receipt "$RUNNER_TEMP/result/source.json" --head "$GITHUB_SHA"
      - name: Verify exact source and adversarial controls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile verification/opica-native-terminal/*.py
          bash -n verification/opica-native-terminal/run.sh
          bash -n verification/opica-native-terminal/historical.sh
          python verification/opica-native-terminal/extract_all.py --test
          for opt in "" "-O"; do
            python $opt verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --head "$GITHUB_SHA" --self-test
            python $opt verification/opica-native-terminal/compare.py --self-test
            python $opt verification/opica-native-terminal/stage_controls.py "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result/source.json"
          done
          python -O verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/optimized-epoch" --receipt "$RUNNER_TEMP/optimized-source.json" --head "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/result/source.json" "$RUNNER_TEMP/optimized-source.json"
          printf 'NATIVE_R2_SOURCE_LOCK_PASS\n' | tee "$RUNNER_TEMP/result/source-lock-pass.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-r2-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
  audit-smoke:
    needs: [source-lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Reconstruct exact committed R2 epoch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          for rev in b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736 c109fb02385bd4f7a00890594478e3bf664cbd14 2fe4a756e8576203cfb009314861616accdb6dde; do
            git cat-file -e "$rev^{commit}" || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git "$rev"
          done
          python verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/native_epoch" --receipt "$RUNNER_TEMP/result/source.json" --head "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-r2-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-lock
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: native_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compile and qualify smoke
        shell: bash
        run: |
          export OPICA_R2_LOCKED_SOURCE_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
          bash verification/opica-native-terminal/run.sh "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result" "smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-r2-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
  native-leaves:
    needs: [source-lock, audit-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: [pnt, gamma, operator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Reconstruct exact committed R2 epoch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          for rev in b1e3e3e99fd913ba2b3560ceb3b5436cdb71f736 c109fb02385bd4f7a00890594478e3bf664cbd14 2fe4a756e8576203cfb009314861616accdb6dde; do
            git cat-file -e "$rev^{commit}" || git fetch --depth 1 https://github.com/HMarcusWH/zeta-23-lean.git "$rev"
          done
          python verification/opica-native-terminal/epoch.py --repo "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/native_epoch" --receipt "$RUNNER_TEMP/result/source.json" --head "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-r2-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-lock
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: native_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compile and qualify leaf-${{ matrix.group }}
        shell: bash
        run: |
          export OPICA_R2_LOCKED_SOURCE_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
          bash verification/opica-native-terminal/run.sh "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result" "leaf-${{ matrix.group }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-r2-leaf-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
  native-frontier:
    needs: [source-lock, audit-smoke, native-leaves]
    runs-on: ubuntu-24.04
