          bash verification/opica-native-terminal/run.sh "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result" "terminal"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
