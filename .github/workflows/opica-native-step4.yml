          bash verification/opica-native-terminal/run.sh "$GITHUB_WORKSPACE/native_epoch" "$RUNNER_TEMP/result" "arithmetic"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
