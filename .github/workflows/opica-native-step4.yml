          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compile restored historical source and native consumers
        shell: bash
        run: bash verification/opica-native-terminal/historical.sh "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-r2-historical-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
