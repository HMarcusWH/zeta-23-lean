  common-terminal:
    needs: [source-lock, audit-smoke, native-frontier, arithmetic-frontier]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
