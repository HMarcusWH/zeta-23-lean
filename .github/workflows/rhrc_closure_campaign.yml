name: RHRC parallel closure campaign

on:
  pull_request:
    branches: [main]
    paths:
      - 'Zeta23/CCM/SourceContraction.lean'
      - 'Zeta23/CCM/SourceContractionLocalized.lean'
      - 'Zeta23/CCM/CanonicalArchUpperBound.lean'
      - 'Zeta23/CCM/CanonicalPoleUniformBound.lean'
      - 'Zeta23/CCM/CanonicalSmallApertureCoercivity.lean'
      - 'Zeta23/CCM/CanonicalPrimeSeamTaylor.lean'
      - 'Zeta23/CCM/ParityGroundPerturbation.lean'
      - 'Zeta23/CCM/ParityRayleighPerturbation.lean'
      - 'Zeta23/CCM/CanonicalSeamGroundTransfer.lean'
      - 'Zeta23/CCM/GroundComparisonPrinciple.lean'
      - 'Zeta23/CCM/CanonicalGroundPropagation.lean'
      - 'Zeta23/CCM/CanonicalAllAperturePositivity.lean'
      - 'Zeta23/CCM/CanonicalSchurCertificate.lean'
      - 'Zeta23/CCM/CanonicalModeTailBound.lean'
      - 'Zeta23/CCM/CanonicalUniformDomination.lean'
      - 'Zeta23/CCM/CanonicalFullSpaceSourceBridge.lean'
      - 'Zeta23/Spectral/**'
      - 'Zeta23/ExceptionalZero/Quantitative*.lean'
      - 'Zeta23/RHRC/ClosureObligationBindings.lean'
      - 'research/RHRC/closure_batch/**'
      - '.github/workflows/rhrc_closure_campaign.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhrc-closure-campaign-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical research dependencies
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Syntax, adversarial evidence tests, and four-track research harvest
        run: |
          python -m compileall -q research/RHRC/closure_batch
          python -m unittest discover -s research/RHRC/closure_batch -p 'test_*.py' -v
          python research/RHRC/closure_batch/run_campaign.py --repo . --output-dir /tmp/closure-results
      - uses: actions/upload-artifact@v4
        with:
          name: closure-fast-results
          path: /tmp/closure-results
          retention-days: 30

  lean-a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build Track A
        run: |
          lake build Zeta23.CCM.SourceContraction
          lake build Zeta23.CCM.SourceContractionLocalized
          lake build Zeta23.CCM.CanonicalArchUpperBound
          lake build Zeta23.CCM.CanonicalPoleUniformBound
          lake build Zeta23.CCM.CanonicalSmallApertureCoercivity
          lake build Zeta23.CCM.CanonicalPrimeSeamTaylor
          lake build Zeta23.CCM.ParityGroundPerturbation
          lake build Zeta23.CCM.ParityRayleighPerturbation
          lake build Zeta23.CCM.CanonicalSeamGroundTransfer
          lake build Zeta23.CCM.GroundComparisonPrinciple
          lake build Zeta23.CCM.CanonicalGroundPropagation
          lake build Zeta23.CCM.CanonicalAllAperturePositivity

  lean-b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build Track B
        run: |
          lake build Zeta23.CCM.CanonicalSchurCertificate
          lake build Zeta23.CCM.CanonicalModeTailBound
          lake build Zeta23.CCM.CanonicalUniformDomination

  lean-c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build Track C
        run: |
          lake build Zeta23.CCM.CanonicalFullSpaceSourceBridge
          lake build Zeta23.Spectral

  lean-d-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build Track D and exact obligation bindings
        run: |
          lake build Zeta23.ExceptionalZero.QuantitativeDetectorFamily
          lake build Zeta23.ExceptionalZero.QuantitativeCanonicalWitness
          lake build Zeta23.RHRC.ClosureObligationBindings
      - name: Reject proof escapes in closure-campaign modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          sys.path.insert(0, "research/RHRC/tools")
          from lean_imports import strip_lean_comments

          roots = [
              Path("Zeta23/CCM/SourceContraction.lean"),
              Path("Zeta23/CCM/SourceContractionLocalized.lean"),
              Path("Zeta23/CCM/CanonicalArchUpperBound.lean"),
              Path("Zeta23/CCM/CanonicalPoleUniformBound.lean"),
              Path("Zeta23/CCM/CanonicalSmallApertureCoercivity.lean"),
              Path("Zeta23/CCM/CanonicalPrimeSeamTaylor.lean"),
              Path("Zeta23/CCM/ParityGroundPerturbation.lean"),
              Path("Zeta23/CCM/ParityRayleighPerturbation.lean"),
              Path("Zeta23/CCM/CanonicalSeamGroundTransfer.lean"),
              Path("Zeta23/CCM/GroundComparisonPrinciple.lean"),
              Path("Zeta23/CCM/CanonicalGroundPropagation.lean"),
              Path("Zeta23/CCM/CanonicalAllAperturePositivity.lean"),
              Path("Zeta23/CCM/CanonicalSchurCertificate.lean"),
              Path("Zeta23/CCM/CanonicalModeTailBound.lean"),
              Path("Zeta23/CCM/CanonicalUniformDomination.lean"),
              Path("Zeta23/CCM/CanonicalFullSpaceSourceBridge.lean"),
              Path("Zeta23/ExceptionalZero/QuantitativeDetectorFamily.lean"),
              Path("Zeta23/ExceptionalZero/QuantitativeCanonicalWitness.lean"),
              Path("Zeta23/RHRC/ClosureObligationBindings.lean"),
          ]
          roots.extend(sorted(Path("Zeta23/Spectral").rglob("*.lean")))
          pattern = re.compile(r"(?m)(^|\\W)(axiom|sorry|admit)(?=\\W|$)")
          bad = []
          for path in roots:
              text = strip_lean_comments(path.read_text(encoding="utf-8"))
              match = pattern.search(text)
              if match:
                  bad.append(f"{path}: {match.group(2)}")
          if bad:
              raise SystemExit("Forbidden proof escape found:\n" + "\n".join(bad))
          print(f"CLOSURE PROOF-ESCAPE CHECK: PASS ({len(roots)} files)")
          PY

  campaign-complete:
    needs: [fast-integrity, lean-a, lean-b, lean-c, lean-d-bindings]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Parallel closure campaign completed; theorem and research dispositions remain separately classified.'
