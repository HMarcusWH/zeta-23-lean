name: OPICA Round2 exact-source core and research controls
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - research/opica-round2
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: opica-round2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  OPICA2: research/RHRC/integration/opica_round2
  OPICA2_OUTPUT_DIR: /tmp/opica2-evidence
  REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  LEAN_NUM_THREADS: '2'
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - name: Select explicit historical Round2 scope for a reviewed Round3 extension
      id: scope-selection
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p "$OPICA2_OUTPUT_DIR"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        test -z "$(git status --porcelain --untracked-files=all)"
        if [ -f research/RHRC/integration/opica_round3/DESCENDANT_EXTENSION.json ]; then
          python -B research/RHRC/integration/opica_round3/validate_contract.py --output "$OPICA2_OUTPUT_DIR/current-round3-source-scope.json"
          child_head=$(git rev-parse HEAD)
          child_tree=$(git rev-parse 'HEAD^{tree}')
          test "$(git rev-parse '775692f2e72d76b6a97cf66926a86cc96342c109^{tree}')" = acd548eb97ddaee68eb6c9df73f82756ee10d13f
          git checkout --detach 775692f2e72d76b6a97cf66926a86cc96342c109
          printf '%s\n' 'REQUESTED_HEAD=775692f2e72d76b6a97cf66926a86cc96342c109' "REQUESTED_CHILD_HEAD=$child_head" "REQUESTED_CHILD_TREE=$child_tree" 'ROUND2_BASELINE_REPLAY=true' >> "$GITHUB_ENV"
          printf '%s\n' 'round3=true' >> "$GITHUB_OUTPUT"
          CHILD_HEAD="$child_head" CHILD_TREE="$child_tree" python - <<'PY'
        import json,os
        from pathlib import Path
        report={'schema':'OPICA3_EXPLICIT_ROUND2_BASELINE_SCOPE_V1','requested_child_commit':os.environ['CHILD_HEAD'],
          'requested_child_tree':os.environ['CHILD_TREE'],'checked_baseline':'775692f2e72d76b6a97cf66926a86cc96342c109',
          'checked_baseline_tree':'acd548eb97ddaee68eb6c9df73f82756ee10d13f',
          'scope':'EXACT775_HISTORICAL_ROUND2_REPLAY_NOT_CURRENT_ROUND3_COMPILER_ACCEPTANCE',
          'current_tree_compiler_accepted':False,'full_core_accepted':False,'full_release_accepted':False,
          'human_review':'NOT_ESTABLISHED','RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA2_OUTPUT_DIR'],'scope-selection.json').write_text(json.dumps(report,indent=2)+'\n')
        PY
        else
          printf '%s\n' 'ROUND2_BASELINE_REPLAY=false' >> "$GITHUB_ENV"
          printf '%s\n' 'round3=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Capture immutable requested source before all checks
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p "$OPICA2_OUTPUT_DIR/source"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA2_OUTPUT_DIR/source/before.json"
        git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
    - name: Validate frozen specification and full source contract
      shell: bash
      run: |-
        set -euo pipefail
        python -B "$OPICA2/run_checks.py" contract --scope full-core
    - name: Verify exact source unchanged after all commands
      shell: bash
      run: |-
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA2_OUTPUT_DIR/source/before.json"
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica2-contract
        path: ${{ env.OPICA2_OUTPUT_DIR }}
        if-no-files-found: error
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - name: Select explicit historical Round2 scope for a reviewed Round3 extension
      id: scope-selection
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p "$OPICA2_OUTPUT_DIR"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        test -z "$(git status --porcelain --untracked-files=all)"
        if [ -f research/RHRC/integration/opica_round3/DESCENDANT_EXTENSION.json ]; then
          python -B research/RHRC/integration/opica_round3/validate_contract.py --output "$OPICA2_OUTPUT_DIR/current-round3-source-scope.json"
          child_head=$(git rev-parse HEAD)
          child_tree=$(git rev-parse 'HEAD^{tree}')
          test "$(git rev-parse '775692f2e72d76b6a97cf66926a86cc96342c109^{tree}')" = acd548eb97ddaee68eb6c9df73f82756ee10d13f
          git checkout --detach 775692f2e72d76b6a97cf66926a86cc96342c109
          printf '%s\n' 'REQUESTED_HEAD=775692f2e72d76b6a97cf66926a86cc96342c109' "REQUESTED_CHILD_HEAD=$child_head" "REQUESTED_CHILD_TREE=$child_tree" 'ROUND2_BASELINE_REPLAY=true' >> "$GITHUB_ENV"
          printf '%s\n' 'round3=true' >> "$GITHUB_OUTPUT"
          CHILD_HEAD="$child_head" CHILD_TREE="$child_tree" python - <<'PY'
        import json,os
        from pathlib import Path
        report={'schema':'OPICA3_EXPLICIT_ROUND2_BASELINE_SCOPE_V1','requested_child_commit':os.environ['CHILD_HEAD'],
          'requested_child_tree':os.environ['CHILD_TREE'],'checked_baseline':'775692f2e72d76b6a97cf66926a86cc96342c109',
          'checked_baseline_tree':'acd548eb97ddaee68eb6c9df73f82756ee10d13f',
          'scope':'EXACT775_HISTORICAL_ROUND2_REPLAY_NOT_CURRENT_ROUND3_COMPILER_ACCEPTANCE',
          'current_tree_compiler_accepted':False,'full_core_accepted':False,'full_release_accepted':False,
          'human_review':'NOT_ESTABLISHED','RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA2_OUTPUT_DIR'],'scope-selection.json').write_text(json.dumps(report,indent=2)+'\n')
        PY
        else
          printf '%s\n' 'ROUND2_BASELINE_REPLAY=false' >> "$GITHUB_ENV"
          printf '%s\n' 'round3=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Capture immutable requested source before all checks
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p "$OPICA2_OUTPUT_DIR/source"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA2_OUTPUT_DIR/source/before.json"
        git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
      with:
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false
        use-mathlib-cache: true
    - name: Compile actual frozen lane targets and independent consumers
      shell: bash
      run: |-
        set -euo pipefail
        python -B "$OPICA2/run_checks.py" formal --lane "${{ matrix.lane }}" --timeout 20000
    - name: Verify exact source unchanged after all commands
      shell: bash
      run: |-
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA2_OUTPUT_DIR/source/before.json"
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica2-formal-${{ matrix.lane }}
        path: ${{ env.OPICA2_OUTPUT_DIR }}
        if-no-files-found: error
    name: formal(${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane:
        - causal
        - filtered
        - gram
        - structural
    needs: contract
    if: ${{ always() && !cancelled() }}
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.13.5
    - name: Select explicit historical Round2 scope for a reviewed Round3 extension
      id: scope-selection
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p "$OPICA2_OUTPUT_DIR"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        test -z "$(git status --porcelain --untracked-files=all)"
