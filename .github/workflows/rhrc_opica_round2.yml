        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA2_OUTPUT_DIR/source/before.json"
        git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
      with:
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false
        use-mathlib-cache: true
    - name: Install declared hash-locked audit and framework dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python -m pip install --require-hashes --only-binary=:all: -r "$OPICA2/python-checks.lock"
        python -m pip install --require-hashes --only-binary=:all: -r research/RHRC/integration/opica_followup/python-checks.lock
        python -m pip install -r research/RHRC/requirements.txt
    - name: Build exact native prerequisites for every paired typed control
      shell: bash
      run: |-
        set -euo pipefail
        python - <<'PY'
        import hashlib,json,os,re,subprocess
        from pathlib import Path
        registry=json.loads(Path(os.environ['OPICA2'],'CONTROL_REGISTRY.json').read_bytes())
        fixtures=registry['runtime_typed_negative_fixtures']
        required={'R2M03','R2M05','R2M07','R2M08','R2M09','R2M13','R2M14'}
        expected={'Zeta23.OPICARound2.Validation.CausalProbe','Zeta23.OPICARound2.Validation.CertifiedEvaluation',
            'Zeta23.OPICARound2.Validation.DualCertificates','Zeta23.OPICARound2.Validation.ProbeGram',
            'Zeta23.OPICARound2.Validation.TruncationControls'}
        if len(fixtures)!=7 or {r.get('id') for r in fixtures}!=required:
            raise SystemExit('Exact seven typed native control pairs required')
        observed=set()
        for fixture in fixtures:
            pair=[]
            for mode in ('positive','negative'):
                imports=[]
                for line in fixture[mode+'_source'].splitlines():
                    if line.startswith('import '):
                        match=re.fullmatch(r'import (Zeta23\.OPICARound2\.Validation\.[A-Za-z_][A-Za-z0-9_]*)',line)
                        if match is None:raise SystemExit('Unreviewed typed control import')
                        imports.append(match.group(1))
                pair.append(imports)
            if not pair[0] or pair[0]!=pair[1]:raise SystemExit('Typed control pair imports differ')
            observed.update(pair[0])
        if observed!=expected:raise SystemExit('Typed control Validation prerequisites changed')
        command=['lake','build',*sorted(expected)]
        log=Path(os.environ['OPICA2_OUTPUT_DIR'],'typed-control-prerequisite-build.log')
        with log.open('wb') as stream:
            code=subprocess.run(command,stdout=stream,stderr=subprocess.STDOUT).returncode
        report={'schema':'OPICA2_TYPED_CONTROL_PREREQUISITE_BUILD_V1','argv':command,'exit_code':code,
            'checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'checked_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'log_sha256':hashlib.sha256(log.read_bytes()).hexdigest(),
            'scope':'NATIVE_PREREQUISITES_WARM_PROJECT_OBJECTS_ALLOWED_NO_COLD_CLAIM',
            'full_core_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA2_OUTPUT_DIR'],'typed-control-prerequisite-build.json').write_text(json.dumps(report,indent=2)+'\n')
        raise SystemExit(code)
        PY
    - name: Run all core adversarial runtime checks in both Python modes
      shell: bash
      run: |-
        set -euo pipefail
        python -m unittest discover -s "$OPICA2/tests" -p 'test_*.py' -v > "$OPICA2_OUTPUT_DIR/runtime-normal.log" 2>&1
        python -O -m unittest discover -s "$OPICA2/tests" -p 'test_*.py' -v > "$OPICA2_OUTPUT_DIR/runtime-optimized.log" 2>&1
        for legacy in opica opica_followup; do
          python -B -m unittest discover -s "research/RHRC/integration/$legacy/tests" -p test_contract.py -k Round2DescendantDispatchTests -v
          python -O -B -m unittest discover -s "research/RHRC/integration/$legacy/tests" -p test_contract.py -k Round2DescendantDispatchTests -v
        done
        python -B "$OPICA2/run_checks.py" controls --evidence-dir "$OPICA2_OUTPUT_DIR/normal"
        python -O -B "$OPICA2/run_checks.py" controls --evidence-dir "$OPICA2_OUTPUT_DIR/optimized"
    - name: Verify exact source unchanged after all commands
      shell: bash
      run: |-
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA2_OUTPUT_DIR/source/before.json"
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica2-controls
        path: ${{ env.OPICA2_OUTPUT_DIR }}
        if-no-files-found: error
    env:
      OPICA2_TYPED_CONTROL_OUTPUT: /tmp/opica2-evidence/typed-native-pairs
    needs: contract
    if: ${{ always() && !cancelled() }}
