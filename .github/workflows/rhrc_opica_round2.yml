        from pathlib import Path
        report={'schema':'OPICA3_EXPLICIT_ROUND2_BASELINE_SCOPE_V1','requested_child_commit':os.environ['CHILD_HEAD'],
          'requested_child_tree':os.environ['CHILD_TREE'],'checked_baseline':'775692f2e72d76b6a97cf66926a86cc96342c109',
          'checked_baseline_tree':'acd548eb97ddaee68eb6c9df73f82756ee10d13f',
          'scope':'EXACT775_HISTORICAL_ROUND2_REPLAY_NOT_CURRENT_ROUND3_COMPILER_ACCEPTANCE',
          'current_tree_compiler_accepted':False,'full_core_accepted':False,'full_release_accepted':False,
          'human_review':'NOT_ESTABLISHED','RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA2_OUTPUT_DIR'],'scope-selection.json').write_text(json.dumps(report,indent=2)+'\n')
        PY
        else
          printf '%s\n' 'ROUND2_BASELINE_REPLAY=false' >> "$GITHUB_ENV"
          printf '%s\n' 'round3=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Capture immutable requested source before all checks
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p "$OPICA2_OUTPUT_DIR/source"
        test "$(git rev-parse HEAD)" = "$REQUESTED_HEAD"
        python -B research/RHRC/tools/run_suite.py --freeze-source "$OPICA2_OUTPUT_DIR/source/before.json"
        git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
    - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
      with:
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false
        use-mathlib-cache: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: opica2-aggregate
        path: ${{ runner.temp }}/opica2-aggregate-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: opica2-controls
        path: ${{ runner.temp }}/opica2-controls-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: opica2-ancestry
        path: ${{ runner.temp }}/opica2-ancestry-input
    - name: Reject every missing or unsuccessful required current workflow lane
      shell: bash
      run: |-
        set -euo pipefail
        python - <<'PY'
        import json,os
        needs=json.loads(os.environ['REQUIRED_NEEDS'])
        expected={'contract','formal','controls','ancestry','aggregate','generated','harvest'}
        if set(needs)!=expected or any(row.get('result')!='success' for row in needs.values()):
            raise SystemExit('Required gate missing or incomplete: '+json.dumps(needs,sort_keys=True))
        PY
      env:
        REQUIRED_NEEDS: ${{ toJSON(needs) }}
    - name: Independently recompose exact compiler, clause, control and ancestry evidence
      shell: bash
      run: |-
        set -euo pipefail
        python - <<'PY'
        import json,os
        from pathlib import Path
        source=Path(os.environ['RUNNER_TEMP'],'opica2-aggregate-input','aggregate','compiler-receipt.json')
        receipt=json.loads(source.read_bytes())
        composed=json.loads(source.with_name('composed-receipt.json').read_bytes())
        report={'schema':'OPICA2_COMPOSITION_STATUS_OBSERVATION_V1',
            'observed_raw_implementation_state':receipt['implementation_state'],
            'observed_composed_implementation_state':composed['implementation_state'],
            'scope':'STATUS_OBSERVATION_ONLY_ACCEPTANCE_STILL_REQUIRES_INDEPENDENT_REVALIDATION',
            'full_core_accepted':False,'full_release_accepted':False,'human_review':'NOT_ESTABLISHED','RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA2_OUTPUT_DIR'],'composition-observation.json').write_text(json.dumps(report,indent=2)+'\n')
        PY
        python -B "$OPICA2/run_checks.py" acceptance \
          --query-plan "$RUNNER_TEMP/opica2-aggregate-input/reviewed-query-plan.json" \
          --formal-receipt "$RUNNER_TEMP/opica2-aggregate-input/aggregate/compiler-receipt.json" \
          --formal-artifacts "$RUNNER_TEMP/opica2-aggregate-input/aggregate" \
          --clause-evidence "$OPICA2/PAPER_CROSSWALK.json" \
          --control-evidence "$RUNNER_TEMP/opica2-controls-input/normal/controls/result.json" \
          --optimized-control-evidence "$RUNNER_TEMP/opica2-controls-input/optimized/controls/result.json" \
          --ancestry-evidence "$RUNNER_TEMP/opica2-ancestry-input/ancestry/result.json"
        printf '%s\n' 'Compiler evidence only. A separate post-run all-job harvest and independent human review remain required; full release, RH and Step4 are not inferred.' > "$OPICA2_OUTPUT_DIR/acceptance-boundary.txt"
    - name: Bind the checked historical acceptance to its explicit source scope
      if: ${{ env.ROUND2_BASELINE_REPLAY == 'true' }}
      shell: bash
      run: |-
        set -euo pipefail
        python - <<'PY'
        import json,os
        from pathlib import Path
        accepted=json.loads(Path(os.environ['OPICA2_OUTPUT_DIR'],'acceptance','result.json').read_bytes())
        if (accepted.get('status')!='PASS_COMPILER_EVIDENCE_ONLY'
            or accepted.get('checked_commit')!='775692f2e72d76b6a97cf66926a86cc96342c109'
            or accepted.get('checked_tree')!='acd548eb97ddaee68eb6c9df73f82756ee10d13f'
            or accepted.get('full_core_compiler_verified') is not True
            or accepted.get('full_release_accepted') is not False):
            raise SystemExit('Historical Round2 acceptance did not independently complete')
        report={'schema':'OPICA3_CHECKED_BASELINE_ACCEPTANCE_SCOPE_V1',
          'disposition':'HISTORICAL_BASELINE_CORE_ACCEPTANCE_EXECUTED_AND_REPARSED',
          'requested_child_commit':os.environ['REQUESTED_CHILD_HEAD'],
          'requested_child_tree':os.environ['REQUESTED_CHILD_TREE'],
          'baseline':'775692f2e72d76b6a97cf66926a86cc96342c109',
          'baseline_core_compiler_verified':True,
          'reason':'The unchanged Round2 acceptance predicate ran against exact775 evidence. Current Phase1 acceptance is separately required by the Round3 aggregate gate; full release remains OPEN.',
          'current_tree_compiler_accepted':False,'full_core_accepted':False,'full_release_accepted':False,
          'human_review':'NOT_ESTABLISHED','RH':'OPEN','Step4':'OPEN'}
        Path(os.environ['OPICA2_OUTPUT_DIR'],'checked-baseline-acceptance-scope.json').write_text(json.dumps(report,indent=2)+'\n')
        PY
    - name: Verify exact source unchanged after all commands
      shell: bash
      run: |-
        set -euo pipefail
        python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$OPICA2_OUTPUT_DIR/source/before.json"
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: opica2-acceptance
        path: ${{ env.OPICA2_OUTPUT_DIR }}
        if-no-files-found: error
    needs:
    - contract
    - formal
    - controls
    - ancestry
    - aggregate
    - generated
    - harvest
    if: ${{ always() && !cancelled() }}
