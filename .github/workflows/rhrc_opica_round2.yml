        python -m pip install -r research/RHRC/requirements.txt
    - name: Authenticate original source and explicitly dispatch original predicates
      shell: bash
      run: |-
        set -euo pipefail
        projection="$GITHUB_WORKSPACE/../opica2-frozen-$GITHUB_JOB"
        python -B "$OPICA2/ancestor_projection.py" create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$OPICA2_OUTPUT_DIR/ancestor-projection.json"
        mkdir -p "$projection/.lake"
        ln -s "$GITHUB_WORKSPACE/.lake/packages" "$projection/.lake/packages"
        printf '%s\n' "OPICA2_ANCESTOR_PROJECTION=$projection" >> "$GITHUB_ENV"
        python -B research/RHRC/integration/opica/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$OPICA2_OUTPUT_DIR/static76.json"
        python -B research/RHRC/integration/opica_followup/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$OPICA2_OUTPUT_DIR/static100.json"
    - name: Execute and authenticate both frozen baselines and both genuine current compiler exports
