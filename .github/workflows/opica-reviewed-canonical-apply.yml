name: OPICA reviewed canonical patch staging (isolated)
on:
  push:
    branches: [ops/opica-reviewed-canonical-314-eae5672]
permissions:
  contents: write
  actions: read
concurrency:
  group: opica-reviewed-canonical-314-eae5672
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'HMarcusWH/zeta-23-lean' && github.ref == 'refs/heads/ops/opica-reviewed-canonical-314-eae5672'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/opica-reviewed-canonical-stage.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eae5672cbbb18c4d53f50eccb664efb0421b877a
          path: native
          fetch-depth: 0
          persist-credentials: true
      - name: Authenticate, apply, verify all bytes and stage only
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: native
        run: python3 -B ../controller/.github/scripts/opica-reviewed-canonical-stage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-stage-314
          path: ${{ runner.temp }}/canonical-stage.json
          if-no-files-found: warn
