name: Stage the verified paper products for review

on:
  push:
    branches: [workmode/paper-320-reviewed-generated-publish]
    paths: [.github/workflows/paper-320-reviewed-generated-publish.yml]

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b1e57c979ee75cf833c2c6587ff4049dee42a8f3
          fetch-depth: 0
          persist-credentials: false
      - name: Load the pinned preimage census and four source rows
        shell: bash
        run: |
          python3 -B - <<'INPUTS'
          from pathlib import Path
          import os,base64,zlib
          runner=Path(os.environ['RUNNER_TEMP'])
          (runner/'candidate-preimage.json').write_bytes(zlib.decompress(base64.b64decode('')))
          (runner/'known-stale-repository-inventory.json').write_bytes(zlib.decompress(base64.b64decode('')))
          INPUTS
      - name: Authenticate the archive and report only reviewed Git metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '15208101505'
          ARTIFACT_SHA256: 'df7d6be458edad6d7a0fc59cd5469e451aa632e22b2235b48761d16eca4acf10'
          EXPECTED_PRODUCTS: '8'
          REQUIRED_PATHS: '["research/RHRC/ffbbp/generated/RHKG_CANDIDATE_REDUCTION_ASSURANCE.json","research/RHRC/graph/generated/REPOSITORY_COVERAGE.json","research/RHRC/graph/generated/registry_nodes.jsonl","research/RHRC/graph/generated/repository_files.jsonl","research/RHRC/integration/generated/RH_CORE_SOURCE_ONLY_THEOREMS.jsonl","research/RHRC/integration/generated/SOURCE_CANDIDATE_RESOLUTION.jsonl","research/RHRC/integration/generated/SOURCE_CANDIDATE_SUMMARY.json","research/RHRC/ool/generated/RHKG_OOL_PHASE_ATLAS.json"]'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HMarcusWH/zeta-23-lean
          test "$(git rev-parse HEAD)" = b1e57c979ee75cf833c2c6587ff4049dee42a8f3
          test "$(git rev-parse 'HEAD^{tree}')" = 146f23e3e8931766585b90f0cbbef22f91b3d378
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/46001224880/attempts/1" --jq '.status + ":" + .conclusion + ":" + .head_sha')" = completed:success:b1e57c979ee75cf833c2c6587ff4049dee42a8f3
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact.zip"
          python3 -B - <<'PY'
          from hashlib import sha256
          from io import BytesIO
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          from zipfile import ZipFile

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(*args, data=None):
              return subprocess.run(["git", *args], check=True, input=data,
                                    stdout=subprocess.PIPE).stdout

          runner = Path(os.environ["RUNNER_TEMP"])
          head = "b1e57c979ee75cf833c2c6587ff4049dee42a8f3"
          tree = "146f23e3e8931766585b90f0cbbef22f91b3d378"
          require(git("rev-parse", "HEAD", "HEAD^{tree}").decode().splitlines() == [head, tree], "Wrong replay checkout")
          archive_name = "documentation-canonical-46001224880-1"
          pinned_id = int(os.environ["ARTIFACT_ID"])
          pinned_sha256 = os.environ["ARTIFACT_SHA256"]
          require(re.fullmatch("[a-f0-9]{64}", pinned_sha256), "Missing archive digest pin")
          info = json.loads((runner / "artifact.json").read_text(encoding="utf-8"))
          run = info["workflow_run"]
          require((info["name"], info["id"], info["digest"], info["expired"]) ==
                  (archive_name, pinned_id, "sha256:" + pinned_sha256, False), "Unexpected artifact metadata")
          require((run["id"], run["head_sha"], run["head_branch"], run["head_repository_id"]) ==
                  (46001224880, head, "docs/papers-2026-11-26-terminal", 1339954300), "Unexpected run/source")
          archive = (runner / "artifact.zip").read_bytes()
          require(len(archive) == info["size_in_bytes"] and len(archive) <= 4_000_000 and
                  sha256(archive).hexdigest() == pinned_sha256, "Archive bytes differ")

          entries = {"input-head-tree.txt", "source-scope.json", "lean-version.txt", "exporter-build.log",
                     "materialize.log", "canonical-check.log", "generated-state.patch", "generated-stat.txt",
                     "generated-state.patch.sha256"}
          with ZipFile(BytesIO(archive)) as zipped:
              contents = zipped.infolist()
              require(set(zipped.namelist()) == entries and len(contents) == len(entries),
                      "Unexpected artifact inventory")
              require(sum(item.file_size for item in contents) <= 128_000_000, "Artifact expanded size too large")
              for item in contents:
                  mode = (item.external_attr >> 16) & 0o170000
                  path = PurePosixPath(item.filename)
                  require(len(path.parts) == 1 and mode in (0, stat.S_IFREG) and not item.is_dir(),
                          "Nonregular artifact entry")
              require(zipped.read("input-head-tree.txt").decode("ascii").splitlines() == [head, tree],
                      "Artifact head/tree mismatch")
              receipt = json.loads(zipped.read("source-scope.json"))
              require((receipt["checked_commit"], receipt["checked_tree"], receipt["status"]) ==
                      (head, tree, "PASS_SOURCE_SCOPE_ONLY"), "Artifact scope receipt mismatch")
              require(b"RHRC DERIVED STATE: PASS" in zipped.read("canonical-check.log"), "Missing canonical check")
              patch = zipped.read("generated-state.patch")
              patch_digest = sha256(patch).hexdigest()
              require(zipped.read("generated-state.patch.sha256").decode("ascii").split() ==
                      [patch_digest, "generated-state.patch"], "Generated patch digest differs")

          inherited = json.loads(Path(
              "research/RHRC/integration/documentation_2026_11_21/SOURCE_SCOPE.json"
          ).read_text(encoding="utf-8"))
          allowed = set(inherited["generated"])
          require(len(allowed) == 77 and not git("status", "--porcelain", "--untracked-files=all"),
                  "Wrong checkout inventory")
          require(bool(patch) and len(patch) <= 110_000_000, "Missing or oversized generated patch")
          git("apply", "--check", "--index", "-", data=patch)
          git("apply", "--index", "-", data=patch)
          git("diff", "--cached", "--check")
          paths = git("diff", "--cached", "--name-only", "-z", "HEAD").decode("utf-8").strip("\0").split("\0")
          modified = git("diff", "--cached", "--name-only", "-z", "--diff-filter=M", "HEAD").decode("utf-8").strip("\0").split("\0")
          require(bool(paths) and set(paths) == set(modified) and set(paths) <= allowed and
                  not git("diff", "--cached", "--summary"), "Unexpected generated patch scope or file type")

          inventory = Path("research/RHRC/graph/generated/repository_files.jsonl")
          byte_policy = json.loads(Path(
              "research/RHRC/integration/documentation_2026_11_26/ARCHIVE_BYTES.json"
          ).read_text(encoding="utf-8"))
          expected_pdfs = {p: item["git_blob"] for p, item in byte_policy["added"].items()
                           if item["file_kind"] == "BINARY_PDF"}
          require(len(expected_pdfs) == 6, "Paper byte policy must name six binary subjects")
          observed_pdfs = {}
          with inventory.open(encoding="utf-8") as stream:
              for line in stream:
                  row = json.loads(line)
                  if row.get("classification_rule") == "research_archive_2026_11_26_papers":
                      require((row["type"], row["file_class"], row["trust_zone"], row["generated_product"]) ==
                              ("RepoFile", "RESEARCH_FIXTURE", "AUDIT_ONLY", False),
                              "Paper mistaken for a generated or authority-bearing record")
                      require(row["path"] not in observed_pdfs, "Duplicate archived paper record")
                      observed_pdfs[row["path"]] = row["git_blob"]
          require(observed_pdfs == expected_pdfs, "Generated paper records disagree with exact binary inventory")

          source_changes = json.loads((runner / "known-stale-repository-inventory.json").read_bytes())
          require(source_changes["head"] == head and source_changes["stale_product"] == str(inventory),
                  "Stale-record evidence belongs to a different source")
          input_mismatches = source_changes["input_mismatches"]
          require(len(input_mismatches) == 4, "Expected the four repaired source blobs")
          seen = set()
          with inventory.open(encoding="utf-8") as stream:
              for line in stream:
                  row = json.loads(line)
                  path = row.get("path")
                  if path in input_mismatches:
                      actual = git("rev-parse", head + ":" + path).decode().strip()
                      require(path not in seen and actual == row["git_blob"] ==
                              input_mismatches[path]["published_source_blob"], "Unrepaired source blob inventory")
                      seen.add(path)
          require(seen == set(input_mismatches), "A repaired source path disappeared from inventory")
          require(len(paths) == int(os.environ["EXPECTED_PRODUCTS"]), "Product count differs from successful producer")
          required = set(json.loads(os.environ["REQUIRED_PATHS"]))
          require(required <= set(paths), "Known stale products are missing from the candidate")
          shards = []
          parent_records = git("diff", "--cached", "--raw", "--no-abbrev", "-z", "HEAD").split(b"\0")
          require(len(parent_records) == 2 * len(paths) + 1, "Invalid raw Git diff inventory")
          for i in range(0, len(parent_records) - 1, 2):
              mode_old, mode_new, blob_old, blob_new, status = parent_records[i].decode("ascii").split()
              path = parent_records[i + 1].decode("utf-8")
              require((mode_old, mode_new, status) == (":100644", "100644", "M") and path in allowed,
                      "Review patch modifies a nonregular product")
              require(re.fullmatch("[a-f0-9]{40}", blob_old) and re.fullmatch("[a-f0-9]{40}", blob_new)
                      and blob_old != blob_new, "Invalid before/after Git blob pair")
              staged = git("cat-file", "blob", ":" + path)
              require(bool(staged) and b"\0" not in staged, "Generated product is empty or binary")
              shards.append({"path": path, "before_git_blob": blob_old, "after_git_blob": blob_new,
                             "sha256": sha256(staged).hexdigest(), "bytes_after": len(staged)})
          metadata = {"source_head": head, "source_tree": tree, "run": run["id"], "attempt": 1,
                      "artifact": pinned_id, "zip_sha256": pinned_sha256, "patch_sha256": patch_digest,
                      "patch_bytes": len(patch), "candidate_tree": git("write-tree").decode().strip(),
                      "paths": sorted(paths), "products": shards, "verified_binary_papers": len(observed_pdfs),
                      "proof_acceptance": False}

          preimages = json.loads((runner / "candidate-preimage.json").read_bytes())
          require((preimages["head"], preimages["tree"]) == (head, tree), "Mismatched preimage census")
          before = preimages["products"]
          require(len(before) == 81 and allowed == {p for p,row in before.items() if row["frozen"] is False},
                  "Incomplete active/frozen inventory")
          complete_census = {}
          for path, pre in before.items():
              original = git("rev-parse", head + ":" + path).decode().strip()
              staged = git("rev-parse", ":" + path).decode().strip()
              require(original == pre["git_blob"], "Wrong census input: " + path)
              require((staged != original) == (path in paths), "Unexpected product change: " + path)
              if pre["frozen"]:
                  require(staged == original, "Changed frozen product: " + path)
              raw = git("cat-file", "blob", staged)
              complete_census[path] = {"before": pre, "after_git_blob": staged,
                                       "after_sha256": sha256(raw).hexdigest(), "bytes_after": len(raw)}
          (runner / "verified-product-census.json").write_text(json.dumps(complete_census, indent=2) + "\n")
          metadata["verified_active_products"] = 77
          metadata["verified_frozen_products"] = 4
          metadata["verified_repaired_source_blobs"] = sorted(seen)

          """Validate all catalogued source/index blobs and every archived PDF against its original Git object."""
          import hashlib
          from pathlib import Path
          import subprocess

          def validate_bytes(repo, head, tree, products, policy):
              def git(*args):
                  return subprocess.check_output(['git','-C',str(repo),*args])
              def oid(spec):
                  return git('rev-parse',spec).decode().strip()
              def require(condition,label):
                  if not condition:
                      raise ValueError(label)
              require(oid('HEAD')==head and oid(head+'^{tree}')==tree,'source/tree')
              archive=policy['archive_commit']
              require(oid(archive+'^{tree}')==policy['archive_tree'],'archive/tree')
              git('merge-base','--is-ancestor',archive,head)
              require(len(products)==81 and sum(r['frozen'] for r in products.values())==4,'catalogue size')
              pdfs={}
              for path,row in policy['added'].items():
                  if row['file_kind']!='BINARY_PDF':
                      continue
                  blob=oid(archive+':'+path)
                  require(blob==oid(head+':'+path)==oid(':'+path)==row['git_blob'],path)
                  data=git('cat-file','blob',blob)
                  require(data.startswith(b'%PDF-') and len(data)==row['size_bytes'] and hashlib.sha256(data).hexdigest()==row['sha256'],path)
                  pdfs[path]=blob
              require(len(pdfs)==6,'PDF count')
              for path,row in products.items():
                  original=oid(head+':'+path)
                  require(original==row['git_blob'],path)
                  data=git('cat-file','blob',original)
                  require(len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256'],path)
                  if row['frozen']:
                      require(original==oid(':'+path),path)
              return pdfs

          require(validate_bytes(Path.cwd(),head,tree,before,byte_policy)==observed_pdfs,"Archived PDF bytes differ")
          predicted={'research/RHRC/ffbbp/generated/RHKG_CANDIDATE_REDUCTION_ASSURANCE.json': 'b52e78ed2f633c3a48b93d9852e8ee807bb457315edcc870fed84a6e86b61a80', 'research/RHRC/graph/generated/REPOSITORY_COVERAGE.json': 'decd4b1c08a9162e876fab9cfaddc272b2f58c4314487b87d898b2ef3cdbb193', 'research/RHRC/graph/generated/registry_nodes.jsonl': 'eba4a28ca02b9b0637c2bb23e1fa9a5debd0d00cc33dd6726ff7ddbdacbee0c5', 'research/RHRC/graph/generated/repository_files.jsonl': 'c0604f8df7f8aaa9d72f80931dbe4384651f6a352f11db8b64760e053df62a73', 'research/RHRC/integration/generated/RH_CORE_SOURCE_ONLY_THEOREMS.jsonl': '51c3212e07f265f145d66c3b9dca59d0058eb61e9e34f6cfd502729b92927513', 'research/RHRC/integration/generated/SOURCE_CANDIDATE_RESOLUTION.jsonl': '38a8c9855cac111724504fb3673e42a54043f9a210d06921dac5abbe1b327bc5', 'research/RHRC/integration/generated/SOURCE_CANDIDATE_SUMMARY.json': '9006ead3c11e8c0f73b440c68863ebf68545eef037e11134ed91d71d36d5de47', 'research/RHRC/ool/generated/RHKG_OOL_PHASE_ATLAS.json': '0eceb8e9c447dc7547a99ab073d5965c2c12340011d9bc11e0735a5b90979e68'}
          require(predicted=={x["path"]:x["sha256"] for x in shards},"Independent byte predictions differ from canonical")
          (runner/"verified-paper-replay.json").write_text(json.dumps(metadata,indent=2)+"\n")
          print("PAPER320_REVIEW_META " + json.dumps(metadata, sort_keys=True))
          PY
      - name: Confirm the independently reviewed candidate and publish on the evidence branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HMarcusWH/zeta-23-lean
          test "$GITHUB_REF" = refs/heads/workmode/paper-320-reviewed-generated-publish
          source=b1e57c979ee75cf833c2c6587ff4049dee42a8f3
          reviewref=refs/heads/workmode/paper-320-reviewed-generated
          old=e7b940fece806876a9f4ff6de05aca3cee3f06f0
          test "$(git ls-remote origin "$reviewref" | cut -f1)" = "$old"
          test "$(git ls-remote origin refs/heads/docs/papers-2026-11-26-terminal | cut -f1)" = "$source"
          test "$(git rev-parse HEAD)" = "$source"
          git merge-base --is-ancestor "$old" "$source"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/46019974859/attempts/1" > "$RUNNER_TEMP/independent-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/15207442985" > "$RUNNER_TEMP/independent-info.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/15207442985/zip" > "$RUNNER_TEMP/independent.zip"
          python3 -B - <<'PYTHON'
          import hashlib,json,os,zipfile
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])
          def required(ok,reason):
              if not ok: raise ValueError(reason)
          w=json.loads((d/'independent-run.json').read_bytes())
          required((w['id'],w['run_attempt'],w['event'],w['path'],w['head_sha'],w['head_branch'],w['status'],w['conclusion'])==(46019974859,1,'push','.github/workflows/paper-320-generated-artifact-relay.yml','301bfd6c059caa1e93f31b56875bdec01ee5a7c9','workmode/paper-320-generated-artifact-relay','completed','success'),'wrong independent verifier')
          a=json.loads((d/'independent-info.json').read_bytes())
          required((a['id'],a['name'],a['expired'],a['digest'],a['workflow_run']['id'],a['workflow_run']['head_sha'])==(15207442985,'paper-320-replay-46019974859-1',False,'sha256:0aa4566211d7e6f09bcee32dbb7b1819d26bc32aebdfc9418e32eac6a43f9324',46019974859,'301bfd6c059caa1e93f31b56875bdec01ee5a7c9'),'wrong reviewer artifact')
          raw=(d/'independent.zip').read_bytes()
          required(len(raw)==a['size_in_bytes'] and len(raw)<2_000_000 and 'sha256:'+hashlib.sha256(raw).hexdigest()==a['digest'],'review archive bytes')
          with zipfile.ZipFile(d/'independent.zip') as z:
              required(sorted(z.namelist())==['verified-paper-replay.json','verified-product-census.json'] and sum(i.file_size for i in z.infolist())<2_000_000,'incorrect review inventory')
              for n in z.namelist():
                  required(json.loads(z.read(n))==json.loads((d/n).read_bytes()),'independent mismatch '+n)
          local=json.loads((d/'verified-paper-replay.json').read_bytes())
          required((local['patch_sha256'],local['candidate_tree'])==('2c7d4352346405d79324da7da5c6a37a4f6bd749cff4badd108aafbb54003157','dbbbdd2dfc7c78f462b89a7a85001aa58341a221'),'local pin differs')
          PYTHON
          test "$(git write-tree)" = dbbbdd2dfc7c78f462b89a7a85001aa58341a221
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Stage eight independently verified #320 generated products"
          test "$(git rev-parse HEAD^)" = "$source"
          test "$(git rev-parse HEAD^{tree})" = dbbbdd2dfc7c78f462b89a7a85001aa58341a221
          python3 -B -m research.RHRC.integration.documentation_2026_11_26.source_scope --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$old" HEAD
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease="$reviewref:$old" origin "HEAD:$reviewref"
          test "$(git ls-remote origin "$reviewref" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD HEAD^ HEAD^{tree} > "$RUNNER_TEMP/reviewed-publication-head-tree.txt"
      - name: Retain the evidence branch receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper320-reviewed-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verified-paper-replay.json
            ${{ runner.temp }}/verified-product-census.json
            ${{ runner.temp }}/reviewed-publication-head-tree.txt
          if-no-files-found: error
