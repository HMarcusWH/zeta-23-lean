name: RHRC post-192 parity trajectory rigidity

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rhrc-post192-parity-trajectory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  post192-parity-trajectory-rigidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install R003 numerical audit requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Check post-#192 parity-trajectory plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post192_fb05_q14_parity_trajectory_rigidity_scope.py
      - name: Probe post-#192 parity-trajectory scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post192_fb05_q14_parity_trajectory_rigidity_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post192_fb05_q14_parity_trajectory_rigidity_v1.json \
            --output /tmp/POST192_FB05_Q14_PARITY_TRAJECTORY_SCHEDULE.json
      - name: Certify post-#192 parity trajectory rigidity
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post192_fb05_q14_parity_trajectory_rigidity_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post192_fb05_q14_parity_trajectory_rigidity_v1.json \
            --schedule /tmp/POST192_FB05_Q14_PARITY_TRAJECTORY_SCHEDULE.json \
            --output /tmp/POST192_FB05_Q14_PARITY_TRAJECTORY_CERTIFICATE.json
