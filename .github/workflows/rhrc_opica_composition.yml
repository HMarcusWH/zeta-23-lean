name: OPICA Round4 governed deduction and independent source gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [research/opica-round4]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: opica-round4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  LEAN_NUM_THREADS: '2'
jobs:
  lanes:
    name: Round4 / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {lane: CONTRACT, native: false, provider: false}
          - {lane: PARENT_REGRESSION, native: false, provider: false}
          - {lane: CURRENT_COMPATIBILITY, native: true, provider: false}
          - {lane: COMPOSITION_FORMAL, native: true, provider: false}
          - {lane: SEMANTIC_NEGATIVES, native: true, provider: false}
          - {lane: FRAMEWORK_ADAPTERS, native: false, provider: false}
          - {lane: PROVIDER_SELECTED, native: false, provider: true}
          - {lane: REPLAY_CAMPAIGN, native: true, provider: false}
          - {lane: GENERATED_STATE, native: true, provider: false}
          - {lane: MATHEMATICAL_SUPPORT, native: true, provider: false}
          - {lane: SOURCE_NUMERICS, native: false, provider: false}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: host
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: ./host/.github/actions/opica4-runtime
        with:
          native: ${{ matrix.native }}
          provider: ${{ matrix.provider }}
      - name: Execute exact source-bound lane in a bounded cgroup
        working-directory: host
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect --unit="opica4-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=4294967296 -p MemorySwapMax=0 -p TasksMax=64 -p CPUQuota=200% \
            -p "WorkingDirectory=$PWD" /usr/bin/env \
            "PATH=$PATH" "HOME=$HOME" PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 LEAN_NUM_THREADS=2 \
            "OPICA_NATIVE_OUTPUT=$OPICA_NATIVE_OUTPUT" "OPICA_NATIVE_CONFIG=$OPICA_NATIVE_CONFIG" \
            python -B -m research.RHRC.integration.opica_composition.cli lane \
            --lane "$LANE" --output "$RUNNER_TEMP/opica4-lanes/$LANE" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --provider-root "$GITHUB_WORKSPACE/provider"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: opica4-${{ matrix.lane }}
          path: ${{ runner.temp }}/opica4-lanes/${{ matrix.lane }}
          if-no-files-found: error
  acceptance:
    name: Round4 / ACCEPTANCE
    needs: lanes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Require every matrix job to succeed
        env:
          UPSTREAM: ${{ needs.lanes.result }}
        run: test "$UPSTREAM" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: host
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: ./host/.github/actions/opica4-runtime
        with:
          native: 'true'
          provider: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: opica4-*
          path: ${{ runner.temp }}/opica4-input
      - name: Reconstruct eleven complete bundles and run independent checkers
        working-directory: host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opica4-bundles"
          for lane in CONTRACT PARENT_REGRESSION CURRENT_COMPATIBILITY COMPOSITION_FORMAL SEMANTIC_NEGATIVES FRAMEWORK_ADAPTERS PROVIDER_SELECTED REPLAY_CAMPAIGN GENERATED_STATE MATHEMATICAL_SUPPORT SOURCE_NUMERICS; do
            test -f "$RUNNER_TEMP/opica4-input/opica4-$lane/lane.json"
            mv "$RUNNER_TEMP/opica4-input/opica4-$lane" "$RUNNER_TEMP/opica4-bundles/$lane"
          done
          sudo systemd-run --wait --pipe --collect --unit="opica4-accept-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=4294967296 -p MemorySwapMax=0 -p TasksMax=64 -p CPUQuota=200% \
            -p "WorkingDirectory=$PWD" /usr/bin/env \
            "PATH=$PATH" "HOME=$HOME" PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 LEAN_NUM_THREADS=2 \
            "OPICA_NATIVE_OUTPUT=$OPICA_NATIVE_OUTPUT" "OPICA_NATIVE_CONFIG=$OPICA_NATIVE_CONFIG" \
            python -B -m research.RHRC.integration.opica_composition.cli accept \
            --bundles "$RUNNER_TEMP/opica4-bundles" --output "$RUNNER_TEMP/opica4-acceptance" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --provider-root "$GITHUB_WORKSPACE/provider"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: opica4-ACCEPTANCE
          path: ${{ runner.temp }}/opica4-acceptance
          if-no-files-found: error
