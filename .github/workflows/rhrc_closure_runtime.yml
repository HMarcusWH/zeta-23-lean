name: RHRC closure interpreter runtime
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/rhrc_closure_runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Export interpreter signatures without credentials
        run: |
          mkdir -p /tmp/runtime
          python3 - <<'PY'
          import pathlib,tarfile,subprocess
          prefix=pathlib.Path(subprocess.check_output(['lean','--print-prefix'],text=True).strip())
          for name,root in [('toolchain-sig',prefix),('package-sig',pathlib.Path('.lake'))]:
              with tarfile.open('/tmp/runtime/'+name+'.tgz','w:gz',compresslevel=3) as out:
                  for f in root.rglob('*.ir.sig'):
                      out.add(f,arcname=f.relative_to(root),recursive=False)
          PY
          cd /tmp/runtime
          sha256sum *.tgz > SHA256SUMS
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: closure-interpreter-signatures
          path: /tmp/runtime/
          compression-level: 0
          retention-days: 2
