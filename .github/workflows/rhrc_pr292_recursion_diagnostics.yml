name: PR292 isolated source-only recursion diagnosis
on:
  push:
    branches: [diagnostics/pr292-rhkg-recursion-20261015]
    paths: [.github/workflows/rhrc_pr292_recursion_diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install existing RHRC Python dependencies
        run: python -m pip install -r research/RHRC/requirements.txt
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Fresh canonical inventory without D2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr292-recur-diag
          lake build Zeta23.RHRC.DeclarationDependencyExport \
            Zeta23.RHRC.SourceCandidateResolution 2>&1 | tee /tmp/pr292-recur-diag/lean-prebuild.log
          python research/RHRC/tools/lean_dependency_extract.py --write 2>&1 | tee /tmp/pr292-recur-diag/registered-graph.log
          python research/RHRC/graph/build.py --write 2>&1 | tee /tmp/pr292-recur-diag/graph-build.log
          python research/RHRC/integration/candidate_exactify.py --write 2>&1 | tee /tmp/pr292-recur-diag/source-candidate-exactify.log
          python research/RHRC/ffbbp/rhkg_assurance.py --write 2>&1 | tee /tmp/pr292-recur-diag/assurance.log
      - name: Isolate imports, array elaboration, traversal
        shell: bash
        run: |
          set -euo pipefail
          python research/RHRC/integration/pr292_recursion_diagnostic.py --out /tmp/pr292-recur-diag
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr292-isolated-recursion-diagnostics
          path: /tmp/pr292-recur-diag/
          if-no-files-found: warn
          retention-days: 15
