name: RHRC post-204 Pair-D structural countermodel

on:
  pull_request:
    paths:
      - '.github/workflows/rhrc_post204_pair_d_structural_countermodel.yml'
      - 'research/RHRC/countermodels/fixtures/post204_pair_d_c1_v1.json'
      - 'research/RHRC/countermodels/post204_pair_d_exact_geometry.py'
      - 'research/RHRC/countermodels/check_post204_pair_d_exact_geometry.py'
      - 'research/RHRC/countermodels/check_post204_pair_d_scope.py'
      - 'research/RHRC/countermodels/certify_post204_pair_d_structural_countermodel.py'
  workflow_dispatch:

jobs:
  pair-d-c1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing R003 research requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Check exact Pair-D geometry
        run: python research/RHRC/countermodels/check_post204_pair_d_exact_geometry.py
      - name: Check Pair-D scope firewall
        run: python research/RHRC/countermodels/check_post204_pair_d_scope.py
      - name: Certify exact C1 simultaneous-bad countermodel
        run: python research/RHRC/countermodels/certify_post204_pair_d_structural_countermodel.py
