name: RHRC approved SECOND460 resource continuation
on:
  workflow_dispatch:
  push:
    branches: [research/post290-step123-output]
    paths: [.github/workflows/rhrc_post290_unrun460.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: post290-second-unrun460-resource-v1
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  ROUTE: research/RHRC/routes/R003_ccm_bridge
  RUNNER: research/RHRC/routes/R003_ccm_bridge/post290/k3_continue_unrun460.py
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      wave1: ${{ steps.matrix.outputs.wave1 }}
      wave2: ${{ steps.matrix.outputs.wave2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r "$ROUTE/requirements.txt" PyYAML==6.0.2
      - name: Validate resource guards before claiming arithmetic
        run: python "$ROUTE/post290/test_k3_unrun460.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/k3-artifact --ignore-scripts @actions/artifact@2.3.2
      - &artifact_runtime
        name: Expose masked artifact runtime to checkpoint supervisor
        uses: actions/github-script@v7
        with:
          script: |
            for (const key of ['ACTIONS_RUNTIME_TOKEN','ACTIONS_RUNTIME_URL','ACTIONS_RESULTS_URL']) {
              if (!process.env[key] && key === 'ACTIONS_RUNTIME_URL') continue;
              if (!process.env[key]) throw new Error('Missing artifact runtime '+key);
              if (key.endsWith('TOKEN')) core.setSecret(process.env[key]);
              core.exportVariable(key,process.env[key]);
            }
      - name: Preflight exact artifact upload, named lookup and byte-identical recovery before plan freeze
        env:
          K3_ARTIFACT_MODULE: /tmp/k3-artifact/node_modules/@actions/artifact
        run: node "$ROUTE/post290/k3_checkpoint_upload.cjs" preflight /tmp/unrun460-preflight
      - name: Recover exact source-bound original archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p /tmp/unrun460-intake
          gh api repos/HMarcusWH/zeta-23-lean/actions/artifacts/11865755269 > /tmp/unrun460-intake/archive-api.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/unrun460-intake/archive-api.json').read_text())
          assert a['id']==11865755269 and a['name']=='post290-k3-second-continuation' and not a['expired']
          assert a['digest']=='sha256:0077e514187a0cb326170b7b13e9e699d898a2ba10d8b4b20fa75a5cd6072b92'
          assert a['workflow_run']['head_sha']=='4789c93f6dd60817936793935211522a0b8100e1'
          PY
          gh api repos/HMarcusWH/zeta-23-lean/actions/artifacts/11865755269/zip > /tmp/unrun460-intake/original.zip
          gh api 'repos/HMarcusWH/zeta-23-lean/actions/workflows/rhrc_post290_unrun460.yml/runs?per_page=100' --paginate --slurp > /tmp/unrun460-intake/protocol-runs.json
          python "$RUNNER" freeze /tmp/unrun460-intake/original.zip --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --runs /tmp/unrun460-intake/protocol-runs.json --out /tmp/unrun460-frozen
      - name: Freeze both complete waves before evaluation
        id: matrix
        run: |
          python - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('wave1='+json.dumps({'index':list(range(256))},separators=(',',':'))+'\n')
              f.write('wave2='+json.dumps({'index':list(range(256,460))},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3-unrun460-plan
          path: /tmp/unrun460-frozen/plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: k3-unrun460-original-preserved
          path: /tmp/unrun460-frozen/producer
          if-no-files-found: error
  search-wave1:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.freeze.outputs.wave1) }}
    steps: &search_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python -m pip install -r "$ROUTE/requirements.txt"
          npm install --prefix /tmp/k3-artifact --ignore-scripts @actions/artifact@2.3.2
      - uses: actions/download-artifact@v4
        with:
          name: k3-unrun460-plan
          path: /tmp/unrun460-frozen
      - *artifact_runtime
      - name: Claim this child once before any native enclosure
        env:
          CHILD_INDEX: ${{ matrix.index }}
        run: python "$RUNNER" claim /tmp/unrun460-frozen/plan.json --index "$CHILD_INDEX" --out /tmp/unrun460-result
      - uses: actions/upload-artifact@v4
        with:
          name: k3-unrun460-budget-${{ matrix.index }}
          path: /tmp/unrun460-result/budget-claim.json
          if-no-files-found: error
      - name: Execute one strict1800-second child budget with45-second durable checkpoints
        id: search
        continue-on-error: true
        env:
          CHILD_INDEX: ${{ matrix.index }}
          K3_ARTIFACT_MODULE: /tmp/k3-artifact/node_modules/@actions/artifact
        run: python "$RUNNER" run /tmp/unrun460-frozen/plan.json --index "$CHILD_INDEX" --out /tmp/unrun460-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-unrun460-result-${{ matrix.index }}
          path: /tmp/unrun460-result
          if-no-files-found: error
      - name: Publish any negative investigation stop after final artifact recovery
        if: always()
        env:
          K3_ARTIFACT_MODULE: /tmp/k3-artifact/node_modules/@actions/artifact
        run: |
          if test -f /tmp/unrun460-result/negative-stop.json; then
            node "$ROUTE/post290/k3_checkpoint_upload.cjs" k3-unrun460-negative-stop /tmp/unrun460-result/negative-stop.json
          fi
      - name: Preserve execution failure independently of scientific disposition
        if: always() && steps.search.outcome == 'failure'
        run: exit 1
  search-wave2:
    needs: [freeze, search-wave1]
    if: ${{ !cancelled() && needs.freeze.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.freeze.outputs.wave2) }}
    steps: *search_steps
  assemble-search:
    needs: [freeze, search-wave1, search-wave2]
    if: ${{ !cancelled() && needs.freeze.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      batches: ${{ steps.candidate.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r "$ROUTE/requirements.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/k3-artifact --ignore-scripts @actions/artifact@2.3.2
      - *artifact_runtime
      - uses: actions/download-artifact@v4
        with:
          name: k3-unrun460-plan
          path: /tmp/unrun460-frozen
      - uses: actions/download-artifact@v4
        with:
          name: k3-unrun460-original-preserved
          path: /tmp/unrun460-frozen/producer
      - name: Recover all460 result names directly without a global artifact-list limit
        env:
          K3_ARTIFACT_MODULE: /tmp/k3-artifact/node_modules/@actions/artifact
        run: node "$ROUTE/post290/k3_checkpoint_upload.cjs" recover-results /tmp/unrun460-results
      - name: Preserve every original leaf and all460 child dispositions; freeze all checker batches
        id: candidate
        run: python "$RUNNER" assemble /tmp/unrun460-frozen/plan.json /tmp/unrun460-results --out /tmp/unrun460-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-unrun460-candidate
          path: /tmp/unrun460-candidate
          if-no-files-found: error
  independent-check-batches:
    needs: assemble-search
    if: ${{ needs.assemble-search.outputs.batches != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJson(needs.assemble-search.outputs.batches) }}
    uses: ./.github/workflows/rhrc_post290_unrun460_check_batch.yml
    with:
      batch: ${{ matrix.batch }}
  final-nonpartial:
    needs: [assemble-search, independent-check-batches]
    if: ${{ !cancelled() && needs.assemble-search.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r "$ROUTE/requirements.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/k3-artifact --ignore-scripts @actions/artifact@2.3.2
      - *artifact_runtime
      - uses: actions/download-artifact@v4
        with:
          name: k3-unrun460-candidate
          path: /tmp/unrun460-candidate
      - name: Recover every exact frozen checker shard name
        env:
          K3_ARTIFACT_MODULE: /tmp/k3-artifact/node_modules/@actions/artifact
        run: node "$ROUTE/post290/k3_checkpoint_upload.cjs" recover-checks /tmp/unrun460-candidate/checker-partition.json /tmp/unrun460-checked
      - name: Assemble all fresh checked leaves, preserving missing artifacts
        continue-on-error: true
        run: python "$ROUTE/post290/k3_replay_shards.py" assemble /tmp/unrun460-candidate/checker-partition.json /tmp/unrun460-candidate /tmp/unrun460-candidate/source-revalidation.json /tmp/unrun460-checked --out /tmp/unrun460-final/full-checker.json
      - name: Original strict NON-PARTIAL30-layer gate; RH remainsOPEN
        run: python "$ROUTE/post290/k3_assemble_complete.py" final /tmp/unrun460-candidate /tmp/unrun460-final/full-checker.json --source-revalidation /tmp/unrun460-candidate/source-revalidation.json --out /tmp/unrun460-final/disposition.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-unrun460-final-independent-result
          path: /tmp/unrun460-final
          if-no-files-found: error
