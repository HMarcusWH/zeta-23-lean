name: Run the original checks on the reviewed paper product commit
on:
  push:
    branches: [workmode/paper-320-reviewed-generated-publish]
    paths: [.github/workflows/paper-320-repaired-source-checks.yml]
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the reviewed parent and tree, then dispatch missing original workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HMarcusWH/zeta-23-lean
          test "$GITHUB_REF" = refs/heads/workmode/paper-320-reviewed-generated-publish
          repo="/repos/$GITHUB_REPOSITORY"
          branch=docs/papers-2026-11-26-terminal
          sha=30b3a430c350eeeef9ff1aa8c99d10cd30dc3fb3
          check_head() {
            test "$(gh api "$repo/pulls/320" --jq '[.state,.head.ref,.head.sha,.base.ref] | join(" ")')" = "open $branch $sha main"
            test "$(gh api "$repo/git/ref/heads/$branch" --jq '.object.sha')" = "$sha"
          }
          check_head
          test "$(gh api "$repo/git/commits/$sha" --jq '[.tree.sha,(.parents|length|tostring),.parents[0].sha] | join(" ")')" = 'dbbbdd2dfc7c78f462b89a7a85001aa58341a221 1 b1e57c979ee75cf833c2c6587ff4049dee42a8f3'
          test "$(gh api "$repo/actions/runs/46020505960/attempts/1" --jq '[.status,.conclusion,.head_sha]|join(" ")')" = 'completed success a8f11ea3efc9139e138f32c6de40375c0abe241d'
          for flow in documentation.yml rhrc.yml; do
            check_head
            runs="$(gh api -X GET "$repo/actions/workflows/$flow/runs" -f head_sha="$sha" -f per_page=100 --jq '[.workflow_runs[] | select(.event=="pull_request" or .event=="workflow_dispatch")] | length')"
            if [[ "$runs" == 0 ]]; then
              gh api --method POST "$repo/actions/workflows/$flow/dispatches" -f ref="$branch"
              echo "Requested $flow at $sha"
            else
              echo "$flow already has an exact-source run"
            fi
            check_head
          done
