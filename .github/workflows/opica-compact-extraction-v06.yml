name: OPICA compact supplier complete source extraction (NO proof promotion)
on:
  push:
    branches: [research/compact-supplier-extraction-v0-6-20261125]
    paths:
      - 'research/opica_compact_extraction/**'
      - '.github/workflows/opica-compact-extraction-v06.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-supplier-extraction-${{ github.sha }}
  cancel-in-progress: false
jobs:
  exact-source-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Clone exact public Apache-licensed rewrite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grh-pinned"
          git -C "$RUNNER_TEMP/grh-pinned" init
          git -C "$RUNNER_TEMP/grh-pinned" fetch --depth 1 https://github.com/lsernau/grh-lean.git 72fead102f663d5c7a407964a13dc0cf9d977207
          git -C "$RUNNER_TEMP/grh-pinned" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/grh-pinned" rev-parse HEAD)" = "72fead102f663d5c7a407964a13dc0cf9d977207"
          test "$(git -C "$RUNNER_TEMP/grh-pinned" rev-parse 'HEAD^{tree}')" = "5eb1240f03e791edd3fc7aa84a3a7d8dc3997b7f"
      - name: Byte custody, complete lexical inventories, two arithmetic-only cuts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/opica_compact_extraction/extract_all.py
          python research/opica_compact_extraction/extract_all.py --source "$RUNNER_TEMP/grh-pinned" --out "$RUNNER_TEMP/compact-extraction"
      - name: Publish complete source and navigation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-source-extraction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-extraction/
          if-no-files-found: warn
          retention-days: 30
