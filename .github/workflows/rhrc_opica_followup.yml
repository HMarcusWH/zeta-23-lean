name: OPICA follow-up original-contract validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/opica-native-followup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opica-followup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOLLOWUP: research/RHRC/integration/opica_followup
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  followup-contract:
    name: followup-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate current Round4 child before historical parent replay
        id: round4-parent-scope
        if: ${{ hashFiles('research/RHRC/integration/opica_round4/BUILD_MANIFEST.json') != '' }}
        shell: bash
        env:
          ROUND4_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # R4_PARENT_SCOPE_V1: inspect the actual child before unchanged historical guards.
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$ROUND4_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$evidence/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{commit}' || git fetch --no-tags origin fe16565b2a31fb8b68bef916ae8f04d535880e7a
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND4_PARENT_SCOPE_REPLAY=true' >> "$GITHUB_ENV"
      - name: Authenticate explicit Round2 ancestor projection (baseline scope only)
        id: round2-ancestor
        if: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          projection="$GITHUB_WORKSPACE/../opica2-frozen-$GITHUB_JOB"
          mkdir -p "$evidence"
          python -B research/RHRC/tools/run_suite.py --freeze-source "$evidence/descendant-source-before.json"
          git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$evidence/projection.json"
          python -B research/RHRC/integration/opica_followup/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$evidence/dispatch.json"
          printf '%s\n' "OPICA_ANCESTOR_PROJECTION=$projection" "OPICA_CURRENT_SOURCE_ROOT=$GITHUB_WORKSPACE" "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          report={'schema':'OPICA2_BASELINE_WORKFLOW_SCOPE_V1','workflow_checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseline_commit':'416aec21d4d6634675639b5397cc300d1f826e34','baseline_tree':'0506bca8ffe613e9cd9ab844650a1141d4494f66',
              'scope':'FROZEN_ANCESTOR_BASELINE_ONLY','current_tree_compatibility_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
          Path(os.environ['RUNNER_TEMP'],'opica2-baseline-scope','scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python "$FOLLOWUP/validate_contract.py" --phase preflight --output /tmp/opica-followup-contract.json
      - name: Verify the ledger-derived module navigation table (no theorem authority)
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python -B "$FOLLOWUP/continuation/2026-10-22/refresh_navigation.py" --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-followup-preparation
          path: /tmp/opica-followup-contract.json

      - name: Verify unchanged descendant source and exact baseline projection
        if: ${{ always() && steps.round2-ancestor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPICA_CURRENT_SOURCE_ROOT"
          python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$RUNNER_TEMP/opica2-baseline-scope/descendant-source-before.json"
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py verify --repo "$GITHUB_WORKSPACE" --destination "$OPICA_ANCESTOR_PROJECTION" > "$RUNNER_TEMP/opica2-baseline-scope/projection-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        with:
          name: opica_followup-baseline-source-scope-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/opica2-baseline-scope
          if-no-files-found: error

  followup-regression:
    name: followup-regression
    needs: followup-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate current Round4 child before historical parent replay
        id: round4-parent-scope
        if: ${{ hashFiles('research/RHRC/integration/opica_round4/BUILD_MANIFEST.json') != '' }}
        shell: bash
        env:
          ROUND4_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # R4_PARENT_SCOPE_V1: inspect the actual child before unchanged historical guards.
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$ROUND4_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$evidence/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{commit}' || git fetch --no-tags origin fe16565b2a31fb8b68bef916ae8f04d535880e7a
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND4_PARENT_SCOPE_REPLAY=true' >> "$GITHUB_ENV"
      - name: Authenticate explicit Round2 ancestor projection (baseline scope only)
        id: round2-ancestor
        if: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          projection="$GITHUB_WORKSPACE/../opica2-frozen-$GITHUB_JOB"
          mkdir -p "$evidence"
          python -B research/RHRC/tools/run_suite.py --freeze-source "$evidence/descendant-source-before.json"
          git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$evidence/projection.json"
          python -B research/RHRC/integration/opica_followup/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$evidence/dispatch.json"
          printf '%s\n' "OPICA_ANCESTOR_PROJECTION=$projection" "OPICA_CURRENT_SOURCE_ROOT=$GITHUB_WORKSPACE" "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          report={'schema':'OPICA2_BASELINE_WORKFLOW_SCOPE_V1','workflow_checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseline_commit':'416aec21d4d6634675639b5397cc300d1f826e34','baseline_tree':'0506bca8ffe613e9cd9ab844650a1141d4494f66',
              'scope':'FROZEN_ANCESTOR_BASELINE_ONLY','current_tree_compatibility_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
          Path(os.environ['RUNNER_TEMP'],'opica2-baseline-scope','scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python -m pip install --require-hashes --only-binary=:all: -r "$FOLLOWUP/python-checks.lock"
      - name: Replay all frozen controls and explicitly noninterval numerical cases
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python "$FOLLOWUP/replay_controls.py" --modes normal optimized --include-numerical --output-dir /tmp/opica-followup-regression
      - name: Exercise complete child validation suite in both Python modes
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python -m unittest discover -s "$FOLLOWUP/tests" -p 'test_*.py'
          python -O -m unittest discover -s "$FOLLOWUP/tests" -p 'test_*.py'
      - name: Exercise the complete parent validation suite in both modes
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python -m unittest discover -s research/RHRC/integration/opica/tests -p 'test_*.py'
          python -O -m unittest discover -s research/RHRC/integration/opica/tests -p 'test_*.py'
      - name: Exercise the exact registered dependency storage controls in both modes
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          test -f research/RHRC/integration/tests/test_registered_dependency_shards.py
          python -m unittest discover -s research/RHRC/integration/tests -p 'test_registered_dependency_shards.py' -v
          python -O -m unittest discover -s research/RHRC/integration/tests -p 'test_registered_dependency_shards.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-followup-frozen-regression
          path: /tmp/opica-followup-regression

      - name: Verify unchanged descendant source and exact baseline projection
        if: ${{ always() && steps.round2-ancestor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPICA_CURRENT_SOURCE_ROOT"
          python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$RUNNER_TEMP/opica2-baseline-scope/descendant-source-before.json"
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py verify --repo "$GITHUB_WORKSPACE" --destination "$OPICA_ANCESTOR_PROJECTION" > "$RUNNER_TEMP/opica2-baseline-scope/projection-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        with:
          name: opica_followup-baseline-source-scope-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/opica2-baseline-scope
          if-no-files-found: error

  followup-formal:
    name: followup-formal (${{ matrix.lane }})
    needs: followup-contract
    # Compile actual mathematics even when independent preflight metadata is
    # red. The failed preparation still remains a required failing gate.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [local, arithmetic, heat, spectral]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate current Round4 child before historical parent replay
        id: round4-parent-scope
        if: ${{ hashFiles('research/RHRC/integration/opica_round4/BUILD_MANIFEST.json') != '' }}
        shell: bash
        env:
          ROUND4_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # R4_PARENT_SCOPE_V1: inspect the actual child before unchanged historical guards.
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$ROUND4_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$evidence/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{commit}' || git fetch --no-tags origin fe16565b2a31fb8b68bef916ae8f04d535880e7a
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND4_PARENT_SCOPE_REPLAY=true' >> "$GITHUB_ENV"
      - name: Authenticate explicit Round2 ancestor projection (baseline scope only)
        id: round2-ancestor
        if: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          projection="$GITHUB_WORKSPACE/../opica2-frozen-$GITHUB_JOB"
          mkdir -p "$evidence"
          python -B research/RHRC/tools/run_suite.py --freeze-source "$evidence/descendant-source-before.json"
          git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$evidence/projection.json"
          python -B research/RHRC/integration/opica_followup/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$evidence/dispatch.json"
          printf '%s\n' "OPICA_ANCESTOR_PROJECTION=$projection" "OPICA_CURRENT_SOURCE_ROOT=$GITHUB_WORKSPACE" "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          report={'schema':'OPICA2_BASELINE_WORKFLOW_SCOPE_V1','workflow_checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseline_commit':'416aec21d4d6634675639b5397cc300d1f826e34','baseline_tree':'0506bca8ffe613e9cd9ab844650a1141d4494f66',
              'scope':'FROZEN_ANCESTOR_BASELINE_ONLY','current_tree_compatibility_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
          Path(os.environ['RUNNER_TEMP'],'opica2-baseline-scope','scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') == '' }}
          use-mathlib-cache: true
      - name: Compile the exact frozen target list for this lane
        env:
          OPICA_LANE: ${{ matrix.lane }}
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          mkdir -p /tmp/opica-current-candidates
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          manifest=Path(os.environ['FOLLOWUP'])/'BUILD_MANIFEST.json'
          targets=json.loads(manifest.read_bytes())['formal_lane_targets'][os.environ['OPICA_LANE']]
          command=['lake','build',*targets]
          with Path('/tmp/opica-current-candidates/lane-build.log').open('wb') as log:
              code=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT).returncode
          report={'lane':os.environ['OPICA_LANE'],'command':command,'exit_code':code,
              'checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checked_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'frozen_manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest()}
          Path('/tmp/opica-current-candidates/lane.json').write_text(json.dumps(report,indent=2)+'\n')
          raise SystemExit(code)
          PY
      - name: Check current modules, independent consumers and standard axioms
        if: ${{ matrix.lane == 'heat' }}
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python -B "$FOLLOWUP/continuation/2026-10-22/run_candidate_checks.py" --lake lake --output-dir /tmp/opica-current-candidates/narrow
      - name: W01 same-output word/jet compiler and standard-axiom check (narrow)
