name: PR294 isolated development environment - NOT ACCEPTANCE
on:
  push:
    branches: [repair/pr294-20261022]
    paths: [.github/workflows/rhrc_opica_followup.yml]
permissions:
  contents: read
jobs:
  development-environment:
    name: Prepare pinned dependency environment only - no new theorem claims
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Check pins and build inherited prerequisites
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr294-kit-evidence
          lake env lean --version | tee /tmp/pr294-kit-evidence/version.log
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 51e6992efd06126df61a496bebf8f49482a4e129
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc2
          git rev-parse HEAD HEAD^{tree} > /tmp/pr294-kit-evidence/checkout.txt
          lake build Zeta23.OPICAFollowup.Validation Zeta23.RHRC.OpicaTypeExprExport Zeta23.RHRC.SourceCandidateResolution Zeta23.OPICA.NativeJetAdapter Zeta23.OPICA.WeightedLaplace Zeta23.ExceptionalZero.ZetaRealStripNonvanishing 2>&1 | tee /tmp/pr294-kit-evidence/build.log
      - name: Package pinned development dependencies in bounded chunks
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr294-kit /tmp/pr294-parts
          TOOLCHAIN=$(dirname "$(dirname "$(elan which lean)")")
          test -x "$TOOLCHAIN/bin/lean"
          ln -s "$GITHUB_WORKSPACE" /tmp/pr294-kit/repo
          ln -s "$TOOLCHAIN" /tmp/pr294-kit/toolchain
          cp -a /tmp/pr294-kit-evidence /tmp/pr294-kit/evidence
          tar --dereference -cf - -C /tmp/pr294-kit repo toolchain evidence | zstd -T2 -3 | split -b 450M -d - /tmp/pr294-parts/environment.tar.zst.part-
          (cd /tmp/pr294-parts && sha256sum environment.tar.zst.part-*) > /tmp/pr294-kit-evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr294-development-evidence
          path: /tmp/pr294-kit-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr294-development-part-00
          path: /tmp/pr294-parts/environment.tar.zst.part-00
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr294-development-part-01
          path: /tmp/pr294-parts/environment.tar.zst.part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
