          python-version: '3.13.5'
      - name: Reject every missing, failed, skipped, canceled or unfinished required child lane
        env:
          REQUIRED_NEEDS: ${{ toJSON(needs) }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${OPICA_ANCESTOR_PROJECTION:-}" ]; then
            set -euo pipefail
            if [ -d "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" ] && [ ! -e "$OPICA_ANCESTOR_PROJECTION/.lake/packages" ]; then
              mkdir -p "$OPICA_ANCESTOR_PROJECTION/.lake"
              ln -s "$OPICA_CURRENT_SOURCE_ROOT/.lake/packages" "$OPICA_ANCESTOR_PROJECTION/.lake/packages"
            fi
            cd "$OPICA_ANCESTOR_PROJECTION"
            export REQUESTED_HEAD="$(git rev-parse HEAD)"
          fi
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          expected={'followup-contract','followup-regression','followup-formal','followup-aggregate','followup-generated','followup-research-delta'}
          needs=json.loads(os.environ['REQUIRED_NEEDS'])
          if set(needs)!=expected or any(v.get('result')!='success' for v in needs.values()):
              raise SystemExit('Required child gate missing or unsuccessful: '+json.dumps(needs,sort_keys=True))
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if head!=os.environ['REQUESTED_HEAD']:
              raise SystemExit('Summary checked a different head')
          report={'status':'PASS_REQUIRED_CHILD_LANES_POST_COMPLETION_RELEASE_REVIEW_REQUIRED',
              'checked_commit':head,'checked_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'needs':needs,'full_release_accepted':False,'workflow_harvest':'REQUIRES_SEPARATE_COMPLETED_ALL_JOB_REVIEW',
              'independent_human_review':'NOT_ESTABLISHED','RH':'OPEN','Step4':'OPEN','independent_closing_inequalities':'OPEN'}
          Path('/tmp/opica-followup-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-followup-summary
          path: /tmp/opica-followup-summary.json
      - name: Verify unchanged descendant source and exact baseline projection
        if: ${{ always() && steps.round2-ancestor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPICA_CURRENT_SOURCE_ROOT"
          python -B research/RHRC/tools/run_suite.py --verify-source-freeze "$RUNNER_TEMP/opica2-baseline-scope/descendant-source-before.json"
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py verify --repo "$GITHUB_WORKSPACE" --destination "$OPICA_ANCESTOR_PROJECTION" > "$RUNNER_TEMP/opica2-baseline-scope/projection-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        with:
          name: opica_followup-baseline-source-scope-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/opica2-baseline-scope
          if-no-files-found: error
