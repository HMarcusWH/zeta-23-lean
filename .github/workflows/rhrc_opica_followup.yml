  followup-aggregate:
    name: followup-aggregate
    needs: [followup-contract, followup-regression, followup-formal]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate current Round4 child before historical parent replay
        id: round4-parent-scope
        if: ${{ hashFiles('research/RHRC/integration/opica_round4/BUILD_MANIFEST.json') != '' }}
        shell: bash
        env:
          ROUND4_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # R4_PARENT_SCOPE_V1: inspect the actual child before unchanged historical guards.
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$ROUND4_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          round4_child_head=$(git rev-parse HEAD)
          round4_child_tree=$(git rev-parse 'HEAD^{tree}')
          python -B -m research.RHRC.integration.opica_composition.cli inspect --repo . --output "$evidence/current-round4-source-scope.json"
          test "$(git rev-parse HEAD)" = "$round4_child_head"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{commit}' || git fetch --no-tags origin fe16565b2a31fb8b68bef916ae8f04d535880e7a
          test "$(git rev-parse 'fe16565b2a31fb8b68bef916ae8f04d535880e7a^{tree}')" = 5442650eb749576e4a82e2d57460a4b97e19b5a9
          git checkout --detach fe16565b2a31fb8b68bef916ae8f04d535880e7a
          printf '%s\n' 'REQUESTED_HEAD=fe16565b2a31fb8b68bef916ae8f04d535880e7a' "REQUESTED_ROUND4_CHILD_HEAD=$round4_child_head" "REQUESTED_ROUND4_CHILD_TREE=$round4_child_tree" 'ROUND4_PARENT_SCOPE_REPLAY=true' >> "$GITHUB_ENV"
      - name: Authenticate explicit Round2 ancestor projection (baseline scope only)
        id: round2-ancestor
        if: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/opica2-baseline-scope"
          projection="$GITHUB_WORKSPACE/../opica2-frozen-$GITHUB_JOB"
          mkdir -p "$evidence"
          python -B research/RHRC/tools/run_suite.py --freeze-source "$evidence/descendant-source-before.json"
          git cat-file -e '416aec21d4d6634675639b5397cc300d1f826e34^{commit}' || git fetch --no-tags origin 416aec21d4d6634675639b5397cc300d1f826e34
          python -B research/RHRC/integration/opica_round2/ancestor_projection.py create --repo "$GITHUB_WORKSPACE" --destination "$projection" > "$evidence/projection.json"
          python -B research/RHRC/integration/opica_followup/validate_contract.py --phase preflight --ancestor-projection "$projection" --output "$evidence/dispatch.json"
          printf '%s\n' "OPICA_ANCESTOR_PROJECTION=$projection" "OPICA_CURRENT_SOURCE_ROOT=$GITHUB_WORKSPACE" "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          report={'schema':'OPICA2_BASELINE_WORKFLOW_SCOPE_V1','workflow_checked_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseline_commit':'416aec21d4d6634675639b5397cc300d1f826e34','baseline_tree':'0506bca8ffe613e9cd9ab844650a1141d4494f66',
              'scope':'FROZEN_ANCESTOR_BASELINE_ONLY','current_tree_compatibility_accepted':False,'full_release_accepted':False,'RH':'OPEN','Step4':'OPEN'}
          Path(os.environ['RUNNER_TEMP'],'opica2-baseline-scope','scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: ${{ hashFiles('research/RHRC/integration/opica_round2/DESCENDANT_EXTENSION.json') == '' }}
          use-mathlib-cache: true
      - name: Compile every original final target at the clean requested head
