name: OPICA historical support native candidate
on:
  push:
    branches: [research/opica-historical-support-port-20261123]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: opica-support-port-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B research/RHRC/integration/opica_support_port/check_candidate.py --receipt "$RUNNER_TEMP/support-source.json"
      - run: python3 -B research/RHRC/integration/opica_support_port/check_candidate.py --check-classification
      - run: cd research/RHRC/integration/opica_support_port/ && python3 -B -m unittest -v test_candidate
      - run: cd research/RHRC/integration/opica_support_port/ && python3 -O -B -m unittest -v test_candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-support-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/support-source.json
          if-no-files-found: error
  native-candidate:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - run: python3 -B research/RHRC/integration/opica_support_port/check_candidate.py --build "$RUNNER_TEMP/opica-support-port"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-support-port-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opica-support-port/
          if-no-files-found: warn
          retention-days: 90
  independent-candidate:
    needs: native-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: host
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HMarcusWH/riemann-hypothesis
          ref: 5601d19ff185d58376e109d82dd4512488295372
          path: checker-tools
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: host
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Fresh pinned independent checker
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/support-checker-venv"
          "$RUNNER_TEMP/support-checker-venv/bin/python" -m pip install -r checker-tools/verification/opica-v436/requirements.txt
          "$RUNNER_TEMP/support-checker-venv/bin/python" checker-tools/verification/opica-v436/bootstrap_checker.py --work "$RUNNER_TEMP/support-checker" --timeout 2400 --memory-mib 6000
      - name: Rebuild and independently check the exact 201 selected roots
        working-directory: host
        run: |
          set -euo pipefail
          python3 -B research/RHRC/integration/opica_support_port/check_candidate.py --build "$RUNNER_TEMP/opica-support-independent" --checker-work "$RUNNER_TEMP/support-checker" --checker-code "$GITHUB_WORKSPACE/checker-tools/verification/opica-v436"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-support-independent-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/opica-support-independent/
            ${{ runner.temp }}/support-checker/BOOTSTRAP_RECEIPT.json
          if-no-files-found: warn
          retention-days: 90

  historical-type-export:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: host
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7597acdba0c7d0a81b8c3a5f229598e3f9b74ac9
          fetch-depth: 0
          persist-credentials: false
          path: historical
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HMarcusWH/riemann-hypothesis
          ref: acb5b817a6b174bf0fff35da9957a28b914ab888
          path: common-lock
          persist-credentials: false
      - name: Reconstruct exact historical support sources at common pin
        working-directory: host
        run: |
          python3 -B research/RHRC/integration/opica_support_port/check_candidate.py \
            --prepare-historical "$GITHUB_WORKSPACE/historical" \
            "$GITHUB_WORKSPACE/common-lock/opica-step4/native_bootstrap/lake-manifest.json" \
            "$RUNNER_TEMP/historical-input.json"
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: historical
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compile and export all 167 original common-pin types
        working-directory: host
        run: |
          python3 -B research/RHRC/integration/opica_support_port/check_candidate.py \
            --historical-types "$GITHUB_WORKSPACE/historical" "$RUNNER_TEMP/historical-input.json" "$RUNNER_TEMP/historical-types"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-support-historical-types-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/historical-input.json
            ${{ runner.temp }}/historical-types/
          if-no-files-found: warn
          retention-days: 90
  cross-pin-type-comparison:
    needs: [native-candidate, independent-candidate, historical-type-export]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opica-support-port-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opica-support-independent-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/independent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opica-support-historical-types-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical
      - name: Require same exact native and historical compiler root types
        run: |
          python3 -B research/RHRC/integration/opica_support_port/check_candidate.py \
            --compare-types "$RUNNER_TEMP/native" "$RUNNER_TEMP/independent/opica-support-independent" \
            "$RUNNER_TEMP/historical/historical-types" "$RUNNER_TEMP/cross-pin-type-comparison.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-support-cross-pin-comparison-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cross-pin-type-comparison.json
          if-no-files-found: warn
          retention-days: 90

  review-old-receipts:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact old compiler and independent receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          def need(x,msg):
              if not x:raise RuntimeError(msg)
          repo="HMarcusWH/zeta-23-lean";base=pathlib.Path(os.environ["RUNNER_TEMP"])/"old-support";base.mkdir()
          def api(path):return json.loads(subprocess.check_output(["gh","api",path]))
          run=api("repos/"+repo+"/actions/runs/45409686092")
          need(run["head_sha"]=="983b6e78eccf9156ee7e2ec55f6772bd64cedccd" and run["path"].split("@")[0]==".github/workflows/opica-historical-support-port.yml" and run["run_attempt"]==1 and run["repository"]["full_name"]==repo,"Wrong evidence run")
          jobs=api("repos/"+repo+"/actions/runs/45409686092/attempts/1/jobs?per_page=100")["jobs"]
          for label,jname,ident,sha,filename in [
            ("native","native-candidate",14938505029,"b08467d8de1c18856d93a6b15fffb7e0740499164d167950aab9ba8a69b56968","NATIVE_TYPE_CANDIDATES.json"),
            ("independent","independent-candidate",14944915024,"e6c76e76f2616d7c77f0b4a070d7f3836d4ef6ea9daf878de7c2a9e8b74f731c","NATIVE_TYPE_CANDIDATES.json"),
            ("historical","historical-type-export",14931574995,"19de0c6c2d633111775c3925aa53aab27a3b703417f341dd0852c1671928a40d","HISTORICAL_TYPE_CANDIDATES.json")]:
              need(sum(j["name"]==jname and j["conclusion"]=="success" for j in jobs)==1,"Producer not successful")
              meta=api(f"repos/{repo}/actions/artifacts/{ident}")
              need(meta["workflow_run"]["id"]==run["id"] and meta["digest"]=="sha256:"+sha and not meta["expired"],"Artifact identity")
              p=base/(label+".zip")
              with p.open("wb") as f:subprocess.run(["gh","api",f"repos/{repo}/actions/artifacts/{ident}/zip"],stdout=f,check=True,timeout=300)
              need(hashlib.sha256(p.read_bytes()).hexdigest()==sha,"Archive digest")
              dest=base/label;dest.mkdir()
              with zipfile.ZipFile(p) as z:
                  for leaf in ("receipt.json",filename):
                      matches=[n for n in z.namelist() if pathlib.PurePosixPath(n).name==leaf]
                      need(len(matches)==1,"Ambiguous member")
                      (dest/leaf).write_bytes(z.read(matches[0]))
          PY
          python3 -B research/RHRC/integration/opica_support_port/check_candidate.py --compare-reviewed-old "$RUNNER_TEMP/old-support/native" "$RUNNER_TEMP/old-support/independent" "$RUNNER_TEMP/old-support/historical" "$RUNNER_TEMP/reviewed-old-cross-pin-type-comparison.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-support-reviewed-old-comparison-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-old-cross-pin-type-comparison.json
          if-no-files-found: warn
          retention-days: 90
  canonical-candidate:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - run: python3 -B research/RHRC/integration/opica_support_port/check_candidate.py --canonical-candidate "$RUNNER_TEMP/historical-canonical"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-support-canonical-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-canonical/
          if-no-files-found: warn
          retention-days: 90
