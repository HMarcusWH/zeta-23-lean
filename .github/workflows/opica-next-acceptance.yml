# Registration only. GitHub evaluates the workflow version at the selected ref.
# Never run research or interpret a default-branch dispatch as qualification.
name: OPICA exact next-source admission and original coordinator probe
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select a reviewed non-promoting execution
        required: true
        type: choice
        options: [source, canonical, type-review, signed-targets, scalar-targets]
        default: source
      reviewed_head:
        description: Exact selected commit (required for heavy execution)
        required: true
        type: string
      parent_run:
        description: Exact successful combined-source parent run ID (signed-targets only)
        required: false
        type: string
      round4_run:
        description: Exact successful full Round4 successor run ID (signed-targets only)
        required: false
        type: string
      type_run:
        description: Exact successful dual compiler type-review run ID (required for scalar/expanded targets)
        required: false
        type: string
permissions:
  contents: read
jobs:
  registration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse execution of the registration-only workflow
        shell: bash
        run: |
          echo 'REGISTRATION_ONLY; NO_PROOF_ACCEPTANCE'
          echo 'Select the separately reviewed branch: research/opica-next-acceptance-v2-20261123'
          echo 'RH OPEN; C1 OPEN; Step4 OPEN'
          exit 2
