name: OPICA exact next-source admission and original coordinator probe
on:
  push:
    branches: [research/opica-next-acceptance-v2-20261123]
    paths:
      - .github/workflows/opica-next-acceptance.yml
      - research/RHRC/integration/opica_next_acceptance/**
      - research/RHRC/integration/opica_composition/cli.py
      - research/RHRC/integration/opica_composition/service.py
      - research/RHRC/integration/opica_composition/qualification.py
      - .github/workflows/rhrc_opica_composition.yml
      - .github/workflows/documentation.yml
      - research/RHRC/graph/compiler/registered_dependencies/**
      - research/RHRC/graph/generated/**
      - research/RHRC/integration/generated/**
      - research/RHRC/ffbbp/generated/**
      - research/RHRC/ool/generated/**
      - research/RHRC/graph/FILE_CLASSES.json
  workflow_dispatch:
    inputs:
      mode:
        description: Select a reviewed non-promoting execution
        required: true
        type: choice
        options: [source, canonical, signed-targets]
        default: source
      reviewed_head:
        description: Exact selected commit (required for heavy execution)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: opica-source-acceptance-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact sealed successor, approved target registry and no proof claim
        run: |
          set -euo pipefail
          CURRENT_STAGE=SOURCE_SCOPE
          record_outcome() {
            result=$?
            trap - EXIT
            printf '{"schema":"OPICA_NEXT_ADMISSION_JOB_OUTCOME_V1","checked_head":"%s","failed_or_completed_stage":"%s","exit_code":%s,"proof_acceptance":false,"RH":"OPEN","C1":"OPEN","Step4":"OPEN"}\n' \
              "$GITHUB_SHA" "$CURRENT_STAGE" "$result" >"$RUNNER_TEMP/OPICA_NEXT_JOB_OUTCOME.json"
            exit "$result"
          }
          trap record_outcome EXIT
          export PYTHONPATH="$PWD"
          python3 -B -m research.RHRC.integration.opica_next_acceptance.gate \
            --output "$RUNNER_TEMP/OPICA_NEXT_ADMISSION.json"
          CURRENT_STAGE=TESTS_NORMAL
          python3 -B -m unittest -v research.RHRC.integration.opica_next_acceptance.test_gate
          CURRENT_STAGE=TESTS_OPTIMIZED
          python3 -O -B -m unittest -v research.RHRC.integration.opica_next_acceptance.test_gate
          CURRENT_STAGE=EXACT_CLASSIFICATION
          python3 -B -m research.RHRC.integration.opica_next_acceptance.gate \
            --check-classification
          CURRENT_STAGE=ORIGINAL_COORDINATOR_INSPECTION
          python3 -B -m research.RHRC.integration.opica_composition.cli \
            inspect --repo "$PWD" --output "$RUNNER_TEMP/OPICA_NEXT_CLI_INSPECTION.json"
          CURRENT_STAGE=RECEIPT_CLAIM_FIREWALL
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"OPICA_NEXT_CLI_INSPECTION.json").read_text())
          if (r.get("schema")!="OPICA_NEXT_SOURCE_ACCEPTANCE_ADMISSION_V1"
              or r.get("status")!="PASS_SOURCE_SCOPE_ONLY"
              or r.get("full_round4_accepted") is not False
              or r.get("proof_acceptance") is not False
              or any(r.get(k)!="OPEN" for k in ("RH","C1","Step4"))):
              raise SystemExit("INVALID_CURRENT_SOURCE_CLAIM_DISPOSITION")
          print("SOURCE_ADMITTED_FOR_NEW_11_LANE_REPLAY_ONLY",r["checked_commit"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-next-proof-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/OPICA_NEXT_ADMISSION.json
            ${{ runner.temp }}/OPICA_NEXT_CLI_INSPECTION.json
            ${{ runner.temp }}/OPICA_NEXT_JOB_OUTCOME.json
          if-no-files-found: warn
  canonical-candidate:
    if: ${{ github.repository == 'HMarcusWH/zeta-23-lean' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[run-canonical]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'canonical' && inputs.reviewed_head == github.sha)) }}
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: host
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: ./host/.github/actions/opica4-runtime
        with:
          native: 'true'
          provider: 'false'
      - name: Export scalar expected-type candidates for separate independent review
        working-directory: host
        run: |
          set -euo pipefail
          python3 -B -m research.RHRC.integration.opica_next_acceptance.targets \
            --scalar-candidate --output "$RUNNER_TEMP/OPICA_SCALAR_TYPE_CANDIDATE.json"
      - name: Generate only 77 active products on the exact successor tree
        working-directory: host
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from research.RHRC.integration.opica_next_acceptance.gate import check
          from research.RHRC.integration.opica_next_epoch.scope import canonical_candidate
          r=check(require_clean=True)
          canonical_candidate(Path(os.environ["RUNNER_TEMP"])/"OPICA_SUCCESSOR_CANONICAL",
                              r["checked_commit"],r["checked_tree"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-successor-canonical-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/OPICA_SUCCESSOR_CANONICAL/
            ${{ runner.temp }}/OPICA_SCALAR_TYPE_CANDIDATE.json
            ${{ runner.temp }}/opica4-native/bootstrap/result.json
            ${{ runner.temp }}/opica4-source-before.json
          compression-level: 0
          if-no-files-found: warn
  governed-signed-targets:
    if: ${{ github.repository == 'HMarcusWH/zeta-23-lean' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[run-next-targets]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'signed-targets' && inputs.reviewed_head == github.sha)) }}
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [NEXT_POSITIVE_RAW_SUBPOWER, NEXT_NEGATIVE_RAW_SUBPOWER, NEXT_ONE_POLARITY_RAW_SUBPOWER]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: host
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: ./host/.github/actions/opica4-runtime
        with:
          native: 'true'
          provider: 'false'
      - name: Refuse stale canonical state before any governed attempt
        working-directory: host
        run: |
          set -euo pipefail
          python3 -B research/RHRC/tools/materialize_derived_state.py --check \
            >"$RUNNER_TEMP/OPICA_PROOF_CANONICAL_CHECK.log" 2>&1
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run actual freeze inventory plan kernel attempt verify replay export
        working-directory: host
        shell: bash
        env:
          TARGET_ID: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect --unit="opica-next-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=4294967296 -p MemorySwapMax=0 -p TasksMax=64 -p CPUQuota=200% \
            -p "WorkingDirectory=$PWD" /usr/bin/env \
            "PATH=$PATH" "HOME=$HOME" PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 LEAN_NUM_THREADS=2 \
            "OPICA_NATIVE_OUTPUT=$OPICA_NATIVE_OUTPUT" "OPICA_NATIVE_CONFIG=$OPICA_NATIVE_CONFIG" \
            python3 -B -m research.RHRC.integration.opica_next_acceptance.targets \
              --target "$TARGET_ID" --reviewed-head "$GITHUB_SHA" \
              --output "$OPICA_NATIVE_OUTPUT/next-target-campaign"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-next-target-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/opica4-native/next-target-campaign/
            ${{ runner.temp }}/OPICA_PROOF_CANONICAL_CHECK.log
          compression-level: 0
          if-no-files-found: warn
