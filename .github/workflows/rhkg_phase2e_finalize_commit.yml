name: RHKG Phase 2E finalize dependency projections

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize-phase2e:
    if: github.head_ref == 'rhkg/phase2e-theorem-value-erasure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove one-shot finalizer from final graph subject
        run: git rm .github/workflows/rhkg_phase2e_finalize_commit.yml
      - name: Run RHKG unit tests
        run: python -m unittest discover -s research/RHRC/graph/tests -p 'test_*.py' -v
      - name: Regenerate Phase 2E deterministic products
        run: |
          python research/RHRC/graph/build.py --write
          python research/RHRC/graph/validate.py
      - name: Assert Phase 2E baseline and firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          g = Path('research/RHRC/graph/generated')
          old_atoms = json.loads((g / 'DEPENDENCY_COHORT_ATOMS.json').read_text())
          old_frontiers = json.loads((g / 'DEPENDENCY_BRIDGE_FRONTIERS.json').read_text())
          summary = json.loads((g / 'DEPENDENCY_PROJECTION_SUMMARY.json').read_text())
          quotients = json.loads((g / 'DEPENDENCY_PROJECTION_QUOTIENTS.json').read_text())
          frontiers = json.loads((g / 'DEPENDENCY_PROJECTION_FRONTIERS.json').read_text())
          coverage = json.loads((g / 'REPOSITORY_COVERAGE.json').read_text())
          unresolved = json.loads((g / 'UNRESOLVED_GRAPH_ITEMS.json').read_text())

          assert summary['schema_version'] == 'RHKG-phase2e-dependency-projection-summary-0.7'
          assert quotients['schema_version'] == 'RHKG-phase2e-dependency-projection-quotients-0.7'
          assert frontiers['schema_version'] == 'RHKG-phase2e-dependency-projection-frontiers-0.7'
          names = {row['projection'] for row in quotients['projections']}
          assert names == {'ANY', 'TYPE_ONLY', 'VALUE_ONLY', 'THEOREM_VALUE_ERASED_SUPPORT'}

          any_q = next(row for row in quotients['projections'] if row['projection'] == 'ANY')
          counts = {row['signature']: row['count'] for row in any_q['atoms']}
          assert counts == {'A': 12, 'B': 78, 'C': 72, 'AB': 0, 'AC': 0, 'BC': 1463, 'ABC': 599}
          assert any_q['union_count'] == 2224

          any_f = next(row for row in frontiers['projections'] if row['projection'] == 'ANY')
          assert any_f['cross_atom_edge_count'] == 1026
          pair = any_f['pair_probe']
          assert pair['relation'] == 'LEFT_STRICT_SUBSET'
          assert pair['left_count'] == 224
          assert pair['right_count'] == 2659
          assert pair['left_only_count'] == 0
          assert pair['right_only_count'] == 2435
          assert pair['cross_region_edge_count'] == 972
          assert pair['eligible_cross_region_edge_count'] == 949

          assert old_atoms['union_count'] == any_q['union_count']
          assert old_frontiers['cross_atom_edge_count'] == any_f['cross_atom_edge_count']
          for product in (summary, quotients, frontiers):
              assert product['terminal_claim'] == 'RH_OPEN'
              assert product['graph_theorem_promotion'] is False
          assert coverage['schema_version'] == 'RHKG-phase2e-coverage-0.7'
          assert coverage['terminal_claim'] == 'RH_OPEN'
          assert unresolved['schema_version'] == 'RHKG-phase2e-unresolved-0.7'
          assert unresolved['claim_firewall'] == 'RH_OPEN'

          for projection in ('TYPE_ONLY', 'VALUE_ONLY', 'THEOREM_VALUE_ERASED_SUPPORT'):
              q = next(row for row in quotients['projections'] if row['projection'] == projection)
              f = next(row for row in frontiers['projections'] if row['projection'] == projection)
              atom_counts = {row['signature']: row['count'] for row in q['atoms']}
              print(projection, 'union=', q['union_count'], 'atoms=', atom_counts)
              print(projection, 'cross_atom_edges=', f['cross_atom_edge_count'], 'pair=', f['pair_probe']['relation'], f['pair_probe']['left_count'], f['pair_probe']['right_count'])

          print('RHKG Phase 2E projection assertions: PASS')
          PY
      - name: Commit generated products and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/RHRC/graph/generated
          if git diff --cached --quiet; then
            echo "No Phase 2E finalization changes to commit."
            exit 0
          fi
          git commit -m "RHKG Phase 2E: materialize dependency projections"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
