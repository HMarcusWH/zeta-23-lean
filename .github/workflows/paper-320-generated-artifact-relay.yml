name: Independently verify the #320 generated-state archive

on:
  push:
    branches: [workmode/paper-320-generated-artifact-relay]
    paths: [.github/workflows/paper-320-generated-artifact-relay.yml]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 69ce27c51122e92e2046f7b44dcf51ca8ac644bb
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate the archive and report only reviewed Git metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '15166442043'
          ARTIFACT_SHA256: 'c19847d2b8332112d461cefa669c9764301214e022d2949fb4964385178e59fc'
          EXPECTED_PRODUCTS: '8'
          REQUIRED_PATHS: '["research/RHRC/ffbbp/generated/RHKG_CANDIDATE_REDUCTION_ASSURANCE.json","research/RHRC/graph/generated/REPOSITORY_COVERAGE.json","research/RHRC/graph/generated/registry_nodes.jsonl","research/RHRC/graph/generated/repository_files.jsonl","research/RHRC/integration/generated/RH_CORE_SOURCE_ONLY_THEOREMS.jsonl","research/RHRC/integration/generated/SOURCE_CANDIDATE_RESOLUTION.jsonl","research/RHRC/integration/generated/SOURCE_CANDIDATE_SUMMARY.json","research/RHRC/ool/generated/RHKG_OOL_PHASE_ATLAS.json"]'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HMarcusWH/zeta-23-lean
          test "$(git rev-parse HEAD)" = 69ce27c51122e92e2046f7b44dcf51ca8ac644bb
          test "$(git rev-parse 'HEAD^{tree}')" = 5cecf0cffa5110ee354b725f829cb7e4c4be46c8
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/45914173967/attempts/1" --jq '.status + ":" + .conclusion + ":" + .head_sha')" = completed:success:69ce27c51122e92e2046f7b44dcf51ca8ac644bb
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact.zip"
          python3 -B - <<'PY'
          from hashlib import sha256
          from io import BytesIO
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          from zipfile import ZipFile

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(*args, data=None):
              return subprocess.run(["git", *args], check=True, input=data,
                                    stdout=subprocess.PIPE).stdout

          runner = Path(os.environ["RUNNER_TEMP"])
          head = "69ce27c51122e92e2046f7b44dcf51ca8ac644bb"
          tree = "5cecf0cffa5110ee354b725f829cb7e4c4be46c8"
          archive_name = "documentation-canonical-45914173967-1"
          pinned_id = int(os.environ["ARTIFACT_ID"])
          pinned_sha256 = os.environ["ARTIFACT_SHA256"]
          require(re.fullmatch("[a-f0-9]{64}", pinned_sha256), "Missing archive digest pin")
          info = json.loads((runner / "artifact.json").read_text(encoding="utf-8"))
          run = info["workflow_run"]
          require((info["name"], info["id"], info["digest"], info["expired"]) ==
                  (archive_name, pinned_id, "sha256:" + pinned_sha256, False), "Unexpected artifact metadata")
          require((run["id"], run["head_sha"], run["head_branch"], run["head_repository_id"]) ==
                  (45914173967, head, "docs/papers-2026-11-26-terminal", 1339954300), "Unexpected run/source")
          archive = (runner / "artifact.zip").read_bytes()
          require(len(archive) == info["size_in_bytes"] and len(archive) <= 4_000_000 and
                  sha256(archive).hexdigest() == pinned_sha256, "Archive bytes differ")

          entries = {"input-head-tree.txt", "source-scope.json", "lean-version.txt", "exporter-build.log",
                     "materialize.log", "canonical-check.log", "generated-state.patch", "generated-stat.txt",
                     "generated-state.patch.sha256"}
          with ZipFile(BytesIO(archive)) as zipped:
              contents = zipped.infolist()
              require(set(zipped.namelist()) == entries and len(contents) == len(entries),
                      "Unexpected artifact inventory")
              require(sum(item.file_size for item in contents) <= 128_000_000, "Artifact expanded size too large")
              for item in contents:
                  mode = (item.external_attr >> 16) & 0o170000
                  path = PurePosixPath(item.filename)
                  require(len(path.parts) == 1 and mode in (0, stat.S_IFREG) and not item.is_dir(),
                          "Nonregular artifact entry")
              require(zipped.read("input-head-tree.txt").decode("ascii").splitlines() == [head, tree],
                      "Artifact head/tree mismatch")
              receipt = json.loads(zipped.read("source-scope.json"))
              require((receipt["checked_commit"], receipt["checked_tree"], receipt["status"]) ==
                      (head, tree, "PASS_SOURCE_SCOPE_ONLY"), "Artifact scope receipt mismatch")
              require(b"RHRC DERIVED STATE: PASS" in zipped.read("canonical-check.log"), "Missing canonical check")
              patch = zipped.read("generated-state.patch")
              patch_digest = sha256(patch).hexdigest()
              require(zipped.read("generated-state.patch.sha256").decode("ascii").split() ==
                      [patch_digest, "generated-state.patch"], "Generated patch digest differs")

          inherited = json.loads(Path(
              "research/RHRC/integration/documentation_2026_11_21/SOURCE_SCOPE.json"
          ).read_text(encoding="utf-8"))
          allowed = set(inherited["generated"])
          require(len(allowed) == 77 and not git("status", "--porcelain", "--untracked-files=all"),
                  "Wrong checkout inventory")
          require(bool(patch) and len(patch) <= 110_000_000, "Missing or oversized generated patch")
          git("apply", "--check", "--index", "-", data=patch)
          git("apply", "--index", "-", data=patch)
          git("diff", "--cached", "--check")
          paths = git("diff", "--cached", "--name-only", "-z", "HEAD").decode("utf-8").strip("\0").split("\0")
          modified = git("diff", "--cached", "--name-only", "-z", "--diff-filter=M", "HEAD").decode("utf-8").strip("\0").split("\0")
          require(bool(paths) and set(paths) == set(modified) and set(paths) <= allowed and
                  not git("diff", "--cached", "--summary"), "Unexpected generated patch scope or file type")

          inventory = Path("research/RHRC/graph/generated/repository_files.jsonl")
          byte_policy = json.loads(Path(
              "research/RHRC/integration/documentation_2026_11_26/ARCHIVE_BYTES.json"
          ).read_text(encoding="utf-8"))
          expected_pdfs = {p: item["git_blob"] for p, item in byte_policy["added"].items()
                           if item["file_kind"] == "BINARY_PDF"}
          require(len(expected_pdfs) == 6, "Paper byte policy must name six binary subjects")
          observed_pdfs = {}
          with inventory.open(encoding="utf-8") as stream:
              for line in stream:
                  row = json.loads(line)
                  if row.get("classification_rule") == "research_archive_2026_11_26_papers":
                      require((row["type"], row["file_class"], row["trust_zone"], row["generated_product"]) ==
                              ("RepoFile", "RESEARCH_FIXTURE", "AUDIT_ONLY", False),
                              "Paper mistaken for a generated or authority-bearing record")
                      require(row["path"] not in observed_pdfs, "Duplicate archived paper record")
                      observed_pdfs[row["path"]] = row["git_blob"]
          require(observed_pdfs == expected_pdfs, "Generated paper records disagree with exact binary inventory")
          require(len(paths) == int(os.environ["EXPECTED_PRODUCTS"]), "Product count differs from successful producer")
          required = set(json.loads(os.environ["REQUIRED_PATHS"]))
          require(required <= set(paths), "Known stale products are missing from the candidate")
          shards = []
          parent_records = git("diff", "--cached", "--raw", "--no-abbrev", "-z", "HEAD").split(b"\0")
          require(len(parent_records) == 2 * len(paths) + 1, "Invalid raw Git diff inventory")
          for i in range(0, len(parent_records) - 1, 2):
              mode_old, mode_new, blob_old, blob_new, status = parent_records[i].decode("ascii").split()
              path = parent_records[i + 1].decode("utf-8")
              require((mode_old, mode_new, status) == (":100644", "100644", "M") and path in allowed,
                      "Review patch modifies a nonregular product")
              require(re.fullmatch("[a-f0-9]{40}", blob_old) and re.fullmatch("[a-f0-9]{40}", blob_new)
                      and blob_old != blob_new, "Invalid before/after Git blob pair")
              staged = git("cat-file", "blob", ":" + path)
              require(bool(staged) and b"\0" not in staged, "Generated product is empty or binary")
              shards.append({"path": path, "before_git_blob": blob_old, "after_git_blob": blob_new,
                             "sha256": sha256(staged).hexdigest(), "bytes_after": len(staged)})
          metadata = {"source_head": head, "source_tree": tree, "run": run["id"], "attempt": 1,
                      "artifact": pinned_id, "zip_sha256": pinned_sha256, "patch_sha256": patch_digest,
                      "patch_bytes": len(patch), "candidate_tree": git("write-tree").decode().strip(),
                      "paths": sorted(paths), "products": shards, "verified_binary_papers": len(observed_pdfs),
                      "proof_acceptance": False}
          print("PAPER320_REVIEW_META " + json.dumps(metadata, sort_keys=True))
          PY
