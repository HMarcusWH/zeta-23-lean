name: RHRC closure campaign steady-state materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  actions: write

concurrency:
  group: rhrc-closure-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'research/rh-closure-parallel-campaign' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RHRC and R003 requirements
        run: |
          python -m pip install -r research/RHRC/requirements.txt
          python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Formal closure preflight
        run: |
          lake build \
            Zeta23.CCM.SourceContraction \
            Zeta23.CCM.SourceContractionLocalized \
            Zeta23.CCM.CanonicalArchUpperBound \
            Zeta23.CCM.CanonicalPoleUniformBound \
            Zeta23.CCM.CanonicalPoleSourceBound \
            Zeta23.CCM.CanonicalSmallApertureCoercivity \
            Zeta23.CCM.CanonicalPrimeSeamTaylor \
            Zeta23.CCM.ParityGroundPerturbation \
            Zeta23.CCM.ParityRayleighPerturbation \
            Zeta23.CCM.CanonicalSeamGroundTransfer \
            Zeta23.CCM.GroundComparisonPrinciple \
            Zeta23.CCM.CanonicalGroundPropagation \
            Zeta23.CCM.CanonicalAllAperturePositivity \
            Zeta23.CCM.CanonicalSchurCertificate \
            Zeta23.CCM.CanonicalModeTailBound \
            Zeta23.CCM.CanonicalUniformDomination \
            Zeta23.CCM.CanonicalFullSpaceSourceBridge \
            Zeta23.Spectral \
            Zeta23.ExceptionalZero.QuantitativeDetectorFamily \
            Zeta23.ExceptionalZero.QuantitativeCanonicalWitness \
            Zeta23.RHRC.ClosureObligationBindings
          python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope closure
          python research/RHRC/tools/axiom_audit.py \
            Zeta23/CCM/CanonicalArchUpperBound.lean \
            Zeta23/CCM/CanonicalFullSpaceSourceBridge.lean \
            Zeta23/CCM/CanonicalModeTailBound.lean \
            Zeta23/CCM/CanonicalPoleSourceBound.lean \
            Zeta23/CCM/CanonicalPrimeSeamTaylor.lean \
            Zeta23/CCM/CanonicalSchurCertificate.lean \
            Zeta23/CCM/CanonicalSeamGroundTransfer.lean \
            Zeta23/CCM/CanonicalSmallApertureCoercivity.lean \
            Zeta23/CCM/CanonicalUniformDomination.lean \
            Zeta23/CCM/GroundComparisonPrinciple.lean \
            Zeta23/CCM/ParityRayleighPerturbation.lean \
            Zeta23/CCM/SourceContraction.lean \
            Zeta23/CCM/SourceContractionLocalized.lean \
            Zeta23/ExceptionalZero/QuantitativeDetectorFamily.lean \
            Zeta23/RHRC/ClosureObligationBindings.lean \
            Zeta23/Spectral/CanonicalCharacteristic.lean \
            Zeta23/Spectral/CanonicalOperator.lean \
            Zeta23/Spectral/CharacteristicCompactBounds.lean \
            Zeta23/Spectral/CharacteristicNormalization.lean \
            Zeta23/Spectral/CharacteristicXiIdentification.lean \
            Zeta23/Spectral/RealZeroLimitTransfer.lean
      - name: Fast closure integrity tests
        run: |
          python -m compileall -q research/RHRC/closure_batch
          python -m unittest discover -s research/RHRC/closure_batch -p 'test_*.py' -v
          python research/RHRC/closure_batch/run_campaign.py --repo . --output-dir /tmp/closure-results
      - name: Freeze closure campaign research receipts
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          SOURCE_TREE="$(git rev-parse "${SOURCE_COMMIT}^{tree}")"
          python research/RHRC/closure_batch/freeze_receipts.py \
            --results /tmp/closure-results \
            --destination research/RHRC/receipts/PR274_CLOSURE_CAMPAIGN \
            --source-commit "$SOURCE_COMMIT" \
            --source-tree "$SOURCE_TREE"
          python research/RHRC/closure_batch/check_frozen_receipts.py \
            --receipt-dir research/RHRC/receipts/PR274_CLOSURE_CAMPAIGN
      - name: Build graph exporter surfaces
        run: |
          lake build Zeta23.RHRC.RegisteredClaimBindings \
            Zeta23.RHRC.SourceCandidateResolution \
            Zeta23.RHRC.DeclarationDependencyExport
      - name: Render synchronized current-state surfaces
        run: python research/RHRC/control_v2/render_current_state.py --write
      - name: Remove bootstrap-only workflows from tree and index before final graph materialization
        run: |
          bootstrap_workflows=(
            .github/workflows/rhrc_closure_bootstrap.yml
            .github/workflows/rhrc_closure_runtime.yml
            .github/workflows/rhrc_closure_workspace_small.yml
            .github/workflows/rhrc_closure_workspace_split.yml
            .github/workflows/rhrc_closure_materializer.yml
          )
          git rm -f -- "${bootstrap_workflows[@]}"
          for path in "${bootstrap_workflows[@]}"; do
            test ! -e "$path"
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "temporary workflow still tracked after git rm: $path" >&2
              exit 1
            fi
          done
      - name: Freeze materialization index before RHKG regeneration
        run: |
          git add -A
          test -z "$(git ls-files --deleted)"
          test -z "$(git ls-files --others --exclude-standard)"
          git ls-files --error-unmatch             research/RHRC/receipts/PR274_CLOSURE_CAMPAIGN/MANIFEST.json             >/dev/null
          MATERIALIZATION_PATHSET_SHA256="$(
            git ls-files -z | sha256sum | cut -d' ' -f1
          )"
          test -n "$MATERIALIZATION_PATHSET_SHA256"
          echo "MATERIALIZATION_PATHSET_SHA256=$MATERIALIZATION_PATHSET_SHA256" >> "$GITHUB_ENV"
          echo "Materialization path-set SHA256: $MATERIALIZATION_PATHSET_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Regenerate deterministic research graph and assurance layers
        run: |
          python research/RHRC/graph/build.py --write
          python research/RHRC/closure_batch/check_obligation_graph.py
          python research/RHRC/integration/candidate_exactify.py --write
          python research/RHRC/ffbbp/rhkg_assurance.py --write
          python research/RHRC/integration/source_only_dependency_extract.py --write
          python research/RHRC/ool/rhkg_phase_atlas.py --write
      - name: Replay closure campaign against frozen dispositions
        run: |
          rm -rf /tmp/closure-replay
          python research/RHRC/closure_batch/run_campaign.py --repo . --output-dir /tmp/closure-replay
          python research/RHRC/closure_batch/check_frozen_receipts.py \
            --receipt-dir research/RHRC/receipts/PR274_CLOSURE_CAMPAIGN \
            --replay-dir /tmp/closure-replay
      - name: Stage candidate steady-state tree
        run: |
          git add -A
          test -z "$(git ls-files --deleted)"
          test -z "$(git ls-files --others --exclude-standard)"
          CURRENT_PATHSET_SHA256="$(
            git ls-files -z | sha256sum | cut -d' ' -f1
          )"
          test "$CURRENT_PATHSET_SHA256" = "$MATERIALIZATION_PATHSET_SHA256"
          VALIDATED_TREE="$(git write-tree)"
          test -n "$VALIDATED_TREE"
          echo "VALIDATED_TREE=$VALIDATED_TREE" >> "$GITHUB_ENV"
          echo "Candidate steady-state tree: $VALIDATED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - name: Strict steady-state validation
        run: |
          python research/RHRC/graph/build.py --check
          python research/RHRC/graph/validate.py
          python research/RHRC/tools/run_suite.py
          python research/RHRC/audits/post268/verify_frozen.py
          python research/RHRC/tools/arithmetic_firewall_lint.py
          python research/RHRC/tools/million_dollar_firewall_lint.py
          python research/RHRC/tools/axiom_audit.py
          python research/RHRC/tools/axiom_audit.py \
            Zeta23/CCM/CanonicalArchUpperBound.lean \
            Zeta23/CCM/CanonicalFullSpaceSourceBridge.lean \
            Zeta23/CCM/CanonicalModeTailBound.lean \
            Zeta23/CCM/CanonicalPoleSourceBound.lean \
            Zeta23/CCM/CanonicalPrimeSeamTaylor.lean \
            Zeta23/CCM/CanonicalSchurCertificate.lean \
            Zeta23/CCM/CanonicalSeamGroundTransfer.lean \
            Zeta23/CCM/CanonicalSmallApertureCoercivity.lean \
            Zeta23/CCM/CanonicalUniformDomination.lean \
            Zeta23/CCM/GroundComparisonPrinciple.lean \
            Zeta23/CCM/ParityRayleighPerturbation.lean \
            Zeta23/CCM/SourceContraction.lean \
            Zeta23/CCM/SourceContractionLocalized.lean \
            Zeta23/ExceptionalZero/QuantitativeDetectorFamily.lean \
            Zeta23/RHRC/ClosureObligationBindings.lean \
            Zeta23/Spectral/CanonicalCharacteristic.lean \
            Zeta23/Spectral/CanonicalOperator.lean \
            Zeta23/Spectral/CharacteristicCompactBounds.lean \
            Zeta23/Spectral/CharacteristicNormalization.lean \
            Zeta23/Spectral/CharacteristicXiIdentification.lean \
            Zeta23/Spectral/RealZeroLimitTransfer.lean
          python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope closure
          python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope promoted
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git write-tree)" = "$VALIDATED_TREE"
      - name: Commit validated steady state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: research/rh-closure-parallel-campaign
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$VALIDATED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rhrc: materialize closure campaign steady state'
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          test "$FINAL_TREE" = "$VALIDATED_TREE"
          {
            echo "### PR274 steady-state identity"
            echo "- execution input head: $EXPECTED_HEAD"
            echo "- steady-state commit: $FINAL_COMMIT"
            echo "- steady-state tree: $FINAL_TREE"
          } >> "$GITHUB_STEP_SUMMARY"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
          REMOTE_COMMIT="$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$REMOTE_COMMIT" = "$FINAL_COMMIT"
          test "$(git rev-parse "${REMOTE_COMMIT}^{tree}")" = "$VALIDATED_TREE"
      - name: Dispatch final-head RHRC validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: research/rh-closure-parallel-campaign
        run: |
          gh workflow run rhrc.yml --ref "$TARGET_BRANCH"
          echo "Dispatched rhrc.yml against final branch head $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
