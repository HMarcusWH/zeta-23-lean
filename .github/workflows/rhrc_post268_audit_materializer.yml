name: RHRC framework migration and steady-state materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: framework270-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'repair/frameworks-v17-ool277-strict-state' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RHRC framework requirements
        run: python -m pip install -r research/RHRC/requirements.txt

      - name: Materialize and hash-verify the frozen post-268 audit
        run: python .github/post268_prepare.py

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build compiler exporters
        run: lake build Zeta23.RHRC.RegisteredClaimBindings Zeta23.RHRC.DeclarationDependencyExport Zeta23.RHRC.SourceCandidateResolution

      - name: Bootstrap framework unit tests
        run: |
          python -m unittest discover -s research/RHRC/ffbbp/tests -p 'test_*.py' -v
          python -m unittest discover -s research/RHRC/ool/tests -p 'test_*.py' -v
          python research/RHRC/integration/integration_lint.py

      - name: Enter final steady state
        run: |
          rm -rf .github/post268_archive
          rm -f .github/post268_prepare.py
          rm -f .github/workflows/rhrc_post268_audit_materializer.yml

      - name: Regenerate compiler and RHKG products
        run: |
          python research/RHRC/tools/lean_dependency_extract.py --write
          python research/RHRC/graph/build.py --write
          python research/RHRC/integration/candidate_exactify.py --write
          python research/RHRC/ffbbp/rhkg_assurance.py --write
          python research/RHRC/integration/source_only_dependency_extract.py --write
          python research/RHRC/ool/rhkg_phase_atlas.py --write

      - name: Strict steady-state validation
        run: |
          python research/RHRC/graph/build.py --check
          python research/RHRC/graph/validate.py
          python research/RHRC/tools/run_suite.py
          python research/RHRC/audits/post268/verify_frozen.py

      - name: Commit validated steady state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: repair/frameworks-v17-ool277-strict-state
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'frameworks: materialize frozen audit and regenerate strict FFBBP/OoL state'
          git push origin HEAD:refs/heads/$TARGET_BRANCH
