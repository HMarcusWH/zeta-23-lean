name: OPICA scalar prime-deficit definitions and kernel source check
on:
  push:
    branches: [research/opica-prime-deficit-source-20261123]
    paths:
      - .github/workflows/opica-prime-deficit.yml
      - Zeta23/OPICARound6/PrimeDeficit/**
      - research/RHRC/integration/opica_round6/prime_deficit/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opica-prime-deficit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact native source epoch plus negative claim controls
        run: |
          set -euo pipefail
          python3 research/RHRC/integration/opica_round6/prime_deficit/scope.py \
            --output "$RUNNER_TEMP/OPICA_PRIME_DEFICIT_SOURCE.json"
          (cd research/RHRC/integration/opica_round6/prime_deficit &&
            python3 -m unittest -v test_scope)
          (cd research/RHRC/integration/opica_round6/prime_deficit &&
            python3 -O -m unittest -v test_scope)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-prime-deficit-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPICA_PRIME_DEFICIT_SOURCE.json
          if-no-files-found: warn
          retention-days: 90
  compiler:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: .
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Exact compilation and closed supporting lemma, no bridge promotion
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.33.0-rc2"
          lake build Zeta23.OPICARound6.PrimeDeficit.Source
          lake env lean Zeta23/OPICARound6/PrimeDeficit/Verify.lean \
            | tee "$RUNNER_TEMP/OPICA_PRIME_DEFICIT_AXIOMS.log"
          ! grep -E 'sorryAx|error:|unknown identifier' "$RUNNER_TEMP/OPICA_PRIME_DEFICIT_AXIOMS.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-prime-deficit-lean-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPICA_PRIME_DEFICIT_AXIOMS.log
          if-no-files-found: warn
          retention-days: 90
