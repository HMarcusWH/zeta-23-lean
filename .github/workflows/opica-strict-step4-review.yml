name: Strict literal-ramp Step 4 qualification (RH_OPEN)

on:
  push:
    branches: [review/rh-strict-step4-20261126, review/rh-strict-step4-common-pin-20261126]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-step4-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - name: Reconstruct the pinned strict source
        shell: bash
        run: bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "prepare"
      - name: Verify source controls in normal and optimized Python
        shell: bash
        run: bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-step4-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30

  common-frontiers:
    needs: source-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        phase: [perron, native, arithmetic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - name: Reconstruct the pinned strict source
        shell: bash
        run: bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "prepare"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strict-step4-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-lock
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: strict_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Run the selected common-pin frontier
        shell: bash
        run: |
          set -euo pipefail
          export STRICT_LOCKED_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
          bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "${{ matrix.phase }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-step4-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30

  stock-terminal:
    needs: common-frontiers
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        phase: [common, independent]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - name: Reconstruct the pinned strict source
        shell: bash
        run: bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "prepare"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strict-step4-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-lock
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: strict_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compile exact target and audit its transitive proof
        shell: bash
        run: |
          set -euo pipefail
          export STRICT_LOCKED_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
          bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "${{ matrix.phase }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-step4-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30

  checker:
    needs: common-frontiers
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - name: Reconstruct the pinned strict source
        shell: bash
        run: bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "prepare"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strict-step4-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-lock
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: strict_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Install the real sandbox
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/bin/bwrap; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
      - name: Qualify kernel, sandbox and negative controls
        shell: bash
        run: |
          set -euo pipefail
          export STRICT_LOCKED_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
          bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "checker"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-step4-checker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30

  alternate:
    needs: [stock-terminal, checker]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - name: Reconstruct the pinned strict source
        shell: bash
        run: bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "prepare"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strict-step4-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-lock
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: strict_epoch
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Install the real sandbox
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/bin/bwrap; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
      - name: Check the exact Mathlib-only challenge with Nanoda
        shell: bash
        run: |
          set -euo pipefail
          export STRICT_LOCKED_RECEIPT="$RUNNER_TEMP/source-lock/source.json"
          bash verification/opica-strict-step4/run.sh "$GITHUB_WORKSPACE/strict_epoch" "$RUNNER_TEMP/result" "alternate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-step4-alternate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30

  review-packet:
    needs: [source-lock, common-frontiers, stock-terminal, checker, alternate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: strict-step4-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strict-evidence
          merge-multiple: false
      - name: Bind all receipts to the same candidate and attempt
        run: |
          python verification/opica-strict-step4/compare.py compare \
            "$RUNNER_TEMP/strict-evidence" "$RUNNER_TEMP/review/REVIEW_PACKET.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-step4-manual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review/
          if-no-files-found: error
          retention-days: 30
