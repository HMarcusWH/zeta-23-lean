name: RHRC bounded offline workspace chunks
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/rhrc_closure_workspace_small.yml']
permissions:
  contents: read
  actions: read
jobs:
  chunks:
    if: github.head_ref == 'research/rh-closure-parallel-campaign'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36280961006
          pattern: closure-pinned-*
          merge-multiple: true
          path: portable
      - run: |
          split -b 180M -d portable/toolchain.tar.gz portable/tc
          split -b 180M -d portable/proofbase.tar.gz portable/pb
          sha256sum portable/tc* portable/pb* > portable/SMALL.sha256
      - uses: actions/upload-artifact@v4
        with: {name: tc00, path: portable/tc00, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: tc01, path: portable/tc01, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: tc02, path: portable/tc02, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: tc03, path: portable/tc03, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb00, path: portable/pb00, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb01, path: portable/pb01, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb02, path: portable/pb02, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb03, path: portable/pb03, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb04, path: portable/pb04, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb05, path: portable/pb05, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb06, path: portable/pb06, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb07, path: portable/pb07, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb08, path: portable/pb08, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb09, path: portable/pb09, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: pb10, path: portable/pb10, compression-level: 0, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with:
          name: small-manifest
          path: |
            portable/SMALL.sha256
            portable/MANIFEST.json
          retention-days: 3
