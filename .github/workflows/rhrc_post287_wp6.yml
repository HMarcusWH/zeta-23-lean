name: RHRC post287 bounded signed-ray probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp6-source-specific-signed-ray:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned research backend
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Arb-check signs on the genuine K2 negative-shift ray class
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post287/wp6_k2_signed_ray_probe.py --precision-bits 256 --output /tmp/post287-wp6.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post287-wp6-signed-ray
          path: /tmp/post287-wp6.json
