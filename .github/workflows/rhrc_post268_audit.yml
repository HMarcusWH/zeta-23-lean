name: RHRC post268 complete audit replay
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post268-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runner-regressions:
    name: Audit runner adversarial regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test producer-consumer and fail-closed harvest contracts
        run: python -m unittest discover -s research/RHRC/audits/post268/tests -v
  extended:
    name: Extended audit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete numerical environment
        run: |
          python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt networkx
          python -c "import flint; assert flint.__version__ == '0.9.0'"
          mkdir -p "${{ runner.temp }}/post268"
          python -m pip freeze > "${{ runner.temp }}/post268/environment.txt"
      - name: Run every assigned check without hiding failures
        run: python research/RHRC/audits/post268/run_tests.py --shard ${{ matrix.shard }} --shards 8 --output "${{ runner.temp }}/post268"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post268-extended-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/post268
          if-no-files-found: error
          retention-days: 30
  harvest:
    name: Complete 44-check execution harvest
    needs: extended
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: post268-extended-*
          path: ${{ runner.temp }}/post268-shards
      - name: Verify completeness, exact source identities and all log hashes
        run: python research/RHRC/audits/post268/run_tests.py --harvest "${{ runner.temp }}/post268-shards" --output "${{ runner.temp }}/POST268_EXTENDED_HARVEST.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post268-complete-harvest-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/POST268_EXTENDED_HARVEST.json
          if-no-files-found: error
          retention-days: 30
