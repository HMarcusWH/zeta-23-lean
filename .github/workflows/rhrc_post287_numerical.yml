name: RHRC post287 WP2 and WP4 interval research

on:
  workflow_dispatch: # temporarily manual to prevent duplicate 360-minute interval jobs while Lean interfaces iterate; final-head run mandatory before merge

permissions:
  contents: read

jobs:
  wp2-k2-transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned python-flint and research dependencies
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Produce every rational M51 interval and its exact Arb lower enclosure
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post287/wp2_k2_even_transcript.py --output-dir /tmp/wp2-k2 --cells 1-15 --precision-bits 128
      - name: No-search independent interval checker at higher precision
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post287/wp2_verify_transcript.py /tmp/wp2-k2 --precision-bits 192
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post287-wp2-k2-complete-transcript
          path: /tmp/wp2-k2

  wp4-k3-frozen-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Arb evaluation backend
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Evaluate the frozen Q14 384-bit full K3 two-parity feasibility boxes
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post287/wp4_k3_frozen_q14_gate.py --precision-bits 384 --max-boxes 12 --output /tmp/wp4-k3-feasibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post287-wp4-k3-gate
          path: /tmp/wp4-k3-feasibility.json
