name: RHRC post287 focused Step3 checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhrc-post287-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-step3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Parse all WP0-WP7 source scripts and verify the exact integration contract
        run: |
          python research/RHRC/integration/post287/check_implementation_completeness.py
          python research/RHRC/integration/post287/check_post287_ledgers.py
          python research/RHRC/integration/post287/test_post287_gate_mutations.py
      - name: Exact rational WP4 determinant-curvature and fourth-order coefficient regressions
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post287/wp4_determinant_jet_exact_control.py
      - name: Compile ALL new source theorem roots (collect every failure)
        shell: bash
        run: |
          set +e
          failed=0
          for target in \
            Zeta23.CCM.ReciprocalApertureConcavity \
            Zeta23.CCM.K2EvenBottomGluing \
            Zeta23.CCM.K3BottomWindowRecord \
            Zeta23.CCM.GlobalBottomStrictEvenShiftedRay
          do
            if lake build "$target"; then
              echo "$target: COMPILER PASS" | tee -a /tmp/wp0_wp7_focused_build.txt
            else
              echo "$target: COMPILER FAIL" | tee -a /tmp/wp0_wp7_focused_build.txt
              failed=1
            fi
          done
          exit "$failed"
      - name: Reject source proof escapes
        run: |
          python research/RHRC/closure_batch/check_lean_proof_escapes.py --scope promoted

  wp5-modified-prime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned research dependencies
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Arb-certify two modified-prime rational endpoint apertures
        run: |
          python research/RHRC/routes/R003_ccm_bridge/post287/wp5_modified_prime_crossing_certificate.py --precision-bits 256 --output /tmp/post287-wp5.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post287-wp5-modified-prime
          path: /tmp/post287-wp5.json
