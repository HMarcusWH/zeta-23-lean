name: Stage the independently replayed paper and registration products for review
on:
  push:
    branches: [workmode/paper-320-reviewed-generated-publish]
    paths: [.github/workflows/paper-320-combined-publish.yml]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  stage-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Rebuild the exact two-parent review source and authenticate every product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HMarcusWH/zeta-23-lean
          test "$GITHUB_REF" = refs/heads/workmode/paper-320-reviewed-generated-publish
          test "$(git rev-parse HEAD^)" = 236001b317036a49aecb29d9a0d67e0565a6f27c
          main=d4c7fc7114e5f1b61b90ea9037890969358ff0cc
          paper=30b3a430c350eeeef9ff1aa8c99d10cd30dc3fb3
          source=f3c45bf57d9d084f8337616978a3f15e4fa9df4d
          target=refs/heads/review/paper-320-combined-source
          guard_parents() {
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$main"
            test "$(git ls-remote origin refs/heads/docs/papers-2026-11-26-terminal | cut -f1)" = "$paper"
            test "$(git ls-remote origin refs/pull/320/head | cut -f1)" = "$paper"
            test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls/320" --jq '[.state,.base.ref,.head.ref,.head.sha]|join(" ")')" = "open main docs/papers-2026-11-26-terminal $paper"
          }
          guard_parents
          test -z "$(git ls-remote origin "$target")"
          paper_script="$RUNNER_TEMP/paper-scripts"
          out="$RUNNER_TEMP/paper-publication"
          mkdir -p "$paper_script" "$out"
          cp verification/paper-320-combined-review/{build.py,routing.py.inc,verify_candidate.py} "$paper_script/"
          cp verification/paper-320-combined-publish/replay_combined.py "$paper_script/"
          test "$(sha256sum "$paper_script/replay_combined.py" | cut -d' ' -f1)" = 592262655c1f3065eecfbcff924bc4430b525c5b8e2a73568ec607ad4fd542f2
          python3 -B "$paper_script/build.py" "$GITHUB_WORKSPACE"
          test "$(jq -r .commit "$paper_script/layout.json")" = "$source"
          test "$(git show -s --format=%P "$source")" = "$main $paper"
          test "$(git rev-parse "$source^{tree}")" = 1f5bc26c013592a9049b3e8eba2294dd710192a5
          git worktree add --detach "$RUNNER_TEMP/paper-input" "$source"
          python3 -B "$paper_script/verify_candidate.py" "$RUNNER_TEMP/paper-input" before "$paper_script/local-inputs.json"
          test "$(sha256sum "$paper_script/local-inputs.json" | cut -d' ' -f1)" = dc3b1812f8a5e11c1ba262261017a624daa6a708c67c2b503b2526ad92e7f1aa
          api="/repos/$GITHUB_REPOSITORY/actions"
          gh api "$api/runs/46024089651/attempts/1" > "$out/run.json"
          gh api "$api/jobs/140590858656" > "$out/job.json"
          gh api "$api/artifacts/15219454238" > "$out/artifact.json"
          test "$(jq -r .digest "$out/artifact.json")" = sha256:1ffc6fc00b1e0bd417bbd63035b1f01b48703fcaa6617115df8a04ed6f19f2a1
          gh api "$api/artifacts/15219454238/zip" > "$out/artifact.zip"
          python3 -B "$paper_script/replay_combined.py" "$GITHUB_WORKSPACE" "$out"
          tree=$(jq -r .replayed_tree "$out/authenticated-candidate.json")
          test "$tree" = dd10422dc0b48b5e3494823910464a10048edc94
          test "$(jq -r .canonical_patch_sha256 "$out/authenticated-candidate.json")" = 8bb373b8293a4f95a8c19d47aa85efb337108445f2ec6af8cbcb02f23d695a43
          export GIT_AUTHOR_NAME='Closure review' GIT_COMMITTER_NAME='Closure review'
          export GIT_AUTHOR_EMAIL=review@localhost GIT_COMMITTER_EMAIL=review@localhost
          export GIT_AUTHOR_DATE=2026-11-27T17:26:00+00:00 GIT_COMMITTER_DATE=2026-11-27T17:26:00+00:00
          commit=$(git commit-tree "$tree" -p "$source" -m 'Preserve replayed canonical products for main and paper source review')
          test "$commit" = 0242ac003843a5d9bf612d72491d23189e319203
          guard_parents
          git push --force-with-lease="$target:" origin "$commit:$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$commit"
          git show -s --format='%H%n%T%n%P' "$commit" > "$out/review-ref.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper-main-guarded-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paper-publication/authenticated-candidate.json
            ${{ runner.temp }}/paper-publication/review-ref.txt
          if-no-files-found: warn
