name: PR290 one-shot RHKG seal (self-removing build helper)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  seal:
    if: github.event.pull_request.number == 290 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Validate intended source head and consume this one-shot job
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git rm -- .github/workflows/rhrc_post287_rhkg_seal_once.yml
          test ! -e .github/workflows/rhrc_post287_rhkg_seal_once.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r research/RHRC/requirements.txt
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build pinned Lean exporter prerequisites
        run: |
          lake build \
            Zeta23.RHRC.RegisteredClaimBindings \
            Zeta23.RHRC.DeclarationDependencyExport \
            Zeta23.RHRC.SourceCandidateResolution
      - name: Produce exactly the final source-indexed derived-state products
        run: |
          python3 research/RHRC/tools/registered_theorem_binding_lint.py
          python3 research/RHRC/tools/materialize_derived_state.py --write
          python3 research/RHRC/tools/materialize_derived_state.py --check
          python3 research/RHRC/integration/post287/test_rhkg_staleness.py
      - name: Commit all generated RHKG products and remove the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          # git rm above already staged deletion; git add with the deleted path would fail.
          git add -A -- research/RHRC/graph/compiler research/RHRC/graph/generated
          git add -A -- research/RHRC/integration/generated research/RHRC/ffbbp/generated research/RHRC/ool/generated
          git diff --cached --quiet && { echo "Expected graph delta missing" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rhkg): seal PR290 checked-in derived state after all source fixes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
