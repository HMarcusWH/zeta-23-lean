name: RHRC post-190 canonical realizability audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rhrc-post190-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  post190-canonical-realizability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install R003 numerical audit requirements
        run: python -m pip install -r research/RHRC/routes/R003_ccm_bridge/requirements.txt
      - name: Check post-#190 canonical-realizability plumbing
        run: python research/RHRC/routes/R003_ccm_bridge/check_post190_fb05_canonical_realizability_scope.py
      - name: Probe post-#190 canonical-realizability scope
        run: |
          python research/RHRC/routes/R003_ccm_bridge/probe_post190_fb05_canonical_realizability_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post190_fb05_canonical_realizability_v1.json \
            --output /tmp/POST190_FB05_CANONICAL_REALIZABILITY_SCHEDULE.json
      - name: Certify post-#190 canonical realizability
        run: |
          python research/RHRC/routes/R003_ccm_bridge/certify_post190_fb05_canonical_realizability_scope.py \
            --input research/RHRC/routes/R003_ccm_bridge/fixtures/post190_fb05_canonical_realizability_v1.json \
            --schedule /tmp/POST190_FB05_CANONICAL_REALIZABILITY_SCHEDULE.json \
            --output /tmp/POST190_FB05_CANONICAL_REALIZABILITY_CERTIFICATE.json
