name: RHRC post271 cofinal-equivalence steady-state materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: post272-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'audit/post271-cofinal-equivalence' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RHRC framework requirements
        run: python -m pip install -r research/RHRC/requirements.txt

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Compile cofinal equivalence audit and complete registered theorem surface
        run: |
          lake build Zeta23.ExceptionalZero.CofinalArithmeticEquivalenceAudit
          lake build Zeta23.RHRC.RegisteredClaimBindings

      - name: Validate theorem registry and authority firewalls
        run: |
          python research/RHRC/tools/claim_lint.py
          python research/RHRC/tools/registry_lint.py
          python research/RHRC/tools/registered_theorem_binding_lint.py
          python research/RHRC/tools/arithmetic_firewall_lint.py
          python research/RHRC/tools/million_dollar_firewall_lint.py
          python -m unittest research.RHRC.integration.tests.test_integration_foundation -v
          python -m unittest research.RHRC.control_v2.tests.test_current_state_surfaces -v

      - name: Remove one-shot materializer and render post271 living state
        run: |
          rm -f .github/workflows/rhrc_post272_materializer.yml
          python research/RHRC/control_v2/render_current_state.py --write
          git add -A

      - name: Regenerate compiler, RHKG, FFBBP, and OoL products
        run: |
          python research/RHRC/tools/lean_dependency_extract.py --write
          python research/RHRC/graph/build.py --write
          python research/RHRC/integration/candidate_exactify.py --write
          python research/RHRC/ffbbp/rhkg_assurance.py --write
          python research/RHRC/integration/source_only_dependency_extract.py --write
          python research/RHRC/ool/rhkg_phase_atlas.py --write

      - name: Strict final-state validation
        run: |
          lake build Zeta23.ExceptionalZero.CofinalArithmeticEquivalenceAudit
          lake build Zeta23.RHRC.RegisteredClaimBindings
          python research/RHRC/graph/build.py --check
          python research/RHRC/graph/validate.py
          python research/RHRC/control_v2/render_current_state.py --check
          python research/RHRC/tools/run_suite.py
          python research/RHRC/audits/post268/verify_frozen.py

      - name: Commit validated final state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: audit/post271-cofinal-equivalence
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rhrc: materialize post271 cofinal-equivalence audit state'
          git push origin HEAD:refs/heads/$TARGET_BRANCH
