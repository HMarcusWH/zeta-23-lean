name: Verify Round4 Ubuntu package sources on the paper adapter
on:
  push:
    branches: [workmode/paper-320-reviewed-generated-publish]
    paths: [.github/workflows/round4-ubuntu-source-replay.yml]
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      LEAN_NUM_THREADS: '2'
      LANE: FRAMEWORK_ADAPTERS
      REQUESTED_COMMIT: 'e0e97e0f53f20fb8c5b34404c697b0950d3ef46d'
      REPAIR: 'dd3837d6b04aeb39801957d8b73db64e43c3ecd6'
      BASE: 'e0e97e0f53f20fb8c5b34404c697b0950d3ef46d'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'dd3837d6b04aeb39801957d8b73db64e43c3ecd6'
          path: runtime
          sparse-checkout: .github/actions/opica4-runtime
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'e0e97e0f53f20fb8c5b34404c697b0950d3ef46d'
          path: host
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the source and the change to the runtime
        id: source
        shell: bash
        run: |
          set -euo pipefail
          action=.github/actions/opica4-runtime/action.yml
          test "$(git -C runtime rev-parse HEAD)" = "$REPAIR"
          test "$(git -C runtime show -s --format=%P HEAD)" = "$BASE"
          test "$(git -C runtime rev-parse 'HEAD^{tree}')" = 'dd4e7ef0cee96eb89031428103aa8062dbafab5a'
          test "$(git -C runtime diff --name-only "$BASE" HEAD)" = "$action"
          test "$(git -C runtime rev-parse HEAD:"$action")" = 'b89be8e69aad6c5697155ee44baf9a5d8312b04a'
          test "$(git -C runtime hash-object "$action")" = 'b89be8e69aad6c5697155ee44baf9a5d8312b04a'
          test "$(git -C runtime rev-parse "$BASE:$action")" = 7aa0d5103909a5b37d3aca78d4b0c52ca520dacf
          test "$(git -C host rev-parse HEAD)" = "$REQUESTED_COMMIT"
          test "$(git -C host rev-parse 'HEAD^{tree}')" = ae4823637a0c946edc3eb681807cfda087b18e70
          test "$(git -C host rev-parse HEAD:"$action")" = 7aa0d5103909a5b37d3aca78d4b0c52ca520dacf
          test -z "$(git -C host status --porcelain)"
          mkdir -p "$RUNNER_TEMP/round4-apt"
          cat /etc/os-release > "$RUNNER_TEMP/round4-apt/runner-os.txt"
          test -s /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$RUNNER_TEMP/round4-apt/ubuntu.sources"
          git -C runtime show -s --format='%H %T %P' HEAD > "$RUNNER_TEMP/round4-apt/runtime.txt"
          git -C host show -s --format='%H %T %P' HEAD > "$RUNNER_TEMP/round4-apt/paper.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: ./runtime/.github/actions/opica4-runtime
        id: runtime
        with:
          native: 'false'
          provider: 'false'
      - name: Record the required sandbox packages
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package} ${Version}\n' bubblewrap util-linux | tee "$RUNNER_TEMP/round4-apt/packages.txt"
          test "$(grep -c '^ii ' "$RUNNER_TEMP/round4-apt/packages.txt")" -eq 2
          bwrap --version
          findmnt --version
      - name: Run the original Round4 adapter lane
        id: lane
        working-directory: host
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect --unit="opica4-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=4294967296 -p MemorySwapMax=0 -p TasksMax=64 -p CPUQuota=200% \
            -p "WorkingDirectory=$PWD" /usr/bin/env \
            "PATH=$PATH" "HOME=$HOME" PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 LEAN_NUM_THREADS=2 \
            "OPICA_NATIVE_OUTPUT=$OPICA_NATIVE_OUTPUT" "OPICA_NATIVE_CONFIG=$OPICA_NATIVE_CONFIG" \
            python -B -m research.RHRC.integration.opica_composition.cli lane \
            --lane "$LANE" --output "$RUNNER_TEMP/opica4-lanes/$LANE" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --provider-root "$GITHUB_WORKSPACE/provider"
      - name: Seal the original lane output
        id: transport
        working-directory: host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opica4-transports"
          python -B -m research.RHRC.integration.opica_composition.cli transport-pack \
            --lane "$LANE" --input "$RUNNER_TEMP/opica4-lanes/$LANE" \
            --output "$RUNNER_TEMP/opica4-transports/$LANE" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --requested-commit "$REQUESTED_COMMIT" --requested-tree "$(git rev-parse "$REQUESTED_COMMIT^{tree}")"
      - name: Record the tested scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C host status --porcelain)"
          test "$(git -C runtime rev-parse 'HEAD^{tree}')" = 'dd4e7ef0cee96eb89031428103aa8062dbafab5a'
          echo 'Standalone adapter runtime qualification. RH and Step 4 remain OPEN.' > "$RUNNER_TEMP/round4-apt/scope.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round4-ubuntu-apt-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/round4-apt/
            ${{ runner.temp }}/opica4-transports/FRAMEWORK_ADAPTERS/
          if-no-files-found: error
