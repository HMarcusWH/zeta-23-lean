name: OPICA follow-up draft checkpoint

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/opica-native-followup, repair/opica294-audit-20261022]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opica-followup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOLLOWUP: research/RHRC/integration/opica_followup
  PYTHONUTF8: '1'

jobs:
  preparation-contract:
    name: Draft preparation contract (no theorem authority)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python "$FOLLOWUP/validate_contract.py" --phase preflight --output /tmp/opica-followup-contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-followup-preparation
          path: /tmp/opica-followup-contract.json

  subset-formal:
    name: Exact-source implemented subset (full 100 remains required)
    needs: preparation-contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build typed consumers and export complete subset provenance
        env:
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python "$FOLLOWUP/build_receipt.py" --preparation-only
          --requested-head "$REQUESTED_HEAD"
          --requested-base d53dd70d38b0762af130b1d19b795af259f505f5
          --output-dir /tmp/opica-followup-formal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-followup-subset-formal
          path: /tmp/opica-followup-formal

  frozen-regression:
    name: Frozen regression and fail-closed evidence tests
    needs: preparation-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$FOLLOWUP/python-checks.lock"
      - name: Replay all frozen controls and explicitly noninterval numerical cases
        run: python "$FOLLOWUP/replay_controls.py" --modes normal optimized --include-numerical --output-dir /tmp/opica-followup-regression
      - name: Exercise complete child validation suite in both Python modes
        run: |
          python -m unittest discover -s "$FOLLOWUP/tests" -p 'test_*.py'
          python -O -m unittest discover -s "$FOLLOWUP/tests" -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-followup-frozen-regression
          path: /tmp/opica-followup-regression

  full-release-readiness:
    name: Full release readiness (expected FAIL while scope is incomplete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve the complete release gate and report its actual disposition
        run: python "$FOLLOWUP/validate_contract.py" --phase release --output /tmp/opica-followup-release-readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-followup-full-release-readiness
          path: /tmp/opica-followup-release-readiness.json

  isolated-cold-environment:
    name: Isolated cold prerequisite audit and pinned environment export
    if: github.ref == 'refs/heads/repair/opica294-audit-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: 9b6a9a3a2badb4cff62a56c1158d9cef8759d30d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Cold project build with every direct exporter prerequisite
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p /tmp/opica-pinned-export/evidence
          test "$(git rev-parse HEAD)" = 9b6a9a3a2badb4cff62a56c1158d9cef8759d30d
          test "$(git rev-parse HEAD^{tree})" = 545ea182910db9c8d05c4c7e8ee229d119a9aa28
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 51e6992efd06126df61a496bebf8f49482a4e129
          test ! -d .lake/build/lib/lean/Zeta23
          lake env lean --version | tee /tmp/opica-pinned-export/evidence/version.log
          lake build Zeta23.OPICAFollowup.Validation Zeta23.RHRC.OpicaTypeExprExport Zeta23.RHRC.SourceCandidateResolution 2>&1 | tee /tmp/opica-pinned-export/evidence/cold-prerequisites.log
          python "$FOLLOWUP/build_receipt.py" --preparation-only --requested-head 9b6a9a3a2badb4cff62a56c1158d9cef8759d30d --requested-base d53dd70d38b0762af130b1d19b795af259f505f5 --output-dir /tmp/opica-pinned-export/evidence/subset
      - name: Export exact source and portable compiler inputs without credentials
        run: |
          set -euo pipefail
          mkdir -p /tmp/opica-pinned-export/source
          git archive --format=tar HEAD | zstd -T2 -3 -o /tmp/opica-pinned-export/source/source.tar.zst
          { git rev-list HEAD ^97926d6a949fed7af0429a373b47abc772012834; echo 97926d6a949fed7af0429a373b47abc772012834; for c in HEAD d53dd70d38b0762af130b1d19b795af259f505f5 97926d6a949fed7af0429a373b47abc772012834; do git rev-parse "$c^{tree}"; git ls-tree -r -t "$c" | awk '{print $3}'; done; } | sort -u | git pack-objects --stdout > /tmp/opica-pinned-export/source/source-objects.pack
          git rev-parse HEAD HEAD^{tree} > /tmp/opica-pinned-export/source/checkout.txt
          prefix="$(lake env lean --print-prefix)"
          tar -C "$prefix" -cf - . | zstd -T2 -3 | split -b 250M -d - /tmp/opica-pinned-export/toolchain.part
          tar --exclude='.git' -C .lake -cf - packages build | zstd -T2 -3 | split -b 250M -d - /tmp/opica-pinned-export/lake.part
          (cd /tmp/opica-pinned-export && sha256sum toolchain.part* lake.part* source/* > evidence/EXPORT_SHA256.txt)
          du -sh /tmp/opica-pinned-export/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opica-pinned-evidence-and-source
          path: |
            /tmp/opica-pinned-export/evidence
            /tmp/opica-pinned-export/source
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-toolchain-00, path: /tmp/opica-pinned-export/toolchain.part00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-toolchain-01, path: /tmp/opica-pinned-export/toolchain.part01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-toolchain-02, path: /tmp/opica-pinned-export/toolchain.part02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-toolchain-03, path: /tmp/opica-pinned-export/toolchain.part03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-toolchain-04, path: /tmp/opica-pinned-export/toolchain.part04, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-00, path: /tmp/opica-pinned-export/lake.part00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-01, path: /tmp/opica-pinned-export/lake.part01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-02, path: /tmp/opica-pinned-export/lake.part02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-03, path: /tmp/opica-pinned-export/lake.part03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-04, path: /tmp/opica-pinned-export/lake.part04, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-05, path: /tmp/opica-pinned-export/lake.part05, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-06, path: /tmp/opica-pinned-export/lake.part06, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-07, path: /tmp/opica-pinned-export/lake.part07, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-08, path: /tmp/opica-pinned-export/lake.part08, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-09, path: /tmp/opica-pinned-export/lake.part09, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-10, path: /tmp/opica-pinned-export/lake.part10, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-11, path: /tmp/opica-pinned-export/lake.part11, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: opica-lake-12, path: /tmp/opica-pinned-export/lake.part12, compression-level: 0, retention-days: 1}

